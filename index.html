    try{ await DB.salvarConfig({icone:""}); CONFIG.icone = ""; aplicarIcone(""); aviso("Ícone padrão restaurado"); admIcone(); }catch(e){ $("icErro").textContent = erroMsg(e); }
  };
}


/* ============================================================
   ADMIN: RESULTADOS (acompanhamento do quiz)
   ============================================================ */
let admResLic = "", admResDia = -1, admResSala = "*";
function admResultados(){ return painelResultados($("admC"), ehMaster() ? { admin:true } : { salas: SALAS.filter(ehAdminSala) }); }
/* opt.admin: mostra o filtro de sala (todas as salas). opt.salaFixa: mostra só os resultados dos membros daquela sala (para o dono da sala). */
async function painelResultados(c, opt){
  opt = opt || {};
  const deNovo = ()=> painelResultados(c, opt);
  if(!c) return;
  c.innerHTML = `<section class="panel"><p class="vazio">Carregando resultados…</p></section>`;
  let res, usuarios, salasTodas = [], membrosSala = null, salaSel = opt.salaFixa || null;
  try{
    if(opt.admin){ salasTodas = (await DB.listarSalas().catch(()=>[])).filter(x => x.id !== SALA_GLOBAL_ID).sort((a,b)=> String(a.nome).localeCompare(String(b.nome),"pt-BR")); if(admResSala !== "*") salaSel = salasTodas.find(x => x.id === admResSala) || null; if(!salaSel) admResSala = "*"; }
    else if(opt.salas){ salasTodas = opt.salas; salaSel = salasTodas.find(x => x.id === admResSala) || salasTodas[0] || null; if(!salaSel){ c.innerHTML = `<section class="panel"><p class="vazio">Você ainda não administra nenhuma sala.</p></section>`; return; } admResSala = salaSel.id; }
    if(salaSel && !salaSel.global){
      // Uma sala: só os membros dela e os resultados deles
      const ms = (await DB.membrosDaSala(salaSel.id)).filter(m => m.status === "ativo");
      membrosSala = new Set(ms.map(m => m.uid));
      usuarios = ms.map(m => ({ id: m.uid, nome: m.nome, profeta: m.profeta, aprovado: true }));
      res = await DB.resultadosDeUsuarios([...membrosSala]);
    } else [res, usuarios] = await Promise.all([DB.todosResultados(), DB.listarUsuarios()]);
  }
  catch(e){ c.innerHTML = `<section class="panel"><p class="erro">${esc(erroMsg(e))}</p></section>`; return; }
  if(!c.isConnected) return;
  const uMap = {}; usuarios.forEach(u => uMap[u.id] = u);
  res = res.filter(r => { const u = uMap[r.uid]; return (!u || u.aprovado || u.admin) && (!membrosSala || membrosSala.has(r.uid)); });
  const lics = LICOES.filter(L => !licaoFutura(L));
  if(admResLic !== "*" && (!admResLic || !LICOES.some(L => L.id === admResLic))){ const at = LICOES[indiceLicaoAtual()]; admResLic = at ? at.id : (lics[0] ? lics[0].id : ""); }
  const todas = admResLic === "*";
  const L = todas ? null : LICOES.find(x => x.id === admResLic);
  const rs = res.filter(r => todas ? LICOES.some(x => x.id === r.licaoId) : r.licaoId === admResLic);
  const pct = (a,b) => b ? Math.round(100*a/b) : 0;
  const nome = r => (uMap[r.uid] && uMap[r.uid].nome) || r.nome || "?";
  const avatar = r => avatarSVG((uMap[r.uid] && uMap[r.uid].profeta) || r.profeta || PROFETA_PADRAO);
  const diaDe = r => { const l = LICOES.find(x => x.id === r.licaoId); return l ? l.dias.find(d => d.data === r.data) : null; };
  const rotuloDia = r => { const d = diaDe(r); const l = LICOES.find(x => x.id === r.licaoId); return (todas && l ? l.numero + " · " : "") + (d ? d.nome : r.data); };

  let h = `<section class="panel larga ar-filtro">
    ${opt.admin || (opt.salas && salasTodas.length > 1) ? `<div class="field"><label for="arSala">Sala</label><select id="arSala">${opt.admin ? `<option value="*" ${admResSala==="*"?"selected":""}>Todas as salas (7world)</option>` : ""}${salasTodas.map(x => `<option value="${esc(x.id)}" ${x.id===admResSala?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></div>` : ""}
    <div class="field"><label for="arLic">Lição</label><select id="arLic">
      ${LICOES.map(l => `<option value="${esc(l.id)}" ${l.id===admResLic?"selected":""}>${esc(l.numero)}: ${esc(l.titulo)}${l===LICOES[indiceLicaoAtual()]?" (esta semana)":""}</option>`).join("")}
      <option value="*" ${todas?"selected":""}>Trimestre inteiro (todas as lições)</option></select></div></section>`;

  if(!rs.length){
    h += `<section class="panel larga"><p class="vazio">Ninguém ${salaSel ? "da sala " + esc(salaSel.nome) + " " : ""}fez quiz ${todas ? "neste trimestre" : "desta lição"} ainda.</p></section>`;
    c.innerHTML = h; ligarFiltros(); return;
  }

  // ---- Resumo
  const pessoas = new Set(rs.map(r => r.uid)).size;
  const somaAc = rs.reduce((a,r) => a + (r.acertos||0), 0), somaTot = rs.reduce((a,r) => a + (r.total||0), 0);
  const noPrazoN = rs.filter(r => r.noPrazo).length;
  const mediaPts = Math.round(rs.reduce((a,r) => a + (r.pts||0), 0) / rs.length);
  const gabaritos = rs.filter(r => r.total > 0 && r.acertos === r.total).length;
  const semDetalhe = rs.filter(r => !Array.isArray(r.resp) || !r.resp.length).length;
  h += `<section class="panel larga"><h3 class="h3">Visão geral${L ? " · " + esc(L.numero) : " · Trimestre"}${salaSel ? " · " + esc(salaSel.nome) : ""}</h3>
    <div class="stats ar-stats">
      <div class="stat"><b>${pessoas}</b><span>${pessoas===1?"jovem fez quiz":"jovens fizeram quiz"}</span></div>
      <div class="stat"><b>${rs.length}</b><span>${rs.length===1?"quiz feito":"quizzes feitos"}</span></div>
      <div class="stat"><b>${pct(somaAc, somaTot)}%</b><span>de acerto geral (${somaAc} de ${somaTot})</span></div>
      <div class="stat"><b>${pct(noPrazoN, rs.length)}%</b><span>feitos no prazo</span></div>
      <div class="stat"><b>${fmt(mediaPts)}</b><span>pontos por quiz (média)</span></div>
      <div class="stat"><b>${gabaritos}</b><span>${gabaritos===1?"gabarito":"gabaritos"} (todas certas)</span></div>
    </div>
    ${semDetalhe ? `<p class="note">${semDetalhe} ${semDetalhe===1?"quiz foi feito":"quizzes foram feitos"} antes desta versão e ${semDetalhe===1?"não tem":"não têm"} o detalhe por pergunta. As análises abaixo usam só os quizzes com detalhe.</p>` : ""}
  </section>`;

  // ---- Assertividade por dia (ou por lição no trimestre)
  const grupos = {};
  rs.forEach(r => {
    const d = diaDe(r), l = LICOES.find(x => x.id === r.licaoId);
    const chave = todas ? r.licaoId : r.data;
    const g = grupos[chave] || (grupos[chave] = { chave, rotulo: todas ? (l ? l.numero + ": " + l.titulo : r.licaoId) : (d ? d.nome + " · " + dataCurta(d.data) : r.data), ordem: todas ? (l ? LICOES.indexOf(l) : 99) : r.data, n:0, ac:0, tot:0, pts:0, prazo:0, gab:0 });
    g.n++; g.ac += r.acertos||0; g.tot += r.total||0; g.pts += r.pts||0; if(r.noPrazo) g.prazo++; if(r.total>0 && r.acertos===r.total) g.gab++;
  });
  const gl = Object.values(grupos).sort((a,b) => a.ordem < b.ordem ? -1 : 1);
  const comTot = gl.filter(g => g.tot > 0);
  const melhor = comTot.slice().sort((a,b) => pct(b.ac,b.tot) - pct(a.ac,a.tot) || b.n - a.n)[0];
  const pior = comTot.length > 1 ? comTot.slice().sort((a,b) => pct(a.ac,a.tot) - pct(b.ac,b.tot) || b.n - a.n)[0] : null;
  h += `<section class="panel"><h3 class="h3">Assertividade por ${todas ? "lição" : "dia"}</h3>
    ${melhor ? `<div class="ar-dest"><div class="ar-dest-card ok"><span>Maior assertividade</span><b>${esc(melhor.rotulo)}</b><em>${pct(melhor.ac,melhor.tot)}% de acerto · ${melhor.n} ${melhor.n===1?"quiz":"quizzes"}</em></div>
    ${pior && pior !== melhor ? `<div class="ar-dest-card bad"><span>Menor assertividade</span><b>${esc(pior.rotulo)}</b><em>${pct(pior.ac,pior.tot)}% de acerto · ${pior.n} ${pior.n===1?"quiz":"quizzes"}</em></div>` : ""}</div>` : ""}
    <div class="ar-linhas">${gl.map(g => { const p = pct(g.ac,g.tot); return `<div class="ar-linha"><div class="ar-rot"><b>${esc(g.rotulo)}</b><span>${g.n} ${g.n===1?"quiz":"quizzes"} · ${g.prazo} no prazo · ${fmt(Math.round(g.pts/g.n))} pts em média${g.gab?` · ${g.gab} gabarito${g.gab>1?"s":""}`:""}</span></div><div class="ar-bar"><i style="width:${p}%" class="${p>=80?"ok":p>=60?"meio":"bad"}"></i></div><div class="ar-pct">${g.tot ? p + "%" : "—"}</div></div>`; }).join("")}</div>
  </section>`;

  // ---- Por pergunta (só quizzes com detalhe)
  const det = rs.filter(r => Array.isArray(r.resp) && r.resp.length);
  const perg = {};
  det.forEach(r => r.resp.forEach(a => {
    if(a.r) return;
    const chave = r.licaoId + "|" + r.data + "|" + a.p;
    const q = perg[chave] || (perg[chave] = { chave, p: a.p, onde: rotuloDia(r), n:0, err:0, tempo:0, escolhas:{}, certa: a.c, licaoId: r.licaoId, data: r.data });
    q.n++; if(!a.ok) q.err++; if(a.k === -1) q.tempo++;
    if(a.k >= 0){ const e = q.escolhas[a.k] || (q.escolhas[a.k] = { n:0, o: a.o }); e.n++; if(!e.o && a.o) e.o = a.o; }
  }));
  const pl = Object.values(perg);
  const opcaoTxt = (q, k) => { const l = LICOES.find(x => x.id === q.licaoId), d = l && l.dias.find(x => x.data === q.data), orig = d && d.perguntas.find(x => x.p === q.p); return (q.escolhas[k] && q.escolhas[k].o) || (orig && orig.o[k]) || ("Opção " + LETRAS[k]); };
  const maisErradas = pl.filter(q => q.err > 0).sort((a,b) => pct(b.err,b.n) - pct(a.err,a.n) || b.err - a.err).slice(0, 10);
  const maisCertas = pl.filter(q => q.n >= 2).sort((a,b) => pct(b.n-b.err,b.n) - pct(a.n-a.err,a.n) || b.n - a.n).slice(0, 5);
  const cardPerg = (q, modo) => {
    const p = modo === "err" ? pct(q.err,q.n) : pct(q.n-q.err,q.n);
    const erradas = Object.keys(q.escolhas).filter(k => +k !== q.certa).sort((a,b) => q.escolhas[b].n - q.escolhas[a].n);
    const topErr = erradas[0];
    return `<div class="ar-perg"><div class="ar-perg-top"><span class="ar-onde">${esc(q.onde)}</span><b class="${modo==="err"?"bad":"ok"}">${p}% ${modo==="err"?"erraram":"acertaram"}</b></div>
      <p class="ar-q">${esc(q.p)}</p>
      <div class="ar-bar"><i style="width:${p}%" class="${modo==="err"?"bad":"ok"}"></i></div>
      <p class="muted small" style="margin:6px 0 0">${q.n} ${q.n===1?"resposta":"respostas"} · ${q.n-q.err} certa${q.n-q.err!==1?"s":""} · ${q.err} errada${q.err!==1?"s":""}${q.tempo?` (${q.tempo} por tempo esgotado)`:""}<br>Certa: <b>${LETRAS[q.certa]}</b> ${esc(opcaoTxt(q, q.certa))}${topErr != null ? `<br>Erro mais comum: <b>${LETRAS[+topErr]}</b> ${esc(opcaoTxt(q, +topErr))} (${q.escolhas[topErr].n}×)` : ""}</p></div>`;
  };
  h += `<section class="panel"><h3 class="h3">Perguntas mais erradas</h3>
    ${maisErradas.length ? `<p class="muted small" style="margin:0 0 10px">As que mais confundiram a turma. Vale retomar na classe.</p><div class="ar-pergs">${maisErradas.map(q => cardPerg(q,"err")).join("")}</div>` : `<p class="vazio">${det.length ? "Ninguém errou nenhuma pergunta até agora." : "Ainda não há quizzes com detalhe por pergunta."}</p>`}
  </section>`;
  if(maisCertas.length) h += `<section class="panel"><h3 class="h3">Perguntas mais acertadas</h3><div class="ar-pergs">${maisCertas.map(q => cardPerg(q,"ok")).join("")}</div></section>`;

  // ---- Reflexão (a última pergunta, sem resposta errada)
  const refl = {};
  det.forEach(r => r.resp.forEach(a => {
    if(!a.r) return;
    const chave = r.licaoId + "|" + r.data + "|" + a.p;
    const q = refl[chave] || (refl[chave] = { chave, p: a.p, onde: rotuloDia(r), ordem: r.data, n:0, escolhas:{}, licaoId: r.licaoId, data: r.data });
    q.n++; if(a.k >= 0){ const e = q.escolhas[a.k] || (q.escolhas[a.k] = { n:0, o: a.o, quem: [] }); e.n++; if(!e.o && a.o) e.o = a.o; e.quem.push(r); }
  }));
  const rl = Object.values(refl).sort((a,b) => a.ordem < b.ordem ? -1 : 1);
  h += `<section class="panel"><h3 class="h3">Reflexão: o que a turma escolheu</h3>
    <p class="muted small" style="margin:0 0 12px">A última pergunta de cada dia não tem resposta errada. Veja a opção mais escolhida e quem escolheu cada uma, para levar o debate para a classe.</p>
    ${rl.length ? rl.map(q => {
      const ks = Object.keys(q.escolhas).map(Number).sort((a,b) => q.escolhas[b].n - q.escolhas[a].n || a - b);
      const top = ks[0], empate = ks.filter(k => q.escolhas[k].n === q.escolhas[top].n);
      return `<div class="ar-refl"><span class="ar-onde">${esc(q.onde)}</span><p class="ar-q">${esc(q.p)}</p>
        ${ks.map(k => { const e = q.escolhas[k], p = pct(e.n, q.n); return `<div class="ar-opt ${empate.includes(k)?"top":""}"><div class="ar-opt-h"><span class="letter">${LETRAS[k]}</span><span class="ar-opt-t">${esc(e.o || opcaoTxt(q,k))}</span><b>${e.n} (${p}%)</b></div><div class="ar-bar"><i style="width:${p}%" class="${k===top?"ok":"meio"}"></i></div><div class="chips ar-quem">${e.quem.map(r => `<span class="chip">${avatar(r)}${esc(nome(r))}</span>`).join("")}</div></div>`; }).join("")}
        ${top == null ? "" : empate.length > 1 ? `<p class="note" style="margin-top:8px">Empate entre ${empate.map(k => "<b>" + LETRAS[k] + "</b>").join(", ")} (${q.escolhas[top].n} ${q.escolhas[top].n===1?"escolha":"escolhas"} cada). Bom gancho para o debate.</p>` : `<p class="note" style="margin-top:8px">Mais escolhida: <b>${LETRAS[top]}</b> — ${esc(q.escolhas[top].o || opcaoTxt(q,top))} (${q.escolhas[top].n} de ${q.n}).</p>`}</div>`;
    }).join("") : `<p class="vazio">Ainda não há respostas de reflexão registradas.</p>`}
  </section>`;

  // ---- Por jovem
  const porU = {};
  rs.forEach(r => { const u = porU[r.uid] || (porU[r.uid] = { r, n:0, ac:0, tot:0, pts:0, prazo:0 }); u.n++; u.ac += r.acertos||0; u.tot += r.total||0; u.pts += r.pts||0; if(r.noPrazo) u.prazo++; });
  const ul = Object.values(porU).sort((a,b) => b.pts - a.pts || pct(b.ac,b.tot) - pct(a.ac,a.tot));
  h += `<section class="panel larga"><h3 class="h3">Por jovem</h3><ul class="lista cols">${ul.map((u,i) => `<li><div class="em">${avatar(u.r)}</div><div class="info"><strong>${i+1}º ${esc(nome(u.r))}</strong><span>${u.n} ${u.n===1?"quiz":"quizzes"} · ${u.prazo} no prazo · ${pct(u.ac,u.tot)}% de acerto (${u.ac} de ${u.tot})</span></div><div class="pts">${fmt(u.pts)}</div></li>`).join("")}</ul></section>`;

  c.innerHTML = h;
  ajustarGradeAdmin(c);
  ligarFiltros();
  function ligarFiltros(){
    const l = c.querySelector("#arLic"); if(l) l.onchange = e => { admResLic = e.target.value; deNovo(); };
    const sl = c.querySelector("#arSala"); if(sl) sl.onchange = e => { admResSala = e.target.value; deNovo(); };
  }
}

/* ============================================================
   SALAS (turmas)
   - Sala global "7world": todo mundo entra automaticamente e não dá para sair.
   - Cada pessoa cria até 3 salas e participa de até 5 (fora a global). Admin não tem limite.
   - Sala pública: entra na hora. Sala privada: o dono aprova a solicitação.
   - Entrada por código, por link de convite (?sala=CODIGO) ou pela lista de salas públicas.
   Coleções: salas/{id} e membros/{salaId_uid} (status "ativo" | "pendente").
   ============================================================ */
const SALA_GLOBAL_ID = "7world";
const SALA_GLOBAL = { id: SALA_GLOBAL_ID, nome: "7world", codigo: "7WORLD", publica: true, global: true, dono: "", descricao: "Sala global: todo mundo que joga está aqui." };
const MAX_SALAS_CRIADAS = 3, MAX_SALAS_PARTICIPA = 5;

/* Convite por link: guarda o código e limpa a URL (sobrevive ao login/cadastro) */
(function(){
  try{
    const q = new URLSearchParams(location.search), c = q.get("sala");
    if(c){ lsSet(KEY + ":convite", normalizarCodigo(c)); q.delete("sala"); const resto = q.toString(); history.replaceState(null, "", location.pathname + (resto ? "?" + resto : "") + location.hash); }
  }catch(e){}
})();
function normalizarCodigo(c){ return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12); }
function salaAtual(){ return SALA || SALA_GLOBAL; }
function novoMembro(salaId, status, papel){ return { salaId, uid: usuario.uid, nome: perfil.nome || "", profeta: perfil.profeta || "", status, papel: papel || "membro", quando: Date.now() }; }
function ehDonoSala(s){ return !!(s && !s.global && usuario && s.dono === usuario.uid); }
function podeGerenciarSala(s){ return !!s && (ehMaster() || (!s.global && (ehDonoSala(s) || ehAdminSala(s)))); }
/* Incluir qualquer usuário direto na sala: só o master e o administrador atribuído àquela sala */
function podeIncluirNaSala(s){ return !!s && !s.global && (ehMaster() || ehAdminSala(s)); }
function minhasParticipacoes(){ return SALAS.filter(x => !x.global).length + SALAS_PEDIDOS.length; }
function badgesSala(s){
  return (s.global ? '<span class="badge adm">Global</span>' : s.publica ? '<span class="badge ok">Pública</span>' : '<span class="badge warn">Privada</span>')
    + (ehDonoSala(s) ? '<span class="badge">Você criou</span>' : "") + (ehAdminSala(s) ? '<span class="badge adm">Você administra</span>' : "");
}

async function carregarSalas(){
  SALAS_ERRO = ""; SALAS_PENDENTES = 0;
  const eu = usuario.uid;
  try{
    const mems = await DB.membrosDoUsuario(eu);
    // Sala global: o admin cria o documento na primeira vez; todo mundo entra sozinho
    let global = null; try{ global = await DB.getSala(SALA_GLOBAL_ID); }catch(e){}
    if(!global && ehMaster()){
      const doc = { nome: SALA_GLOBAL.nome, codigo: SALA_GLOBAL.codigo, publica: true, global: true, dono: eu, donoNome: perfil.nome || "", descricao: SALA_GLOBAL.descricao, criadaEm: Date.now() };
      try{ await DB.salvarSala(SALA_GLOBAL_ID, doc); global = Object.assign({ id: SALA_GLOBAL_ID }, doc); }catch(e){}
    }
    if(!mems.some(m => m.salaId === SALA_GLOBAL_ID)){ const m = novoMembro(SALA_GLOBAL_ID, "ativo", "membro"); await DB.salvarMembro(m); mems.push(m); }
    const salaG = Object.assign({}, SALA_GLOBAL, global || {}, { id: SALA_GLOBAL_ID, global: true, publica: true, meu: mems.find(m => m.salaId === SALA_GLOBAL_ID) });
    const outras = mems.filter(m => m.salaId !== SALA_GLOBAL_ID);
    const docs = await Promise.all(outras.map(m => DB.getSala(m.salaId).catch(() => undefined)));
    const ativas = [], pedidos = [];
    outras.forEach((m, i) => {
      const s = docs[i];
      if(s === null){ DB.excluirMembro(m.salaId, eu).catch(()=>{}); return; }   // a sala foi excluída
      if(!s) return;                                                             // falha de leitura: ignora por enquanto
      s.meu = m; (m.status === "ativo" ? ativas : pedidos).push(s);
    });
    ativas.sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
    SALAS = [salaG].concat(ativas); SALAS_PEDIDOS = pedidos;
    // Mantém meu nome/profeta atualizados nas salas
    const nv = typeof nivelAtual === "function" ? nivelAtual() : 0;
    mems.forEach(m => { if(m.nome !== (perfil.nome || "") || m.profeta !== (perfil.profeta || "") || (m.nivel || 0) !== nv) DB.salvarMembro({ salaId: m.salaId, uid: eu, nome: perfil.nome || "", profeta: perfil.profeta || "", nivel: nv }).catch(()=>{}); });
    // Solicitações esperando a minha aprovação (salas privadas que eu criei)
    const minhas = SALAS.filter(x => !x.global && !x.publica && podeGerenciarSala(x));
    const listas = await Promise.all(minhas.map(x => DB.membrosDaSala(x.id).catch(() => [])));
    minhas.forEach((x, i) => { x.pendentes = listas[i].filter(m => m.status === "pendente").length; SALAS_PENDENTES += x.pendentes; });
  }catch(e){
    console.warn("salas", e); SALAS_ERRO = erroMsg(e);
    if(!SALAS.length) SALAS = [Object.assign({}, SALA_GLOBAL, { meu: null })];
  }
  const pref = lsGet(KEY + ":sala:" + eu, SALA_GLOBAL_ID);
  SALA = SALAS.find(x => x.id === pref) || SALAS[0];
  membrosCache = {}; resCache = {};
  atualizarCasca();
}
function definirSala(id){
  const s = SALAS.find(x => x.id === id); if(!s) return;
  SALA = s; lsSet(KEY + ":sala:" + usuario.uid, id);
}
/* UIDs dos membros ativos de uma sala (null = sala global, vale todo mundo). Guarda por 60 s. */
async function membrosAtivos(s){
  s = s || salaAtual();
  if(!s || s.global) return null;
  const c = membrosCache[s.id];
  if(c && Date.now() - c.em < 60000) return c.set;
  const lista = (await DB.membrosDaSala(s.id)).filter(m => m.status === "ativo");
  const set = new Set(lista.map(m => m.uid));
  membrosCache[s.id] = { set, lista, em: Date.now() };
  return set;
}
/* Resultados da sala, sem baixar o jogo inteiro. escopo = {licaoId} (uma lição) ou {trimestre}.
   Sala comum: só os resultados dos membros. Sala global: todos daquela lição/trimestre. Guarda por 60 s. */
async function resultadosDaSala(s, escopo){
  s = s || salaAtual();
  const chave = s.id + "|" + (escopo.licaoId || "tri:" + escopo.trimestre);
  const c = resCache[chave];
  if(c && Date.now() - c.em < 60000) return c.res;
  let res;
  if(s.global) res = escopo.licaoId ? await DB.resultadosLicao(escopo.licaoId) : await DB.resultadosTrimestre(escopo.trimestre);
  else {
    const uids = [...(await membrosAtivos(s))];
    res = await DB.resultadosDeUsuarios(uids, escopo.licaoId || null);
    if(!escopo.licaoId) res = res.filter(r => r.trimestre === escopo.trimestre);
  }
  resCache[chave] = { res, em: Date.now() };
  return res;
}
function limparCacheResultados(){ resCache = {}; }
/* Nome e profeta de cada pessoa da sala, a partir dos membros e dos próprios resultados (sem listar todos os usuários) */
function pessoasDaSala(s, res){
  const m = {};
  (res || []).forEach(r => { const a = m[r.uid]; if(!a || (r.quando || 0) >= a.q) m[r.uid] = { nome: r.nome || (a && a.nome) || "?", profeta: r.profeta || (a && a.profeta) || "", nivel: Math.max(r.nivel || 0, (a && a.nivel) || 0), q: r.quando || 0 }; else if((r.nivel || 0) > (a.nivel || 0)) a.nivel = r.nivel; });
  const c = s && membrosCache[s.id];
  if(c) c.lista.forEach(x => { m[x.uid] = { nome: x.nome || (m[x.uid] && m[x.uid].nome) || "?", profeta: x.profeta || (m[x.uid] && m[x.uid].profeta) || "", nivel: Math.max(x.nivel || 0, (m[x.uid] && m[x.uid].nivel) || 0), q: 0 }; });
  if(usuario && perfil && m[usuario.uid]) m[usuario.uid] = { nome: perfil.nome || "?", profeta: perfil.profeta || "", nivel: meuNivel(), q: 0 };
  return m;
}
async function novoCodigoSala(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  for(let t = 0; t < 8; t++){
    let c = ""; for(let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)];
    if(c !== SALA_GLOBAL.codigo && !(await DB.salaPorCodigo(c))) return c;
  }
  throw new Error("Não deu para gerar o código da sala. Tente de novo.");
}
function linkSala(s){ return location.origin + location.pathname + "?sala=" + encodeURIComponent(s.codigo); }
async function copiarTexto(t, msg){
  try{ await navigator.clipboard.writeText(t); aviso(msg || "Copiado"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); aviso(msg || "Copiado"); }catch(e2){ aviso("Não deu para copiar. Copie manualmente."); }
    ta.remove();
  }
}

      <div class="sala-acoes">
        <button class="btn ${ehAtiva ? "btn-main" : "btn-ghost"} btn-sm" data-ver="${esc(s.id)}">${ehAtiva ? "Ver a corrida" : "Usar esta sala"}</button>
        <button class="btn btn-ghost btn-sm" data-mural="${esc(s.id)}">Mural</button>
        <button class="btn btn-ghost btn-sm" data-convidar="${esc(s.id)}">Convidar</button>
        ${podeGerenciarSala(s) ? `<button class="btn btn-ghost btn-sm" data-gerenciar="${esc(s.id)}">Gerenciar${s.pendentes ? ` <span class="nav-n fixo">${s.pendentes}</span>` : ""}</button>` : ""}
        ${!s.global && !ehDonoSala(s) ? `<button class="btn btn-ghost btn-sm" data-sair="${esc(s.id)}">Sair</button>` : ""}
      </div></article>`;
  };
  app.innerHTML = `<div class="result-area duas"><div class="lado">
    <header class="hero" style="padding-bottom:14px"><div class="tag"><span class="box">Salas</span><span class="date">${ehMaster() ? "sem limite (master)" : `${part} de ${MAX_SALAS_PARTICIPA} · criadas ${criadas} de ${MAX_SALAS_CRIADAS}`}</span></div>
      <h1 class="rolo-h">Minhas<span class="hl">Salas</span></h1>
      <p>Cada sala tem a sua corrida, equipes e mural. A sala ativa é a que aparece na Corrida e no Início.</p></header>
    ${SALAS_ERRO ? `<section class="panel"><p class="erro" style="margin:0">Não deu para carregar as salas agora (${esc(SALAS_ERRO)}). Por enquanto você continua na sala global.</p></section>` : ""}
    <div class="sala-barra"><button class="btn btn-main" id="slCriar">+ Criar sala</button><button class="btn btn-ghost" id="slCodigo">Entrar com código</button><button class="btn btn-ghost" id="slPublicas">Salas públicas</button></div></div>
    <div class="principal"><div class="salas-grid">${SALAS.map(cartao).join("")}</div>
    ${SALAS_PEDIDOS.length ? `<section class="panel"><h3 class="h3">Aguardando aprovação</h3><ul class="lista">${SALAS_PEDIDOS.map(s => `<li><div class="info"><strong>${esc(s.nome)}</strong><span>Sala privada${s.donoNome ? " de " + esc(s.donoNome) : ""}. O dono precisa aprovar a sua entrada.</span></div><button class="btn btn-ghost btn-sm" data-cancelar="${esc(s.id)}">Cancelar</button></li>`).join("")}</ul></section>` : ""}
  </div></div>`;
  const achar = id => SALAS.find(x => x.id === id) || SALAS_PEDIDOS.find(x => x.id === id);

  app.querySelectorAll("[data-convidar]").forEach(b => b.onclick = () => convidarSala(achar(b.dataset.convidar)));
  app.querySelectorAll("[data-gerenciar]").forEach(b => b.onclick = () => modalGerenciarSala(achar(b.dataset.gerenciar)));

  app.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = async () => { ocupado(b, true); try{ await DB.excluirMembro(b.dataset.cancelar, eu); aviso("Solicitação cancelada"); }catch(e){ aviso(erroMsg(e)); } telaSalas(); });
  // Quantidade de membros (carrega depois, sem travar a tela)
  SALAS.filter(x => !x.global).forEach(async s => {
    try{ const set = await membrosAtivos(s); const el = app.querySelector(`[data-conta="${CSS.escape(s.id)}"]`); if(el) el.textContent = set.size + (set.size === 1 ? " membro" : " membros"); }
    catch(e){ const el = app.querySelector(`[data-conta="${CSS.escape(s.id)}"]`); if(el) el.textContent = ""; }
  });
}

/* ---------- Criar ---------- */
async function modalCriarSala(){
  if(!ehMaster()){
    let criadas = SALAS.filter(x => ehDonoSala(x)).length;
    try{ criadas = Math.max(criadas, (await DB.salasDoDono(usuario.uid)).filter(x => x.id !== SALA_GLOBAL_ID).length); }catch(e){}
    if(criadas >= MAX_SALAS_CRIADAS){ modal("Limite de salas", `<p>Você já criou ${MAX_SALAS_CRIADAS} salas, que é o máximo por pessoa. Para criar outra, exclua uma das suas salas em <b>Gerenciar</b>.</p>`); return; }
    if(minhasParticipacoes() >= MAX_SALAS_PARTICIPA){ modal("Limite de salas", `<p>Você já participa de ${MAX_SALAS_PARTICIPA} salas (fora a global), que é o máximo. Saia de uma sala para poder criar outra.</p>`); return; }
  }
  let publica = true;
  modal("Criar sala", `<div class="field"><label for="csNome">Nome da sala</label><input type="text" id="csNome" maxlength="30" placeholder="Ex.: Jovens IASD Liberdade"></div>
    <div class="field"><label for="csDesc">Descrição (opcional)</label><input type="text" id="csDesc" maxlength="80" placeholder="Ex.: Classe dos jovens, sábado de manhã"></div>
    <div class="field"><label>Quem pode entrar</label>
      <div class="tabs" role="tablist" style="margin:0"><button type="button" role="tab" aria-selected="true" data-tipo="1">Pública</button><button type="button" role="tab" aria-selected="false" data-tipo="0">Privada</button></div>
      <span class="hint" id="csDica"></span></div>
    <p class="erro" id="csErro"></p><div class="btn-row uma"><button class="btn btn-main" id="csOk">Criar sala</button></div>`, (m, fechar) => {
    const dica = () => m.querySelector("#csDica").textContent = publica ? "Pública: aparece na lista de salas e qualquer pessoa entra na hora, pelo código, link ou lista." : "Privada: não aparece na lista. Quem tiver o código ou o link pede para entrar e você aprova.";
    m.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { publica = b.dataset.tipo === "1"; m.querySelectorAll("[data-tipo]").forEach(x => x.setAttribute("aria-selected", String(x === b))); dica(); });
    dica();
    m.querySelector("#csOk").onclick = async () => {
      const nome = m.querySelector("#csNome").value.trim().replace(/\s+/g, " "), desc = m.querySelector("#csDesc").value.trim(), erro = m.querySelector("#csErro");
      if(nome.length < 3){ erro.textContent = "Dê um nome com pelo menos 3 letras."; return; }
      if(nome.toLowerCase() === SALA_GLOBAL.nome.toLowerCase()){ erro.textContent = "Esse nome é da sala global. Escolha outro."; return; }
      const b = m.querySelector("#csOk"); ocupado(b, true); erro.textContent = "";
      try{
        const codigo = await novoCodigoSala();
        const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        await DB.salvarSala(id, { nome, descricao: desc, codigo, publica, global: false, dono: usuario.uid, donoNome: perfil.nome || "", criadaEm: Date.now() });
        await DB.salvarMembro(novoMembro(id, "ativo", "dono"));
        fechar(); await carregarSalas(); definirSala(id); aviso("Sala criada!");
        if(tabAtual === "admin") telaAdmin(); else { tabAtual = "salas"; atualizarCasca(); await telaSalas(false); }
        const s = SALAS.find(x => x.id === id); if(s) convidarSala(s, true);
      }catch(e){ erro.textContent = erroMsg(e); ocupado(b, false); }
    };
  });
}

/* ---------- Convidar ---------- */
function convidarSala(s, nova){
  if(!s) return;
  const link = linkSala(s);
  const texto = `Entre na sala "${s.nome}" no Quiz da Lição e venha correr com a gente!\nCódigo da sala: ${s.codigo}`;
  modal(nova ? "Sala criada! Convide a turma" : "Convidar para " + s.nome, `<div class="convite"><span>Código da sala</span><b>${esc(s.codigo)}</b></div>
    <p class="muted small center" style="margin:8px 0 12px">${s.global ? "Esta é a sala global: quem cria a conta já entra nela." : s.publica ? "Sala pública: quem abrir o link ou digitar o código entra na hora." : "Sala privada: quem abrir o link ou digitar o código pede para entrar, e você aprova em Gerenciar."}</p>
    <div class="field"><label for="cvLink">Link de convite</label><input type="text" id="cvLink" readonly value="${esc(link)}"></div>
    <div class="btn-row">${navigator.share ? `<button class="btn btn-wa" id="cvShare">Enviar convite</button>` : ""}<button class="btn ${navigator.share ? "btn-ghost" : "btn-main"}" id="cvCopiar">Copiar link</button><button class="btn btn-ghost" id="cvCodigo">Copiar código</button></div>`, (m) => {
    const sh = m.querySelector("#cvShare"); if(sh) sh.onclick = async () => { try{ await navigator.share({ title: "Quiz da Lição · " + s.nome, text: texto, url: link }); }catch(e){ if(!e || e.name !== "AbortError") copiarTexto(texto + "\n" + link, "Convite copiado"); } };
    m.querySelector("#cvCopiar").onclick = () => copiarTexto(texto + "\n" + link, "Convite copiado");
    m.querySelector("#cvCodigo").onclick = () => copiarTexto(s.codigo, "Código copiado");
    m.querySelector("#cvLink").onfocus = e => e.target.select();
  });
}

/* ---------- Entrar ---------- */
function modalEntrarCodigo(pre){
  modal("Entrar com código", `<div class="field"><label for="ecCod">Código da sala</label><input type="text" id="ecCod" maxlength="12" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Ex.: K7M2QX" value="${esc(pre || "")}" style="text-transform:uppercase;letter-spacing:3px;font-weight:800;text-align:center;font-size:22px"></div>
    <p class="note">Peça o código para quem criou a sala. Ele tem 6 letras e números.</p>
    <p class="erro" id="ecErro"></p><div class="btn-row uma"><button class="btn btn-main" id="ecOk">Procurar sala</button></div>`, (m, fechar) => {
    const ir = async () => {
      const cod = normalizarCodigo(m.querySelector("#ecCod").value), erro = m.querySelector("#ecErro"), b = m.querySelector("#ecOk");
      if(cod.length < 4){ erro.textContent = "Digite o código da sala."; return; }
      ocupado(b, true); erro.textContent = "";
      try{
        const s = cod === SALA_GLOBAL.codigo ? SALAS[0] : await DB.salaPorCodigo(cod);
        if(!s){ erro.textContent = "Não achei nenhuma sala com esse código. Confira e tente de novo."; ocupado(b, false); return; }
        fechar(); confirmarEntrada(s);
      }catch(e){ erro.textContent = erroMsg(e); ocupado(b, false); }
    };
    m.querySelector("#ecOk").onclick = ir;
    m.querySelector("#ecCod").addEventListener("keydown", e => { if(e.key === "Enter") ir(); });
  });
}
/* Mostra a sala encontrada e pede a confirmação antes de entrar */
function confirmarEntrada(s){
  const ja = SALAS.find(x => x.id === s.id), pedido = SALAS_PEDIDOS.find(x => x.id === s.id);
  if(ja){ definirSala(s.id); aviso(`Você já está na sala ${s.nome}`); if(tabAtual === "salas") telaSalas(false); return; }
  if(pedido){ aviso("Você já pediu para entrar nesta sala. Aguarde a aprovação."); return; }
  modal("Entrar na sala", `<div class="sala-achada"><h3>${esc(s.nome)}</h3><div>${badgesSala(s)}</div>${s.descricao ? `<p>${esc(s.descricao)}</p>` : ""}<p class="muted small">${s.donoNome ? "Criada por " + esc(s.donoNome) + ". " : ""}${s.publica ? "Sala pública: você entra na hora." : "Sala privada: o dono precisa aprovar a sua entrada."}</p></div>
    <p class="erro" id="ceErro"></p><div class="btn-row"><button class="btn btn-main" id="ceOk">${s.publica ? "Entrar na sala" : "Pedir para entrar"}</button><button class="btn btn-ghost" id="ceNao">Agora não</button></div>`, (m, fechar) => {
    m.querySelector("#ceNao").onclick = fechar;
    m.querySelector("#ceOk").onclick = async () => {
      const b = m.querySelector("#ceOk"); ocupado(b, true);
      try{ await entrarNaSala(s); fechar(); }catch(e){ m.querySelector("#ceErro").textContent = erroMsg(e); ocupado(b, false); }
    };
  });
}
async function entrarNaSala(s){
  if(!ehMaster() && minhasParticipacoes() >= MAX_SALAS_PARTICIPA) throw new Error(`Você já participa de ${MAX_SALAS_PARTICIPA} salas (fora a global), que é o máximo. Saia de uma para entrar em outra.`);
  const direto = s.publica || ehMaster() || s.dono === usuario.uid || ehAdminSala(s);
  await DB.salvarMembro(novoMembro(s.id, direto ? "ativo" : "pendente", s.dono === usuario.uid ? "dono" : "membro"));
  await carregarSalas();
  if(direto){ definirSala(s.id); aviso(`Você entrou na sala ${s.nome}!`); }
  else aviso("Pedido enviado! Você entra assim que o dono da sala aprovar.");
  if(tabAtual === "salas") telaSalas(false); else if(tabAtual === "ranking" || tabAtual === "inicio") nav(tabAtual);
}
async function sairDaSala(s){
  if(!s || s.global) return;
  if(!(await confirmar("Sair da sala", `Sair da sala "${s.nome}"? Seus pontos continuam guardados; você só deixa de aparecer na corrida dela.`, "Sair da sala", "btn-warn"))) return;
  try{ await DB.excluirMembro(s.id, usuario.uid); aviso("Você saiu da sala"); }catch(e){ aviso(erroMsg(e)); }
  telaSalas();
}
async function modalSalasPublicas(){
  modal("Salas públicas", `<div class="field"><input type="search" id="spBusca" placeholder="Buscar pelo nome da sala" aria-label="Buscar sala"></div><div id="spLista"><p class="vazio">Carregando…</p></div>`, async (m, fechar) => {
    let salas = [];
    try{ salas = (await DB.salasPublicas()).filter(s => s.id !== SALA_GLOBAL_ID && !SALAS.some(x => x.id === s.id)).sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR")); }
    catch(e){ m.querySelector("#spLista").innerHTML = `<p class="erro">${esc(erroMsg(e))}</p>`; return; }
    const norm = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const render = () => {
      const q = norm(m.querySelector("#spBusca").value.trim());
      const lista = salas.filter(s => !q || norm(s.nome).includes(q) || norm(s.descricao || "").includes(q)).slice(0, 50);
      m.querySelector("#spLista").innerHTML = lista.length ? `<ul class="lista">${lista.map(s => `<li><div class="info"><strong>${esc(s.nome)}</strong><span>${s.descricao ? esc(s.descricao) + " · " : ""}${s.donoNome ? "criada por " + esc(s.donoNome) : ""}</span></div><button class="btn btn-main btn-sm" data-entrar="${esc(s.id)}">Entrar</button></li>`).join("")}</ul>`
        : `<p class="vazio">${salas.length ? "Nenhuma sala com esse nome." : "Ainda não há outras salas públicas. Que tal criar a primeira?"}</p>`;
      m.querySelectorAll("[data-entrar]").forEach(b => b.onclick = () => { const s = salas.find(x => x.id === b.dataset.entrar); fechar(); confirmarEntrada(s); });
    };
    m.querySelector("#spBusca").addEventListener("input", render); render();
  });
}
/* Depois do login: se a pessoa chegou por um link de convite, oferece a entrada */
async function conferirConvite(){
  const cod = normalizarCodigo(lsGet(KEY + ":convite", ""));
  if(!cod) return;
  try{ localStorage.removeItem(KEY + ":convite"); }catch(e){}
  if(cod === SALA_GLOBAL.codigo) return;
  try{
    const s = await DB.salaPorCodigo(cod);
    if(!s){ aviso("O convite que você abriu não vale mais (sala não encontrada)."); return; }
    confirmarEntrada(s);
  }catch(e){ console.warn("convite", e); }
}

/* ---------- Gerenciar (dono da sala ou admin) ---------- */
function modalGerenciarSala(s){
  if(!s || !podeGerenciarSala(s)) return;
  let mudou = false, busca = "", todosUsuarios = null;
  modal("Gerenciar " + s.nome, `<div id="gsC"><p class="vazio">Carregando…</p></div>`, (m, fechar) => {
    const c = m.querySelector("#gsC");
    const render = async () => {
      let membros = [];
      try{ membros = await DB.membrosDaSala(s.id); }catch(e){ c.innerHTML = `<p class="erro">${esc(erroMsg(e))}</p>`; return; }
      delete membrosCache[s.id];
      const pend = membros.filter(x => x.status === "pendente").sort((a,b) => (a.quando||0) - (b.quando||0));
      const ativos = membros.filter(x => x.status === "ativo").sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
      const linha = (x, tipo) => `<li><div class="em">${avatarSVG(x.profeta || PROFETA_PADRAO, null, x.nivel)}</div><div class="info"><strong>${esc(x.nome || "(sem nome)")}${x.uid === usuario.uid ? " (você)" : ""}</strong><span>${x.uid === s.dono ? "Criou a sala" : tipo === "p" ? "Pediu para entrar" : (s.admins || []).includes(x.uid) ? "Administrador da sala" : "Membro"}</span></div>
        ${tipo === "p" ? `<button class="btn btn-ok btn-sm" data-aprovar="${esc(x.uid)}">Aprovar</button><button class="btn btn-ghost btn-sm" data-recusar="${esc(x.uid)}">Recusar</button>` : (!s.global && x.uid !== s.dono ? `<button class="btn btn-ghost btn-sm" data-remover="${esc(x.uid)}">Remover</button>` : "")}</li>`;
      c.innerHTML = `
        ${pend.length ? `<h3 class="h3">Pedidos de entrada (${pend.length})</h3><ul class="lista">${pend.map(x => linha(x, "p")).join("")}</ul>${pend.length > 1 ? `<div class="btn-row uma" style="margin-bottom:14px"><button class="btn btn-ok btn-sm" id="gsTodos" style="width:100%">Aprovar todos</button></div>` : `<div style="height:10px"></div>`}` : (!s.global && !s.publica ? `<p class="note" style="margin:0 0 12px">Nenhum pedido de entrada no momento.</p>` : "")}
        ${s.global ? `<p class="muted small" style="margin-top:0">Sala global: todo mundo entra automaticamente ao criar a conta. Ela não pode ser renomeada, fechada nem excluída.</p>` : `
        <div class="field"><label for="gsNome">Nome</label><input type="text" id="gsNome" maxlength="30" value="${esc(s.nome)}"></div>
        <div class="field"><label for="gsDesc">Descrição</label><input type="text" id="gsDesc" maxlength="80" value="${esc(s.descricao || "")}"></div>
        <div class="field"><label>Quem pode entrar</label><div class="tabs" role="tablist" style="margin:0"><button type="button" role="tab" aria-selected="${!!s.publica}" data-tipo="1">Pública</button><button type="button" role="tab" aria-selected="${!s.publica}" data-tipo="0">Privada</button></div>
          <span class="hint">${s.publica ? "Qualquer pessoa entra na hora." : "Você aprova cada pedido de entrada."}</span></div>
        <p class="erro" id="gsErro"></p>
        <div class="btn-row"><button class="btn btn-main" id="gsSalvar">Salvar</button><button class="btn btn-ghost" id="gsConvidar">Convidar (código ${esc(s.codigo)})</button></div>`}
        <h3 class="h3" style="margin-top:16px">Membros (${ativos.length})</h3>
        ${ativos.length ? `<ul class="lista gs-membros">${ativos.map(x => linha(x, "a")).join("")}</ul>` : `<p class="vazio">Ninguém na sala ainda.</p>`}
        ${podeIncluirNaSala(s) ? `<h3 class="h3" style="margin-top:16px">Incluir usuários</h3>
          <p class="muted small" style="margin:0 0 8px">Como ${ehMaster() ? "master" : "administrador desta sala"}, você coloca qualquer pessoa com conta aprovada direto na sala, sem ela precisar do código nem de aprovação.</p>
          <div class="field" style="margin-bottom:8px"><input type="search" id="gsBusca" placeholder="Buscar pelo nome ou e-mail" aria-label="Buscar usuário" value="${esc(busca)}"></div>
          <div id="gsAdd"><p class="vazio">Carregando usuários…</p></div>` : ""}
        <div class="btn-row" style="margin-top:14px"><button class="btn btn-ghost" id="gsRes">Ver resultados da sala</button>${s.global || !(ehMaster() || ehDonoSala(s)) ? "" : `<button class="btn btn-danger" id="gsExcluir">Excluir sala</button>`}</div>`;
      let publica = !!s.publica;
      c.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { publica = b.dataset.tipo === "1"; c.querySelectorAll("[data-tipo]").forEach(x => x.setAttribute("aria-selected", String(x === b))); });
      const sv = c.querySelector("#gsSalvar");
      if(sv) sv.onclick = async () => {
        const nome = c.querySelector("#gsNome").value.trim().replace(/\s+/g, " "), desc = c.querySelector("#gsDesc").value.trim();
        if(nome.length < 3){ c.querySelector("#gsErro").textContent = "Dê um nome com pelo menos 3 letras."; return; }
        ocupado(sv, true);
        try{
          await DB.salvarSala(s.id, { nome, descricao: desc, publica });
          // Ao abrir a sala, quem estava esperando entra
          if(publica && !s.publica) for(const x of pend) await DB.salvarMembro({ salaId: s.id, uid: x.uid, status: "ativo" });
          Object.assign(s, { nome, descricao: desc, publica }); mudou = true; aviso("Sala atualizada"); render();
        }catch(e){ c.querySelector("#gsErro").textContent = erroMsg(e); ocupado(sv, false); }
      };
      const cv = c.querySelector("#gsConvidar"); if(cv) cv.onclick = () => { fechar(); convidarSala(s); };
      const acao = (sel, fn, msg) => c.querySelectorAll(sel).forEach(b => b.onclick = async () => { ocupado(b, true); try{ await fn(b); mudou = true; if(msg) aviso(msg); }catch(e){ aviso(erroMsg(e)); } render(); });
      acao("[data-aprovar]", b => DB.salvarMembro({ salaId: s.id, uid: b.dataset.aprovar, status: "ativo" }), "Entrada aprovada");
      acao("[data-recusar]", b => DB.excluirMembro(s.id, b.dataset.recusar), "Pedido recusado");
      c.querySelectorAll("[data-remover]").forEach(b => b.onclick = async () => {
        const x = ativos.find(y => y.uid === b.dataset.remover);
        if(!(await confirmar("Remover da sala", `Remover ${x ? x.nome : "esta pessoa"} da sala "${s.nome}"?`, "Remover", "btn-warn"))) return;
        try{ await DB.excluirMembro(s.id, b.dataset.remover); mudou = true; aviso("Removido da sala"); }catch(e){ aviso(erroMsg(e)); } render();
      });
      // Admin: incluir usuários direto na sala
      const add = c.querySelector("#gsAdd");
      if(add){
        const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        const dentro = new Set(ativos.map(x => x.uid));
        const listar = () => {
          const q = norm(busca.trim());
          const fora = todosUsuarios.filter(u => (u.aprovado || u.admin) && !dentro.has(u.id)).sort((a,b) => String(a.nome).localeCompare(String(b.nome), "pt-BR"));
          const achados = fora.filter(u => !q || norm(u.nome).includes(q) || norm(u.email).includes(q));
          const mostra = achados.slice(0, 20);
          add.innerHTML = mostra.length ? `<ul class="lista gs-membros">${mostra.map(u => `<li><div class="em">${avatarSVG(u.profeta || PROFETA_PADRAO)}</div><div class="info"><strong>${esc(u.nome || "(sem nome)")}</strong><span>${esc(u.email || "")}${pend.some(x => x.uid === u.id) ? " · pediu para entrar" : ""}</span></div><button class="btn btn-main btn-sm" data-incluir="${esc(u.id)}">Incluir</button></li>`).join("")}</ul>${achados.length > mostra.length ? `<p class="note">Mostrando 20 de ${achados.length}. Use a busca para achar os outros.</p>` : ""}`
            : `<p class="vazio">${fora.length ? "Nenhum usuário com esse nome ou e-mail." : "Todos os usuários aprovados já estão nesta sala."}</p>`;
          add.querySelectorAll("[data-incluir]").forEach(b => b.onclick = async () => {
            const u = todosUsuarios.find(x => x.id === b.dataset.incluir); if(!u) return;
            ocupado(b, true);
            try{
              const outras = (await DB.membrosDoUsuario(u.id)).filter(x => x.salaId !== SALA_GLOBAL_ID && x.salaId !== s.id).length;
              if(outras >= MAX_SALAS_PARTICIPA && !u.admin && !(await confirmar("Limite de salas", `${u.nome} já participa de ${outras} salas (o limite é ${MAX_SALAS_PARTICIPA}). Incluir nesta sala mesmo assim?`, "Incluir mesmo assim", "btn-warn"))){ ocupado(b, false); return; }
              await DB.salvarMembro({ salaId: s.id, uid: u.id, nome: u.nome || "", profeta: u.profeta || "", status: "ativo", papel: u.id === s.dono ? "dono" : "membro", quando: Date.now() });
              mudou = true; aviso(`${u.nome} entrou na sala`); render();
            }catch(e){ aviso(erroMsg(e)); ocupado(b, false); }
          });
        };
        const bi = c.querySelector("#gsBusca");
        bi.addEventListener("input", () => { busca = bi.value; if(todosUsuarios) listar(); });
        if(todosUsuarios) listar();
        else DB.listarUsuarios().then(us => { todosUsuarios = us; if(add.isConnected) listar(); }).catch(e => { add.innerHTML = `<p class="erro">${esc(erroMsg(e))}</p>`; });
      }
      const td = c.querySelector("#gsTodos"); if(td) td.onclick = async () => { ocupado(td, true); try{ for(const x of pend) await DB.salvarMembro({ salaId: s.id, uid: x.uid, status: "ativo" }); mudou = true; aviso("Todos aprovados"); }catch(e){ aviso(erroMsg(e)); } render(); };
      c.querySelector("#gsRes").onclick = () => { mudou = false; fechar(); telaResultadosSala(s); };
      const ex = c.querySelector("#gsExcluir"); if(ex) ex.onclick = async () => {
        if(!(await confirmar("Excluir sala", `Excluir a sala "${s.nome}" para todos os ${ativos.length} membros? Os pontos de cada um continuam guardados, mas a sala e a corrida dela deixam de existir. Não dá para desfazer.`, "Excluir sala", "btn-danger"))) return;
        try{ await DB.excluirSala(s.id); mudou = true; aviso("Sala excluída"); fechar(); }catch(e){ aviso(erroMsg(e)); }
      };
    };
    render();
  }, () => { if(!mudou) return; if(tabAtual === "admin") telaAdmin(); else if(tabAtual === "salas") telaSalas(); else carregarSalas(); });
}

/* ---------- Resultados da sala (para quem criou a sala) ---------- */
function telaResultadosSala(s){
  const volta = tabAtual === "admin" ? "admin" : "salas";
  app.innerHTML = `<div class="admin-area"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><h2 class="h2" style="margin:0">Resultados · ${esc(s.nome)}</h2><button class="btn btn-ghost btn-sm" id="rsVoltar">Voltar</button></div><div id="rsC"></div></div>`;
  window.scrollTo(0, 0);
  $("rsVoltar").onclick = () => nav(volta);
  painelResultados($("rsC"), { salaFixa: s });
}

/* ============================================================
   ADMIN: SALAS (todas as salas do jogo)
   ============================================================ */
async function admSalas(){
  const c = $("admC"); c.innerHTML = `<section class="panel"><p class="vazio">Carregando salas…</p></section>`;
  if(!ehMaster()){
    // Administrador de sala: só as salas que o master atribuiu a ele
    const minhas = SALAS.filter(ehAdminSala);
    const listas = await Promise.all(minhas.map(x => DB.membrosDaSala(x.id).catch(() => [])));
    if(!$("admC")) return;

/* ---------- Boneco: selo do nível perto do pé e brilho dourado nos profetas conquistados ---------- */
function avatarSVG(id, rotulo, nivel){
  const p = acharProfeta(id) || acharProfeta(PROFETA_PADRAO);
  const lbl = String(rotulo || p.nome).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  const raro = !!p.nivel, lend = !!p.lendario, nv = Math.floor(+nivel || 0);
  const mais = (cx, cy, t) => `<rect x="${cx - .5}" y="${cy - t}" width="1" height="${2 * t}"/><rect x="${cx - t}" y="${cy - .5}" width="${2 * t}" height="1"/>`;
  const aura = lend ? `<g class="av-aura" shape-rendering="geometricPrecision"><ellipse cx="10" cy="14.5" rx="11.6" ry="15.2" fill="#FFE27A" opacity=".2"/><ellipse cx="10" cy="8.5" rx="8.4" ry="8.4" fill="#FFF3B8" opacity=".34"/></g>` : "";
  const brilho = raro ? `<g class="av-raro" fill="${lend ? "#FFF3B8" : "#FFE27A"}">${mais(.6, 4, 1.5)}${mais(21.2, 2.6, 1.5)}${mais(.2, 17.5, 1)}${mais(21.6, 9.5, 1)}${lend ? mais(10, -.2, 1) + mais(-.2, 11, 1) + mais(21.4, 23, 1) + mais(1.2, 24.5, 1) : ""}</g>` : "";
  /* manto atravessado no peito (só no Messias): faixa diagonal desenhada por cima da veste */
  let manto = "";
  if(p.manto){ const esc2 = tom(p.manto, -.22); for(let r = 16; r <= 24; r++){ const x0 = Math.min(12, 5 + Math.floor((r - 16) * .9)); manto += `<rect x="${x0}" y="${r}" width="2" height="1" fill="${p.manto}"/><rect x="${x0 + 2}" y="${r}" width="1" height="1" fill="${esc2}"/>`; } }
  const selo = nv > 0 ? `<g class="av-nivel" shape-rendering="geometricPrecision"><circle cx="19.3" cy="26" r="3.7" fill="#F2BE2E" stroke="#3A2A00" stroke-width=".7"/><text x="19.3" y="27.8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="5.2" fill="#3A2A00">${nv}</text></g>` : "";
  return `<svg viewBox="-1 -1 24 31" class="avatar${raro ? " raro" : ""}${lend ? " lendario" : ""}" role="img" aria-label="${lbl}${nv > 0 ? ", nível " + nv : ""}${lend ? ", profeta lendário" : raro ? ", profeta raro" : ""}" shape-rendering="crispEdges">${aura}${brilho}${spriteMiolo(p)}${manto}${selo}</svg>`;
}

/* ---------- Estatísticas do jogador (base das missões e da análise) ---------- */
function estatisticas(){
  const rs = Object.values(RES);
  const soma = f => rs.reduce((a, r) => a + (f(r) || 0), 0);
  const noPrazoDatas = rs.filter(r => r.noPrazo).map(r => r.data).sort();
  let melhor = 0, corrente = 0, ant = null;
  noPrazoDatas.forEach(d => { corrente = (ant && somarDias(ant, 1) === d) ? corrente + 1 : (ant === d ? corrente : 1); if(corrente > melhor) melhor = corrente; ant = d; });
  return {
    quizzes: rs.length, prazo: noPrazoDatas.length, acertos: soma(r => r.acertos), perguntas: soma(r => r.total),
    gabaritos: rs.filter(r => r.total > 0 && r.acertos === r.total).length,
    seq: sequencia(), melhorSeq: Math.max(melhor, sequencia()),
    pontos: soma(r => r.pts), maxPts: rs.reduce((a, r) => Math.max(a, r.pts || 0), 0),
    semanas: LICOES.filter(L => L.dias.every(d => resDe(L, d) && resDe(L, d).noPrazo)).length,
    licoes: LICOES.filter(L => L.dias.some(d => resDe(L, d))).length,
    salas: Math.max(SALAS.filter(x => !x.global).length, perfil && perfil.entrouSala ? 1 : 0),
    equipe: perfil && perfil.temEquipe ? 1 : 0,
    mural: (perfil && perfil.muralPosts) || 0
  };
}

/* ---------- Sons e vibração (podem ser desligados em Minha conta) ---------- */
const SOM = { on: lsGet(KEY + ":som", true) !== false, vib: lsGet(KEY + ":vib", true) !== false };
let _audio = null;
const TONS = {
  certo:  [[659, .09], [988, .16]],
  errado: [[233, .14, "triangle"], [175, .22, "triangle"]],
  subiu:  [[523, .09], [659, .09], [784, .09], [1047, .22]],
  missao: [[587, .1], [740, .1], [880, .1], [1175, .26]],
  tique:  [[440, .06]],
  vai:    [[880, .2]],
  ajuda:  [[740, .07], [932, .1]],
  toque:  [[520, .05]]
};
const VIBRAS = { certo: [30], errado: [70, 50, 70], subiu: [40, 40, 40, 40, 90], missao: [40, 40, 40, 40, 120], ajuda: [25], vai: [40] };
function tocar(tipo){
  if(SOM.vib && VIBRAS[tipo] && navigator.vibrate){ try{ navigator.vibrate(VIBRAS[tipo]); }catch(e){} }
  if(!SOM.on || !TONS[tipo]) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    _audio = _audio || new AC(); if(_audio.state === "suspended") _audio.resume();
    let t = _audio.currentTime + 0.01;
    TONS[tipo].forEach(([freq, dur, forma]) => {

/* ============================================================
   MEU DESEMPENHO (só a própria pessoa vê; quem fala é o profeta)
   A regra é sempre animar: quedas viram dica, nunca bronca.
   ============================================================ */
function analiseDesempenho(){
  const st = estatisticas();
  const porLicao = LICOES.map(L => {
    const rs = L.dias.map(d => resDe(L, d)).filter(Boolean);
    const ac = rs.reduce((a, r) => a + (r.acertos || 0), 0), tot = rs.reduce((a, r) => a + (r.total || 0), 0);
    return { L, n: rs.length, acerto: tot ? Math.round(100 * ac / tot) : null, media: rs.length ? Math.round(rs.reduce((a, r) => a + (r.pts || 0), 0) / rs.length) : 0, prazo: rs.filter(r => r.noPrazo).length };
  }).filter(x => x.n > 0);
  const atual = porLicao[porLicao.length - 1] || null, anterior = porLicao.length > 1 ? porLicao[porLicao.length - 2] : null;
  const ultimos = Object.values(RES).sort((a, b) => a.data < b.data ? -1 : 1).slice(-7);
  const melhorAcerto = porLicao.reduce((a, x) => Math.max(a, x.acerto || 0), 0);
  const geral = st.perguntas ? Math.round(100 * st.acertos / st.perguntas) : null;
  const dAc = atual && anterior && atual.acerto != null && anterior.acerto != null ? atual.acerto - anterior.acerto : null;
  const dMed = atual && anterior ? atual.media - anterior.media : null;
  // O que o profeta diz (até duas frases, sempre para cima)
  const falas = [];
  if(!st.quizzes) falas.push("Ainda não tenho números seus, mas todo caminho começa com um passo. Faça o quiz de hoje e eu te conto como você está indo!");
  else if(st.quizzes < 3) falas.push("Você já começou, e isso é o mais difícil! Com mais alguns dias eu consigo mostrar a sua evolução.");
  else {
    if(dAc != null && dAc >= 5) falas.push(`Seu acerto subiu de ${anterior.acerto}% para ${atual.acerto}% em relação à lição passada. Dá para ver que você está lendo com mais atenção!`);
    else if(dAc != null && dAc <= -5) falas.push(`As perguntas desta lição estão pegando mais (${atual.acerto}% de acerto). Acontece com todo mundo! Reler o texto do dia antes do quiz costuma ajudar bastante.`);
    else if(atual && atual.acerto != null) falas.push(atual.acerto >= 80 ? `Você está acertando ${atual.acerto}% nesta lição. Que atenção ao texto!` : `Você está acertando ${atual.acerto}% nesta lição e segue firme. Constância é força!`);
    if(st.seq >= 3) falas.push(st.seq >= st.melhorSeq ? `Já são ${st.seq} dias seguidos no prazo, o seu recorde. Não solte a mão!` : `Já são ${st.seq} dias seguidos no prazo. Faltam ${st.melhorSeq - st.seq + 1} para bater o seu recorde!`);
    else if(st.seq > 0) falas.push(`Sua sequência está em ${st.seq} ${st.seq === 1 ? "dia" : "dias"}. Amanhã ela cresce!`);
    else if(st.melhorSeq >= 2) falas.push(`Sua melhor sequência foi de ${st.melhorSeq} dias. Hoje é um ótimo dia para começar outra!`);
    else falas.push("Faça o quiz de hoje no prazo e comece uma sequência. Um dia de cada vez!");
    if(falas.length < 2 && dMed != null && dMed > 0) falas.push(`E a sua média por quiz subiu ${fmt(dMed)} pontos.`);
  }
  return { st, porLicao, atual, anterior, ultimos, melhorAcerto, geral, dAc, dMed, fala: falas.slice(0, 2).join(" ") };
}
function cartaoDesempenho(){

  const bloco = (valor, rotulo, extra) => `<div class="dz-stat"><b>${valor}</b><span>${rotulo}</span>${extra || ""}</div>`;

/* ============================================================
   MAPA DO TRIMESTRE (Quiz): as lições como um caminho no rolo, que vai se abrindo a cada semana
   ============================================================ */
function mapaTrimestre(atual){
  const tri = atual ? atual.trimestre : TRIMESTRE_BASE, lics = LICOES.filter(l => l.trimestre === tri), iHoje = indiceLicaoAtual(), licHoje = LICOES[iHoje];
  const abertas = lics.filter(l => !licaoFutura(l)), fechadas = lics.length - abertas.length;
  const PASSO = 88, X0 = 62, H = 172, yDe = k => (k % 2 ? 92 : 52);
  const larg = X0 + Math.max(1, abertas.length) * PASSO + (fechadas ? 96 : 30);
  const pts = abertas.map((l, k) => ({ x: X0 + k * PASSO, y: yDe(k) }));
  let d = pts.length ? `M${pts[0].x - 46} ${pts[0].y + 10} L${pts[0].x} ${pts[0].y}` : "";
  for(let k = 1; k < pts.length; k++){ const a = pts[k-1], b = pts[k], mx = (a.x + b.x) / 2; d += ` C${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`; }
  if(pts.length && fechadas){ const u = pts[pts.length-1]; d += ` C${u.x + 40} ${u.y}, ${u.x + 44} 72, ${u.x + 70} 72`; }
  const nos = abertas.map((l, k) => {
    const feitos = l.dias.filter(x => resDe(l, x)).length, completa = feitos === 7, sel = l === atual, hoje = l === licHoje;
    return `<button type="button" class="mp-no ${completa ? "completa" : ""} ${sel ? "sel" : ""} ${hoje ? "hoje" : ""}" style="left:${pts[k].x}px;top:${pts[k].y}px" data-lic="${LICOES.indexOf(l)}" aria-pressed="${sel}" aria-label="${esc(l.numero)}: ${esc(l.titulo)}, ${feitos} de 7 dias">
      <span class="mp-n">${completa ? "✓" : l.n}</span>${licaoTravada(l) ? '<span class="mp-cad">🔒</span>' : ""}
      <span class="mp-leg"><b>${hoje ? "Esta semana" : "Lição " + l.n}</b>${feitos}/7</span></button>`;
  }).join("");
  const rolo = fechadas ? `<div class="mp-rolo" style="left:${larg - 92}px"><svg viewBox="0 0 80 150" width="80" height="150" aria-hidden="true"><rect x="22" y="6" width="36" height="138" rx="18" fill="#D9CFAE"/><rect x="28" y="6" width="10" height="138" rx="5" fill="#EFE7CC"/><rect x="29" y="0" width="22" height="10" rx="4" fill="#8A6A3E"/><rect x="29" y="140" width="22" height="10" rx="4" fill="#8A6A3E"/></svg><span>+${fechadas}</span></div>` : "";
  return `<div class="mapa" id="mapa" aria-label="Mapa do trimestre"><div class="mapa-in" style="width:${larg}px;height:${H}px">
      <div class="mp-haste"></div>
      <svg class="mp-svg" width="${larg}" height="${H}" aria-hidden="true"><path d="${d}"/></svg>${nos}${rolo}
    </div></div>
    <p class="muted small mp-dica">${esc(atual.numero)}: <b>${esc(atual.titulo)}</b>${fechadas ? ` · ${fechadas === 1 ? "falta 1 lição" : "faltam " + fechadas + " lições"} para o rolo abrir inteiro` : " · rolo todo aberto!"}</p>`;
}
function ligarMapaTrimestre(aoEscolher){
  const m = $("mapa"); if(!m) return;
  m.querySelectorAll("[data-lic]").forEach(b => b.onclick = () => { tocar("toque"); aoEscolher(LICOES[+b.dataset.lic]); });

/* ============================================================
   RETROSPECTIVA DO TRIMESTRE (cartão para compartilhar)
   ============================================================ */
function nomeTrimestre(tri){ const m = /^(\d{4})-t(\d)$/.exec(tri || ""); return m ? `${m[2]}º trimestre de ${m[1]}` : "Trimestre"; }
async function dadosRetrospectiva(){
  const tri = (LICOES[indiceLicaoAtual()] || {}).trimestre || TRIMESTRE_BASE, st = estatisticas(), sala = salaAtual();
  const meus = Object.values(RES).filter(r => r.trimestre === tri);
  const ac = meus.reduce((a, r) => a + (r.acertos || 0), 0), tot = meus.reduce((a, r) => a + (r.total || 0), 0);
  let pos = 0, de = 0;
  try{
    const membros = await membrosAtivos(sala); let res = await resultadosDaSala(sala, { trimestre: tri }); if(membros) res = res.filter(r => membros.has(r.uid));
    const passos = {}, pts = {}; res.forEach(r => { passos[r.uid] = (passos[r.uid] || 0) + (r.noPrazo ? 1 : .5); pts[r.uid] = (pts[r.uid] || 0) + (r.pts || 0); });
    const ordem = Object.keys(passos).sort((a, b) => passos[b] - passos[a] || pts[b] - pts[a]);
    pos = ordem.indexOf(usuario.uid) + 1; de = ordem.length;
  }catch(e){}
  return { tri, sala, dias: meus.length, prazo: meus.filter(r => r.noPrazo).length, seq: st.melhorSeq, pontos: meus.reduce((a, r) => a + (r.pts || 0), 0), acerto: tot ? Math.round(100 * ac / tot) : 0,
    conquistas: conquistas().filter(c => c.on).length, totalCq: conquistas().length, nivel: nivelAtual(), pos, de };
}
function desenharRetrospectiva(x, d){
  const W = 1080, H = 1350, BB = FONTES, BR = '"Barlow",system-ui,sans-serif';
  x.save(); x.clearRect(0, 0, W, H); fundoCartao(x, W, H);
  etiqueta(x, "RETROSPECTIVA", nomeTrimestre(d.tri).toUpperCase());
  x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.font = "118px " + BB; x.fillStyle = "#fff"; x.fillText("MEU TRIMESTRE", 72, 256);
  x.fillStyle = "#8FE6FF"; x.fillText("NO ROLO", 72, 366);
  if(PROFETA_IMG){ const ih = 250, iw = ih * 24 / 31; x.drawImage(PROFETA_IMG, W - 72 - iw, 150, iw, ih); }
  // Blocos
  const blocos = [[String(d.dias), d.dias === 1 ? "dia estudado" : "dias estudados"], [String(d.prazo), "feitos no prazo"], [String(d.seq), d.seq === 1 ? "dia de sequência (recorde)" : "dias de sequência (recorde)"],
    [fmt(d.pontos), "pontos no trimestre"], [d.acerto + "%", "de acerto"], [d.pos ? d.pos + "º" : "—", d.pos ? `de ${d.de} na sala ${d.sala.nome}` : "na corrida da sala"]];
  const GX = 72, GY = 430, cols = 2, gap = 24, cw = (W - 144 - gap) / cols, ch = 196;
  blocos.forEach(([v, r], k) => {
    const cx = GX + (k % cols) * (cw + gap), cy = GY + Math.floor(k / cols) * (ch + gap);
    x.fillStyle = "rgba(20,18,60,.28)"; rr(x, cx, cy, cw, ch, 28); x.fill();
    x.strokeStyle = "rgba(255,255,255,.35)"; x.lineWidth = 3; rr(x, cx, cy, cw, ch, 28); x.stroke();
    x.fillStyle = "#fff"; x.font = "112px " + BB; x.fillText(v, cx + 28, cy + 118);
    x.fillStyle = "rgba(255,255,255,.88)"; x.font = "600 30px " + BR;
    let t = r; while(x.measureText(t).width > cw - 56 && t.length > 8) t = t.slice(0, -2); x.fillText(t === r ? r : t.trim() + "…", cx + 28, cy + 164);
  });
  const fy = GY + 3 * ch + 2 * gap + 46;
  x.font = "700 46px " + BR; x.fillStyle = "#fff"; x.fillText(quem(), 72, fy + 30);
  x.font = "italic 600 32px " + BR; x.fillStyle = "rgba(255,255,255,.9)";
  x.fillText(`Nível ${d.nivel}: ${nomeNivel(d.nivel)} · ${d.conquistas} de ${d.totalCq} conquistas`, 72, fy + 80);
  x.textAlign = "right"; x.font = "36px " + BB; x.fillStyle = "rgba(255,255,255,.85)"; x.fillText("#EUESTUDOMINHALIÇÃO", W - 72, fy + 130);
  x.restore();
}
async function modalRetrospectiva(){
  let fecharEspera = modal("Retrospectiva do trimestre", `<p class="vazio">Montando o seu cartão…</p>`);
  let d, src, blob;

  fecharEspera();

    m.querySelector("#reShare").onclick = async e => { const b = e.currentTarget; ocupado(b, true); try{ await compartilharImagem(blob, "retrospectiva-" + slug(quem() || "trimestre") + ".jpg"); }catch(er){ aviso("Não deu para compartilhar."); } ocupado(b, false); };

/* ============================================================
   EQUIPES (dentro de cada sala)
   Ranking pela média de pontos por jovem: total de pontos da equipe ÷ número de membros.
   Coleção equipes/{id}: {salaId, nome, cor, criadaPor, membros:[uid], pessoas:{uid:{nome,profeta}}}
   ============================================================ */
const CORES_EQUIPE = ["#E8505D", "#F2BE2E", "#2BA486", "#1C9FD0", "#B48CF0", "#F08A4B"];
let equipesCache = {};
async function equipesDaSala(s, forcar){
  const c = equipesCache[s.id];
  if(!forcar && c && Date.now() - c.em < 60000) return c.lista;
  const lista = await DB.equipesDaSala(s.id);
  equipesCache[s.id] = { lista, em: Date.now() };
  return lista;
}
function podeGerenciarEquipe(e, s){ return ehMaster() || ehDonoSala(s) || ehAdminSala(s) || e.criadaPor === usuario.uid; }

async function telaEquipes(sala, cfg){
  const corpo = $("rkCorpo"); if(!corpo) return;
  try{
    const escopo = equipeEscopo === "*" ? { trimestre: cfg.tri } : { licaoId: equipeEscopo };
    const [membros, res, equipes] = await Promise.all([membrosAtivos(sala), resultadosDaSala(sala, escopo), equipesDaSala(sala)]);
    if(!$("rkCorpo") || salaAtual().id !== sala.id || corridaModo !== "equipes") return;
    const pessoas = pessoasDaSala(sala, res), eu = usuario.uid;
    const porUid = {}; res.forEach(r => { if(membros && !membros.has(r.uid)) return; const p = porUid[r.uid] || (porUid[r.uid] = { pts: 0, n: 0 }); p.pts += r.pts || 0; p.n++; });
    const linhas = equipes.map(e => {
      const ms = (e.membros || []).filter(u => !membros || membros.has(u));
      const total = ms.reduce((a, u) => a + (porUid[u] ? porUid[u].pts : 0), 0), quizzes = ms.reduce((a, u) => a + (porUid[u] ? porUid[u].n : 0), 0);
      return { e, ms, total, quizzes, media: ms.length ? Math.round(total / ms.length) : 0 };
    }).sort((a, b) => b.media - a.media || b.total - a.total || String(a.e.nome).localeCompare(String(b.e.nome), "pt-BR"));
    const minha = linhas.find(x => x.ms.includes(eu));
    const nomeDe = (e, u) => (u === eu ? perfil.nome : (pessoas[u] && pessoas[u].nome) || (e.pessoas && e.pessoas[u] && e.pessoas[u].nome) || "?");
    const profDe = (e, u) => (u === eu ? perfil.profeta : (pessoas[u] && pessoas[u].profeta) || (e.pessoas && e.pessoas[u] && e.pessoas[u].profeta) || PROFETA_PADRAO);
    const nivDe = (e, u) => (u === eu ? meuNivel() : Math.max((pessoas[u] && pessoas[u].nivel) || 0, (e.pessoas && e.pessoas[u] && e.pessoas[u].nivel) || 0));
    const emEquipe = new Set(linhas.flatMap(x => x.ms));
    const semEquipe = membros ? [...membros].filter(u => !emEquipe.has(u)).length : null;
    let h = `<section class="panel"><div class="cq-head"><h2 class="h3" style="font-size:30px;margin:0">Ranking das equipes</h2><button class="btn btn-main btn-sm" id="eqCriar">Criar equipe</button></div>
      <p class="muted small" style="margin:6px 0 0">Vale a média: pontos da equipe divididos pelo número de jovens. Assim equipe pequena e grande competem de igual para igual, e cada quiz feito ajuda.</p></section>`;
    if(!linhas.length) h += `<section class="panel"><p class="vazio">Esta sala ainda não tem equipes. Crie a primeira e chame a turma!</p></section>`;
    else h += `<div class="equipes">${linhas.map((x, k) => {
        const e = x.e, souDela = x.ms.includes(eu), mostra = x.ms.slice(0, 8);
        return `<article class="equipe ${souDela ? "minha" : ""}" style="--cor:${esc(e.cor || CORES_EQUIPE[0])}">
          <div class="eq-top"><div class="eq-pos">${k + 1}º</div><div class="eq-nome"><h3>${esc(e.nome)}</h3><span>${x.ms.length} ${x.ms.length === 1 ? "jovem" : "jovens"} · ${fmt(x.total)} pts no total · ${x.quizzes} ${x.quizzes === 1 ? "quiz" : "quizzes"}</span></div>
            <div class="eq-media"><b>${fmt(x.media)}</b><span>média por jovem</span></div></div>
          ${x.ms.length ? `<div class="chips eq-membros">${mostra.map(u => `<span class="chip">${avatarSVG(profDe(e, u), null, nivDe(e, u))}${esc(nomeDe(e, u))}${porUid[u] ? `<em>${fmt(porUid[u].pts)}</em>` : ""}</span>`).join("")}${x.ms.length > mostra.length ? `<span class="chip">+${x.ms.length - mostra.length}</span>` : ""}</div>` : `<p class="muted small" style="margin:8px 0 0">Equipe sem ninguém ainda.</p>`}
          <div class="sala-acoes">${souDela ? `<button class="btn btn-ghost btn-sm" data-eqsair="${esc(e.id)}">Sair da equipe</button>` : `<button class="btn ${minha ? "btn-ghost" : "btn-main"} btn-sm" data-eqentrar="${esc(e.id)}">${minha ? "Trocar para esta" : "Entrar"}</button>`}${podeGerenciarEquipe(e, sala) ? `<button class="btn btn-ghost btn-sm" data-eqger="${esc(e.id)}">Gerenciar</button>` : ""}</div>
        </article>`; }).join("")}</div>`;
    if(semEquipe) h += `<p class="rodape">${semEquipe} ${semEquipe === 1 ? "jovem da sala ainda está" : "jovens da sala ainda estão"} sem equipe${minha ? "" : ". Entre em uma para os seus pontos contarem!"}</p>`;
    corpo.innerHTML = h;
    const achar = id => equipes.find(x => x.id === id);
    $("eqCriar").onclick = () => modalCriarEquipe(sala, equipes);
    corpo.querySelectorAll("[data-eqentrar]").forEach(b => b.onclick = async () => { ocupado(b, true); try{ await entrarNaEquipe(sala, achar(b.dataset.eqentrar), equipes); }catch(e){ aviso(erroMsg(e)); } telaRanking(); });
    corpo.querySelectorAll("[data-eqsair]").forEach(b => b.onclick = async () => { ocupado(b, true); try{ await DB.sairEquipe(b.dataset.eqsair, eu); delete equipesCache[sala.id]; aviso("Você saiu da equipe"); }catch(e){ aviso(erroMsg(e)); } telaRanking(); });
    corpo.querySelectorAll("[data-eqger]").forEach(b => b.onclick = () => modalGerenciarEquipe(sala, achar(b.dataset.eqger), nomeDe, profDe));
  }catch(e){ corpo.innerHTML = `<section class="panel"><p class="erro">${esc(erroMsg(e))}</p></section>`; }
}
/* Entra na equipe, saindo de qualquer outra da mesma sala (uma equipe por sala) */
async function entrarNaEquipe(sala, e, equipes){
  if(!e) return;
  const eu = usuario.uid;
  for(const o of equipes) if(o.id !== e.id && (o.membros || []).includes(eu)) await DB.sairEquipe(o.id, eu);

  delete equipesCache[sala.id];
  if(!perfil.temEquipe){ perfil.temEquipe = true; DB.salvarUsuario(eu, { temEquipe: true }).catch(()=>{}); }
  tocar("ajuda"); aviso(`Você entrou na equipe ${e.nome}!`);
}

/* ============================================================
   MURAL (por sala)
   Publicações prontas (resultado, conquista, missão, nível, sequência, retrospectiva), sem texto livre.
   Reações: amém, parabéns, coração. Coleção mural/{id}, campo salaMes = salaId|AAAA-MM.
   ============================================================ */
const REACOES = [["amem", "🙏", "Amém"], ["parabens", "🎉", "Parabéns"], ["coracao", "❤️", "Amei"]];
function mesDe(ts){ const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function haQuanto(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if(s < 90) return "agora";
  if(s < 3600) return "há " + Math.round(s / 60) + " min";
  if(s < 86400) return "há " + Math.round(s / 3600) + " h";
  const d = Math.round(s / 86400); return d === 1 ? "ontem" : "há " + d + " dias";
}
/* Publica na sala ativa. post = {tipo, ref, ic, titulo, texto}. Publicar de novo a mesma coisa só atualiza. */
async function publicarNoMural(post, btn){
  const sala = salaAtual(), agora = Date.now(), id = [sala.id, usuario.uid, post.tipo, post.ref].join("_").replace(/[^A-Za-z0-9_.-]/g, "-");
  if(btn) ocupado(btn, true);
  try{
    await DB.salvarPost(id, { salaId: sala.id, salaMes: sala.id + "|" + mesDe(agora), uid: usuario.uid, nome: perfil.nome || "", profeta: perfil.profeta || "", nivel: meuNivel(), tipo: post.tipo, ref: String(post.ref), ic: post.ic || "✨", titulo: post.titulo, texto: post.texto || "", quando: agora });
    const meus = lsGet(KEY + ":mural:" + usuario.uid, []);
    if(!meus.includes(id)){ meus.push(id); lsSet(KEY + ":mural:" + usuario.uid, meus.slice(-200)); perfil.muralPosts = (perfil.muralPosts || 0) + 1; DB.salvarUsuario(usuario.uid, { muralPosts: perfil.muralPosts }).catch(()=>{}); }
    tocar("ajuda"); aviso(`Publicado no mural da sala ${sala.nome}`);
    if(btn){ ocupado(btn, false); btn.textContent = "Publicado ✓"; btn.disabled = true; }
    return true;
  }catch(e){ aviso("Não deu para publicar: " + erroMsg(e)); if(btn) ocupado(btn, false); return false; }
}
function postDoResultado(L, dia, r){
  return { tipo: "quiz", ref: L.id + "_" + dia.data, ic: r.total && r.acertos === r.total ? "🎯" : "📖", titulo: `Fez ${fmt(r.pts)} pontos no quiz de ${dia.nome.toLowerCase()}`, texto: `${L.numero} · ${r.acertos} de ${r.total} certas${r.noPrazo ? " · no prazo" : ""}` };
}
function postDaConquista(c){ return { tipo: "conquista", ref: c.id, ic: c.ic, titulo: `Desbloqueou a conquista ${c.t}`, texto: c.d }; }

async function telaMural(){
  tabAtual = "salas"; atualizarCasca(); pararTimer();
  const sala = salaAtual(), eu = usuario.uid;
  app.innerHTML = `<div class="result-area duas"><div class="lado">
    <header class="hero" style="padding-bottom:10px"><div class="tag"><span class="box">${esc(sala.nome)}</span><span class="date">Mural</span></div>
      <h1 class="rolo-h">Mural da<span class="hl">Sala</span></h1>
      <p>Compartilhe o que você conquistou e anime quem está na corrida com você.</p></header>
    <section class="panel" style="padding:12px 14px"><div class="sala-sel" style="margin:0"><div class="field" style="margin:0"><label for="muSala">Sala</label><select id="muSala">${SALAS.map(x => `<option value="${esc(x.id)}" ${x.id === sala.id ? "selected" : ""}>${esc(x.nome)}${x.global ? " (global)" : ""}</option>`).join("")}</select></div><button class="btn btn-main btn-sm" id="muNovo">Compartilhar</button></div></section></div>
    <div class="principal" id="muCorpo"><section class="panel"><p class="vazio">Carregando o mural…</p></section></div></div>`;
  $("muSala").onchange = e => { definirSala(e.target.value); telaMural(); };
  $("muNovo").onclick = modalCompartilharMural;
  try{
    const agora = Date.now(), mesAnt = new Date(); mesAnt.setDate(1); mesAnt.setMonth(mesAnt.getMonth() - 1);
    const posts = (await DB.muralDaSala(sala.id, [mesDe(agora), mesDe(mesAnt.getTime())])).sort((a, b) => (b.quando || 0) - (a.quando || 0)).slice(0, 60);
    const corpo = $("muCorpo"); if(!corpo || salaAtual().id !== sala.id) return;
    if(!posts.length){ corpo.innerHTML = `<section class="panel"><p class="vazio">O mural desta sala ainda está vazio. Seja o primeiro a compartilhar!</p></section>`; return; }
    const desenhar = () => {
      corpo.innerHTML = `<div class="mural">${posts.map(p => { const rc = p.reacoes || {};
        return `<article class="post ${p.uid === eu ? "meu" : ""}" data-post="${esc(p.id)}">
          <div class="post-top"><div class="em">${avatarSVG(p.profeta || PROFETA_PADRAO, null, p.uid === eu ? meuNivel() : p.nivel)}</div><div class="info"><strong>${esc(p.nome || "?")}${p.uid === eu ? " (você)" : ""}</strong><span>${haQuanto(p.quando || 0)}</span></div>${p.uid === eu || ehMaster() || ehDonoSala(sala) || ehAdminSala(sala) ? `<button class="post-x" data-apagar="${esc(p.id)}" aria-label="Apagar publicação">✕</button>` : ""}</div>
          <div class="post-corpo"><div class="ic">${esc(p.ic || "✨")}</div><div><b>${esc(p.titulo)}</b>${p.texto ? `<span>${esc(p.texto)}</span>` : ""}</div></div>
          <div class="post-reacoes">${REACOES.map(([k, ic, nome]) => { const l = rc[k] || [], on = l.includes(eu); return `<button type="button" class="reacao ${on ? "on" : ""}" data-reagir="${k}" aria-pressed="${on}" title="${nome}"><span>${ic}</span>${nome}${l.length ? `<b>${l.length}</b>` : ""}</button>`; }).join("")}</div>
        </article>`; }).join("")}</div>`;
      corpo.querySelectorAll("[data-reagir]").forEach(b => b.onclick = async () => {
        const id = b.closest("[data-post]").dataset.post, p = posts.find(x => x.id === id), k = b.dataset.reagir;
        p.reacoes = p.reacoes || {}; const l = p.reacoes[k] || (p.reacoes[k] = []), on = !l.includes(eu);
        if(on) l.push(eu); else l.splice(l.indexOf(eu), 1);
        if(on) tocar("toque"); desenhar();
        try{ await DB.reagirPost(id, k, eu, on); }catch(e){ if(on) l.splice(l.indexOf(eu), 1); else l.push(eu); desenhar(); aviso(erroMsg(e)); }
      });
      corpo.querySelectorAll("[data-apagar]").forEach(b => b.onclick = async () => {
        if(!(await confirmar("Apagar publicação", "Apagar esta publicação do mural?", "Apagar", "btn-warn"))) return;
        try{ await DB.excluirPost(b.dataset.apagar); posts.splice(posts.findIndex(x => x.id === b.dataset.apagar), 1); if(posts.length) desenhar(); else telaMural(); }catch(e){ aviso(erroMsg(e)); }
      });
    };
    desenhar();
  }catch(e){ const c = $("muCorpo"); if(c) c.innerHTML = `<section class="panel"><p class="erro">${esc(erroMsg(e))}</p></section>`; }
}
/* Escolher o que compartilhar (sempre algo que a pessoa realmente fez) */
function modalCompartilharMural(){
  const sala = salaAtual(), st = estatisticas(), opcoes = [];
  const ult = Object.values(RES).sort((a, b) => (b.quando || 0) - (a.quando || 0))[0];
  if(ult){ const L = LICOES.find(x => x.id === ult.licaoId), dia = L && L.dias.find(d => d.data === ult.data); if(L && dia) opcoes.push(["Meu último quiz", postDoResultado(L, dia, ult)]); }
  const cq = conquistas().filter(c => c.on);
  if(cq.length) opcoes.push([`Minhas conquistas`, { tipo: "conquistas", ref: "n" + cq.length, ic: "🏅", titulo: `Já tem ${cq.length} de ${conquistas().length} conquistas`, texto: cq.slice(-3).map(c => c.t).join(" · ") }]);
  const feitas = missoesFeitas(st), nv = nivelDe(feitas);
  if(nv) opcoes.push(["Meu nível", { tipo: "nivel", ref: "n" + nv, ic: "⭐", titulo: `Está no nível ${nv}: ${nomeNivel(nv)}`, texto: `${feitas} ${feitas === 1 ? "missão cumprida" : "missões cumpridas"}` }]);
  if(st.seq >= 2) opcoes.push(["Minha sequência", { tipo: "sequencia", ref: "s" + st.seq, ic: "🔥", titulo: `Está há ${st.seq} dias seguidos no prazo`, texto: st.seq >= st.melhorSeq ? "É o recorde pessoal!" : `Recorde pessoal: ${st.melhorSeq} dias` }]);
  modal("Compartilhar no mural", opcoes.length ? `<p class="muted small" style="margin-top:0">Vai para o mural da sala <b>${esc(sala.nome)}</b>. Escolha o que quer mostrar:</p>
    <div class="mu-opcoes">${opcoes.map(([rot, p], k) => `<button type="button" class="mu-opcao" data-k="${k}"><span class="ic">${p.ic}</span><span><b>${esc(rot)}</b><small>${esc(p.titulo)}</small></span></button>`).join("")}</div>`
    : `<p>Você ainda não tem nada para compartilhar. Faça o quiz de hoje e volte aqui!</p>`, (m, fechar) => {
    m.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => { b.disabled = true; if(await publicarNoMural(opcoes[+b.dataset.k][1])){ fechar(); telaMural(); } else b.disabled = false; });
  });
}
