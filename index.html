<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida do Rolo · Quiz da Lição</title>
<meta name="theme-color" content="#524F9C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz da Lição">
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="manifest" id="manifest" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --g1:#524F9C; --g2:#6889AE; --g3:#83C6BD;
  --ink:#FFFFFF; --muted:rgba(255,255,255,.82); --soft:rgba(255,255,255,.62);
  --panel:rgba(255,255,255,.14); --panel-line:rgba(255,255,255,.30); --field:rgba(255,255,255,.16);
  --deep:#2E2B6E; --accent:#8FE6FF;
  --ok:#5FE0B0; --bad:#FF9AA2; --warn:#F2BE2E;
  --a:#E8505D; --b:#1C9FD0; --c:#F2BE2E; --d:#2BA486;
  --radius-lg:20px; --radius:14px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --g1:#2B2966; --g2:#344D78; --g3:#2F6E6C;
    --panel:rgba(255,255,255,.10); --panel-line:rgba(255,255,255,.22); --field:rgba(255,255,255,.12);
    --deep:#1C1A48;
  }
}
:root[data-theme="dark"]{
  --g1:#2B2966; --g2:#344D78; --g3:#2F6E6C;
  --panel:rgba(255,255,255,.10); --panel-line:rgba(255,255,255,.22); --field:rgba(255,255,255,.12);
  --deep:#1C1A48;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--g1) linear-gradient(170deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%) no-repeat;background-size:100% 100%}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;font-weight:400;line-height:.95;margin:0;letter-spacing:.5px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 40px}
.banner{background:var(--warn);color:#2A2000;border-radius:var(--radius);padding:10px 14px;font-weight:700;font-size:15px;margin-bottom:16px}

/* Capa */
.hero{position:relative;padding:4px 0 26px;overflow:hidden}
.tag{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:20px;letter-spacing:1px;position:relative;z-index:1}
.tag .box{border:2px solid #fff;padding:2px 12px 0;line-height:1.3}
.tag .date{color:var(--muted)}
.hero h1{position:relative;z-index:1;font-size:clamp(76px,24vw,124px);text-transform:uppercase;margin-top:18px;line-height:.86}
.hero h1 .hl{display:block;color:var(--accent)}
.hero p{position:relative;z-index:1;margin:16px 0 0;color:var(--muted);font-style:italic;font-size:18px;max-width:30ch}
.quill{position:absolute;right:-18px;top:28px;width:190px;height:auto;opacity:.55;pointer-events:none}
.quill path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius-lg);padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel + .panel{margin-top:14px}
label{display:block;font-weight:700;margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],select{width:100%;padding:13px 14px;border-radius:var(--radius);border:2px solid var(--panel-line);background:var(--field);font-size:17px;color:#fff}
input[type=text]::placeholder{color:var(--soft)}
input[type=text]:focus,select:focus{border-color:#fff;outline:none}
select option{color:#222;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--radius);padding:14px 18px;font-weight:800;font-size:17px;text-decoration:none;min-height:52px}
.btn-main{background:#fff;color:var(--deep);width:100%}
.btn-wa{background:#1FA855;color:#fff;width:100%}
.btn-ghost{background:transparent;color:#fff;border:2px solid var(--panel-line);width:100%}
.btn-row{display:grid;gap:10px;margin-top:16px}
.linkish{background:none;border:0;color:#fff;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.hello h2{font-size:36px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(0,0,0,.12);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:42px;line-height:1;letter-spacing:.5px}
.stat span{color:var(--muted);font-size:14px;font-weight:600}
.days{list-style:none;margin:0;padding:0}
.day{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--panel-line)}
.day:first-child{border-top:0;padding-top:2px}
.dot{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:22px;letter-spacing:.5px;background:rgba(255,255,255,.14);color:var(--soft)}
.day.feito .dot{background:var(--d);color:#fff}
.day.hoje .dot,.day.aberto .dot{background:#fff;color:var(--deep)}
.day.atrasado .dot{background:var(--warn);color:#2A2000}
.day .info strong{display:block;font-size:16px}
.day .info span{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.day .act{font-size:15px;min-height:42px;padding:9px 14px;border-radius:12px;border:0;font-weight:800}
.act.play{background:#fff;color:var(--deep)}
.act.late{background:var(--warn);color:#2A2000}
.act.see{background:rgba(255,255,255,.18);color:#fff}
.act.lock{background:transparent;color:var(--soft);cursor:default;font-weight:700}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}

.profetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.prof{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;color:#fff;font-weight:700;font-size:13px;line-height:1.2}
.prof .avatar{width:64px;height:76px}
.prof[aria-pressed="true"]{background:rgba(255,255,255,.26);border-color:#fff}
.hello2{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;margin-bottom:14px}
.hello2 > .avatar{width:44px;height:58px;margin-top:4px}
.hello-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hello-top h2{font-size:32px}
.balao.mini{margin-top:8px;padding:7px 10px;border-width:2px;border-radius:6px;box-shadow:3px 3px 0 rgba(34,24,58,.3)}
.balao.mini p{margin:0;font-size:14px;line-height:1.35}
.balao.mini::before{left:-10px;top:14px;margin-top:0;border-width:7px;border-right-width:8px;border-left-width:0}
.balao.mini::after{left:-6px;top:16px;margin-top:0;border-width:5px;border-right-width:6px;border-left-width:0}
.result + .fala{margin-top:16px}
.fala{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-top:14px}
.fala-boneco .avatar{width:72px;height:92px;display:block}
.balao{position:relative;background:#fff;color:#22183A;border:3px solid #22183A;border-radius:8px;padding:12px 14px;box-shadow:4px 4px 0 rgba(34,24,58,.35)}
.balao::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:10px solid #22183A;border-left:0}
.balao::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:7px solid #fff;border-left:0}
.balao strong{display:block;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:24px;letter-spacing:.5px;line-height:1;color:#524F9C}
.balao p{margin:6px 0 0;font-weight:600;font-size:16px;line-height:1.4}
.balao span{display:block;margin-top:6px;font-size:13px;font-weight:700;color:#6889AE}
/* Quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.qtop .where{font-weight:600;color:var(--muted)}
.qtop .where b{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:28px;color:#fff;letter-spacing:.5px;line-height:1}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:30px}
.ring .track{stroke:rgba(255,255,255,.22)}
.ring .bar{stroke:var(--accent);transition:stroke .2s}
.ring.low .bar{stroke:var(--bad)}
.qtext{font-family:"Barlow",system-ui,sans-serif;font-size:clamp(23px,6.2vw,28px);font-weight:700;line-height:1.22;letter-spacing:0;margin:0 0 6px}
.qhint{color:var(--muted);font-weight:600;font-style:italic;font-size:15px;margin:0 0 18px}
.tiles{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:12px;text-align:left;border:0;border-radius:var(--radius);padding:14px;min-height:64px;font-weight:700;font-size:17px;color:#fff;transition:transform .12s, opacity .2s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile:active{transform:scale(.98)}
.tile .letter{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.24);display:grid;place-items:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:24px}
.t0{background:var(--a)} .t1{background:var(--b)} .t2{background:var(--c);color:#2A2000} .t2 .letter{background:rgba(0,0,0,.12)} .t3{background:var(--d)}
.tiles.done .tile{cursor:default}
.tiles.done .tile.dim{opacity:.3}
.tile .mark{grid-column:2;font-size:14px;font-weight:700;opacity:.95}
.feedback{margin-top:18px;border-radius:var(--radius-lg);padding:16px 18px;background:rgba(20,18,60,.32);border:2px solid var(--panel-line)}
.feedback.ok{border-color:var(--ok)}
.feedback.bad{border-color:var(--bad)}
.feedback h3{font-size:36px}
.feedback.ok h3{color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.feedback p{margin:6px 0 0;color:var(--muted)}

.verso{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--accent);background:rgba(255,255,255,.08);border-radius:0 12px 12px 0}
.verso p{margin:0;color:#fff;font-size:17px;line-height:1.5}
.verso cite{display:block;margin-top:6px;font-style:normal;font-weight:700;font-size:14px;color:var(--accent)}
.tira{margin:14px 0 0}
.tira .rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.tira img{display:block;width:max(100%,620px);max-width:none;height:auto;border-radius:10px;background:#fff}
.tira figcaption{margin-top:6px;font-weight:700;font-size:14px;color:var(--accent)}

.selfie-h{font-size:44px;margin:4px 0 16px}
.preview{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 10px 30px rgba(20,18,60,.35)}
label.btn{cursor:pointer;margin:0}
.foto-final{margin:0}
.foto-final img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 10px 30px rgba(20,18,60,.35)}
[hidden]{display:none !important}
/* Resultado */
.result{text-align:center;padding:14px 0 6px}
.result .big{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:clamp(96px,30vw,140px);line-height:.9;color:#fff}
.result .lbl{font-weight:600;color:var(--muted);margin:0}
.result h2{font-size:42px;margin-top:8px;color:var(--accent)}
.result .sub{color:var(--muted);margin:8px 0 0}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--deep);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.tile,.ring .bar{transition:none}}

/* ============================================================
   NOVO: barra superior, menu inferior, modais, contagem, admin
   ============================================================ */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.sem-menu{padding-bottom:0}
.wrap{padding-top:14px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:rgba(20,18,60,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--panel-line)}
.topbar .brand{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:24px;letter-spacing:1px;line-height:1}
.topbar .brand small{display:block;font-family:"Barlow",sans-serif;font-size:11px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:14px;color:#fff;max-width:55vw}
.chip .em{font-size:20px;line-height:1;display:flex}
.chip .em .avatar{width:22px;height:28px}
.chip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(20,18,60,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--panel-line)}
.bottomnav button{background:transparent;border:0;border-radius:12px;color:var(--soft);display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:700;letter-spacing:0;white-space:nowrap;min-width:0}
.bottomnav button .ic{font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;height:24px}
.bottomnav button .ic .avatar{width:20px;height:26px;margin-top:-2px}
.bottomnav button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14)}
.bottomnav button.admin .ic{filter:drop-shadow(0 0 6px rgba(242,190,46,.7))}
.h2{font-size:38px;margin:4px 0 14px}
.h3{font-size:26px;margin:0 0 10px}
.sub-h{color:var(--muted);font-weight:600;margin:0 0 14px}
input[type=email],input[type=password],input[type=number],input[type=date],textarea{width:100%;padding:13px 14px;border-radius:var(--radius);border:2px solid var(--panel-line);background:var(--field);font-size:17px;color:#fff}
input[type=email]::placeholder,input[type=password]::placeholder,textarea::placeholder{color:var(--soft)}
input[type=email]:focus,input[type=password]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus{border-color:#fff;outline:none}
input[type=date]{color-scheme:dark}
textarea{min-height:90px;resize:vertical;line-height:1.4;font-size:16px}
input[type=file]{width:100%;color:var(--muted);font-size:15px}
.btn-sm{min-height:40px;padding:8px 14px;font-size:15px;width:auto}
.btn-warn{background:var(--warn);color:#2A2000}
.btn-danger{background:var(--a);color:#fff}
.btn-ok{background:var(--d);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline .btn{width:auto}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.erro{color:var(--bad);font-weight:700;font-size:15px;margin:8px 0 0;min-height:1.2em}
.logo-login{text-align:center;padding:30px 0 10px}
.logo-login h1{font-size:clamp(64px,20vw,96px);line-height:.86;text-transform:uppercase}
.logo-login h1 .hl{display:block;color:var(--accent)}
.logo-login p{color:var(--muted);font-style:italic;margin:12px auto 0;max-width:30ch}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,9,40,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:end center;padding:0;animation:fade .2s}
@media (min-width:600px){.modal-bg{place-items:center;padding:20px}}
.modal{width:100%;max-width:520px;max-height:min(92vh,92dvh);overflow:auto;background:linear-gradient(170deg,var(--g1),var(--g2));border:1px solid var(--panel-line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:sobe .25s cubic-bezier(.2,1,.3,1)}
@media (min-width:600px){.modal{border-radius:22px}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-h h3{font-size:30px}
.fechar{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;display:grid;place-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sobe{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* Contagem regressiva */
.cd{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(143,230,255,.25),transparent 60%),linear-gradient(170deg,var(--g1),var(--g2) 60%,var(--g3));animation:fade .25s}
.cd-in{text-align:center;display:grid;justify-items:center;gap:6px}
.cd-in .avatar{width:110px;height:140px;animation:flutua 1.6s ease-in-out infinite}
.cd-dia{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:34px;letter-spacing:1px;color:var(--accent)}
.cd-num{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:clamp(140px,40vw,220px);line-height:1;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.cd-num.anim{animation:cdpop .8s cubic-bezier(.2,1.2,.3,1) both}
.cd-num.vai{color:var(--ok);animation:cdvai .7s cubic-bezier(.2,1.4,.4,1) both}
.cd-sub{color:var(--muted);font-weight:700;font-size:18px}
.cd-ring{position:absolute;width:260px;height:260px;border-radius:50%;border:6px solid rgba(255,255,255,.25);animation:cdring .8s ease-out infinite}
@keyframes cdpop{0%{transform:scale(2.2);opacity:0}40%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes cdvai{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes cdring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Listas gerais */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--panel-line)}
.lista li:first-child{border-top:0;padding-top:4px}
.lista .em{font-size:28px;line-height:1;width:40px;text-align:center;flex:none;display:flex;justify-content:center}
.lista .em .avatar{width:36px;height:46px}
.lista .info{flex:1;min-width:0}
.lista .info strong{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista .info span{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.lista .pts{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:26px;letter-spacing:.5px;flex:none}
.pos{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:20px;background:rgba(255,255,255,.14);flex:none}
.pos.p1{background:#F2BE2E;color:#2A2000}.pos.p2{background:#D7DCE3;color:#222}.pos.p3{background:#D08A4F;color:#fff}
.lista li.eu{background:rgba(255,255,255,.08);border-radius:12px;padding-left:8px;padding-right:8px}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18);margin-right:4px;vertical-align:middle}
.badge.ok{background:var(--d);color:#fff}.badge.warn{background:var(--warn);color:#2A2000}.badge.adm{background:#B48CF0;color:#1E1240}.badge.bad{background:var(--a);color:#fff}
.menu-conta{display:grid;gap:10px}
.menu-conta button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);padding:14px;font-weight:700;font-size:16px;color:#fff}
.menu-conta button .ic{font-size:22px;width:30px;text-align:center}
.menu-conta button .seta{margin-left:auto;color:var(--soft)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.emojis button{font-size:28px;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:12px;padding:6px 0;line-height:1.3}
.emojis button[aria-pressed="true"]{background:rgba(255,255,255,.26);border-color:#fff}
.opcoes{display:grid;gap:8px}
.opcoes button{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--panel-line);border-radius:var(--radius);padding:12px 14px;font-weight:700;color:#fff;text-align:left}
.opcoes button[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.22)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.25);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--d)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.linha-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--panel-line)}
.linha-sw:first-child{border-top:0}
.linha-sw .txt strong{display:block}.linha-sw .txt span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:rgba(255,255,255,.1);border:1px solid var(--panel-line);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:var(--deep);border-color:#fff}
.estudo{white-space:pre-wrap;line-height:1.6;font-size:17px}
.estudo p{margin:0 0 14px}
/* Profeta nos balões de fala: metade do tamanho */
.fala{grid-template-columns:36px 1fr;gap:12px}
.fala > .avatar,.fala-boneco .avatar{width:36px;height:46px;display:block}
.fala-boneco{width:36px}
/* Admin: resultados */
.ar-stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:900px){ .ar-stats{grid-template-columns:repeat(3,1fr)} }
.ar-dest{display:grid;gap:10px;margin-bottom:14px}
@media (min-width:600px){ .ar-dest{grid-template-columns:1fr 1fr} }
.ar-dest-card{border-radius:var(--radius);padding:12px 14px;background:rgba(255,255,255,.1);border:1px solid var(--panel-line)}
.ar-dest-card span{display:block;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.ar-dest-card b{display:block;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:26px;letter-spacing:.5px;line-height:1.05;margin-top:4px}
.ar-dest-card em{display:block;font-style:normal;font-size:13px;color:var(--soft);margin-top:4px}
.ar-dest-card.ok{border-color:rgba(95,224,176,.6);background:rgba(95,224,176,.14)}
.ar-dest-card.bad{border-color:rgba(255,120,120,.55);background:rgba(255,120,120,.12)}
.ar-linhas{display:grid;gap:10px}
.ar-linha{display:grid;grid-template-columns:1fr 56px;gap:4px 10px;align-items:center}
.ar-linha .ar-rot{grid-column:1/3}
.ar-rot b{display:block;font-size:15px}
.ar-rot span{display:block;font-size:12px;color:var(--muted)}
.ar-bar{height:12px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.ar-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.ar-bar i.ok{background:var(--ok)}.ar-bar i.meio{background:var(--accent)}.ar-bar i.bad{background:var(--a)}
.ar-pct{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:22px;text-align:right}
.ar-pergs{display:grid;gap:10px}
.ar-perg,.ar-refl{background:rgba(0,0,0,.12);border-radius:var(--radius);padding:12px 14px}
.ar-refl+.ar-refl{margin-top:10px}
.ar-perg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.ar-perg-top b{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:22px;letter-spacing:.5px;flex:none}
.ar-perg-top b.bad{color:#FF9B9B}.ar-perg-top b.ok{color:var(--ok)}
.ar-onde{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.ar-q{margin:4px 0 8px;font-weight:700;font-size:15px;line-height:1.35}
.ar-opt{margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid transparent}
.ar-opt.top{border-color:rgba(95,224,176,.6);background:rgba(95,224,176,.12)}
.ar-opt-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ar-opt-h .letter{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.18);font-weight:800;font-size:13px}
.ar-opt-h .ar-opt-t{flex:1;font-size:14px;line-height:1.3}
.ar-opt-h b{flex:none;font-size:14px}
.ar-quem{margin-top:8px}
.ar-quem .chip{font-size:12px;padding:3px 10px 3px 3px}
.ar-quem .chip .avatar{width:22px;height:28px}
/* Conquistas: cabeçalho com botão, cartões clicáveis e modal */
.cq-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cq-head .hoje-lbl{margin-bottom:0}
.cq-head .btn-sm{min-height:34px;padding:5px 12px;font-size:13px}
.badge-card{font:inherit;color:inherit;cursor:pointer;width:100%}
.badge-card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cq-modal{text-align:center;padding:4px 0}
.cq-modal .ic{font-size:84px;line-height:1.1;filter:drop-shadow(0 6px 18px rgba(143,230,255,.45))}
.cq-modal.off .ic{opacity:.5;filter:grayscale(1)}
.cq-modal h3{font-size:34px;margin:8px 0 2px}
.cq-modal p{margin:0 0 6px;font-weight:600}
.cq-modal .btn-row{margin-top:14px}
.field .hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
/* Festa de conquista nova */
.confete{position:fixed;inset:0;width:100vw;height:100vh;z-index:70;pointer-events:none}
.cq-festa{text-align:center}
.cq-festa-sub{margin:0 0 10px;color:var(--soft);font-weight:700}
.cq-festa-lista{display:grid;gap:10px;text-align:left}
.cq-festa-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);border-radius:var(--radius);padding:10px 12px;box-shadow:0 0 18px rgba(143,230,255,.25);animation:cqpop .5s cubic-bezier(.2,1.3,.4,1) both}
.cq-festa-item:nth-child(2){animation-delay:.12s}.cq-festa-item:nth-child(3){animation-delay:.24s}.cq-festa-item:nth-child(n+4){animation-delay:.36s}
.cq-festa-item .ic{font-size:44px;line-height:1;flex:none;filter:drop-shadow(0 4px 12px rgba(143,230,255,.45))}
.cq-festa-item .tx{flex:1;min-width:0}
.cq-festa-item .tx b{display:block;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:26px;letter-spacing:.5px;line-height:1.05}
.cq-festa-item .tx span{display:block;font-size:13px;color:var(--soft)}
.cq-festa-item .btn-sm{flex:none;min-height:34px;padding:5px 12px;font-size:13px}
.cq-festa-lista.uma .cq-festa-item{flex-direction:column;text-align:center;padding:18px 14px}
.cq-festa-lista.uma .ic{font-size:96px}
.cq-festa-lista.uma .tx b{font-size:40px}
.cq-festa-lista.uma .tx span{font-size:15px}
.cq-festa .btn-row{margin-top:14px}
@keyframes cqpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cq-festa-item{animation:none}}
/* Salas */
.nav-n{position:absolute;top:-4px;right:-12px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--a);color:#fff;font:800 10px/16px "Barlow",sans-serif;text-align:center}
.nav-n.fixo{position:static;display:inline-block;margin-left:4px;vertical-align:middle}
.bottomnav button .ic{position:relative}
@media (max-width:899px){ .bottomnav.n7 button{font-size:9.5px;letter-spacing:-.2px} }
@media (max-width:380px){ .bottomnav.n7 button{font-size:8.6px} .bottomnav.n7{padding-left:4px;padding-right:4px;gap:0} }
.salas-grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){ .salas-grid{grid-template-columns:1fr 1fr} .btn-row.sala-botoes{grid-template-columns:repeat(3,1fr)} }
.sala{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius-lg);padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sala.ativa{border-color:rgba(143,230,255,.75);box-shadow:0 0 0 1px rgba(143,230,255,.35),0 0 22px rgba(143,230,255,.18)}
.sala-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sala-nome{min-width:0}
.sala-nome h3{font-size:30px;line-height:1;margin:0 0 6px;overflow-wrap:anywhere}
.sala-cod{flex:none;text-align:right}
.sala-cod span{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sala-cod b{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:24px;letter-spacing:2px}
.sala-info{margin:8px 0 0}
.sala-pend{margin:10px 0 0;padding:8px 10px;border-radius:12px;background:rgba(242,190,46,.18);border:1px solid rgba(242,190,46,.5);font-size:14px}
.sala-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge.sala-ativa{background:var(--accent);color:#14123C}
.sala-sel{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.sala-sel .btn-sm{min-height:52px}
.convite{text-align:center;background:rgba(0,0,0,.16);border-radius:var(--radius);padding:14px}
.convite span{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.convite b{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:56px;letter-spacing:8px;line-height:1.1}
.sala-achada{text-align:center}
.sala-achada h3{font-size:36px;margin:0 0 6px;overflow-wrap:anywhere}
.sala-achada p{margin:8px 0 0}
.gs-membros{max-height:260px;overflow:auto}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
@media (min-width:900px) and (max-width:1320px){ #nav.bottomnav button{padding:9px 11px;font-size:14px;gap:6px} }
/* Telas de notebook mais estreitas: menu encostado na marca e chip só com o profeta, para caber tudo */
@media (min-width:900px) and (max-width:1180px){
  #nav.bottomnav{left:246px;transform:none;gap:1px}
  .topbar .brand small{display:none}
  #nav.bottomnav button{padding:8px 7px;font-size:13px;gap:4px}
  .topbar .chip span.n{display:none}
  .topbar .chip{padding:6px 8px}
}
/* Logo (Corrida do Rolo) */
.topbar .brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.brand-ic{display:flex;flex:none}
.logo-ic{display:block;height:30px;width:auto}
.brand-tx{display:block;white-space:nowrap}
.brand-tx b{font-weight:400;color:var(--accent)}
.logo-login{padding:26px 0 8px}
.logo-full{display:block;width:min(100%,400px);height:auto;margin:0 auto}
/* Títulos das telas (Quiz, Corrida, Salas): menores e mais leves */
.hero{padding:2px 0 18px;--hero-max:54px}
.hero h1{font-size:clamp(34px,10vw,54px);margin-top:12px;line-height:.92}
.hero p{font-size:16px;margin-top:10px;max-width:46ch;line-height:1.45}
.hero .quill{width:104px;top:6px;right:-10px}
.rolo-h{font-size:clamp(34px,9.6vw,50px);line-height:.95;margin:10px 0 4px}
.hero h1.rolo-h .hl{display:inline;margin-left:.22em}
@media (min-width:900px){ .hero{--hero-max:68px} .rolo-h{font-size:56px} .logo-ic{height:34px} }
/* Missões, níveis e ajudas */
.nivel-selo{display:grid;justify-items:center;align-content:center;width:112px;height:112px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#FFE9A6,#F2BE2E 55%,#C98A12);color:#3A2A00;box-shadow:0 6px 22px rgba(242,190,46,.45),inset 0 0 0 4px rgba(255,255,255,.55)}
.nivel-selo span{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
.nivel-selo b{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;font-size:52px;line-height:.9}
.nivel-selo em{font-style:normal;font-size:11px;font-weight:800;line-height:1.1}
.nivel-selo.peq{width:78px;height:78px;margin:0;flex:none}
.nivel-selo.peq b{font-size:34px}.nivel-selo.peq span{font-size:8px}.nivel-selo.peq em{font-size:9px}
.ms-resumo{display:flex;align-items:center;gap:14px}
.ms-resumo-tx{flex:1;min-width:0}
.ms-resumo-tx h3{font-size:24px;line-height:1.05;margin:0}
.ms-resumo-tx p{margin:2px 0 0;font-size:14px;color:var(--soft)}
.ms-inicio .ajudas-inv{margin-top:12px}
.barra-ms{height:10px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;margin-top:8px}
.barra-ms i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .6s}
.ajudas-inv{display:flex;flex-wrap:wrap;gap:8px}
.ajuda-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid var(--panel-line);border-radius:999px;padding:5px 6px 5px 10px;font-size:13px;font-weight:700}
.ajuda-chip b{min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#14123C;display:grid;place-items:center;font-size:12px;padding:0 5px}
.ajuda-chip.zero{opacity:.5}.ajuda-chip.zero b{background:rgba(255,255,255,.25);color:#fff}
.ms-num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#06301F;font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:24px}
.ms-num.grande{width:84px;height:84px;font-size:46px;margin:0 auto 6px;background:rgba(255,255,255,.2);color:#fff}
.ms-num.grande.feita{background:var(--ok);color:#06301F}
.ms-premio{margin:10px 0 0;padding:8px 10px;border-radius:12px;background:rgba(242,190,46,.18);border:1px solid rgba(242,190,46,.5);font-weight:600}
.novo-profeta{margin-top:12px;padding:12px;border-radius:var(--radius);background:rgba(255,255,255,.12);display:grid;justify-items:center;gap:6px}
.novo-profeta > div{display:grid;justify-items:center}
.novo-profeta .avatar{width:72px;height:92px}
.novo-profeta p{margin:0;font-size:14px;color:var(--soft)}
.prof.bloq{opacity:.55}
.prof.bloq .avatar{filter:grayscale(1) brightness(.75)}
.prof em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--warn)}
/* Trilha */
.trilha-wrap{padding:8px 0;overflow:hidden}
.trilha{position:relative;margin:0 auto}
.trilha-svg{position:absolute;left:0;top:0}
.trilha-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tr-fundo{stroke:rgba(255,255,255,.22);stroke-width:14;stroke-dasharray:2 22}
.tr-feito{stroke:var(--accent);stroke-width:8}
.tr-no{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:#3F3D83;color:rgba(255,255,255,.6);font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:24px;display:grid;place-items:center;z-index:1}
.tr-no.feita{background:var(--accent);border-color:#fff;color:#14123C}
.tr-no.atual{background:#fff;border-color:var(--warn);color:var(--deep);box-shadow:0 0 0 6px rgba(242,190,46,.3);animation:trpulsa 1.6s ease-in-out infinite}
.tr-no.portal{width:68px;height:68px;font-size:30px;border-radius:20px}
.tr-no.portal.feita{background:linear-gradient(160deg,#FFE9A6,#F2BE2E);color:#3A2A00}
.tr-premio{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tr-nivel{position:absolute;transform:translateY(-50%);font-family:"Bebas Neue","Arial Narrow",sans-serif;font-size:20px;letter-spacing:.5px;line-height:1;color:var(--muted);white-space:nowrap}
.tr-nivel small{display:block;font:700 11px "Barlow",sans-serif;letter-spacing:0}
.tr-nivel.on{color:var(--warn)}
.tr-nivel.dir{right:6px;text-align:right}.tr-nivel.esq{left:6px}
.tr-largada{position:absolute;transform:translate(-50%,-50%);padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.tr-profeta{position:absolute;transform:translate(-50%,-112%);z-index:3;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.tr-profeta .avatar{width:44px;height:57px;display:block}
.tr-profeta.andando .avatar{animation:trpasso .42s ease-in-out infinite}
@keyframes trpulsa{0%,100%{box-shadow:0 0 0 4px rgba(242,190,46,.35)}50%{box-shadow:0 0 0 10px rgba(242,190,46,.12)}}
@keyframes trpasso{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.tr-no.atual,.tr-profeta.andando .avatar{animation:none}}
/* Ajudas no quiz */
.ajudas-bar{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 8px}
.ajuda-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:2px solid var(--panel-line);border-radius:999px;padding:6px 8px 6px 10px;font-size:14px;font-weight:800;color:#fff}
.ajuda-btn b{min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#14123C;display:grid;place-items:center;font-size:12px;padding:0 5px}
.ajuda-btn.ativa{background:var(--warn);border-color:#fff;color:#2A2000}
.ajuda-btn.usada{opacity:.6}
.ajuda-dica{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--warn)}
.tile.fora{opacity:.22;text-decoration:line-through;pointer-events:none}
.chance-box{margin-top:12px;padding:12px 14px;border-radius:var(--radius-lg);background:rgba(242,190,46,.16);border:2px solid rgba(242,190,46,.6)}
.chance-box p{margin:0 0 10px}
/* Meu desempenho */
.dz-priv{font:700 11px "Barlow",sans-serif;letter-spacing:0;color:var(--muted);background:rgba(255,255,255,.14);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle;text-transform:none}
.dz-fala{margin:4px 0 12px}
.dz-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dz-stat{background:rgba(0,0,0,.12);border-radius:var(--radius);padding:10px 12px}

.cores{display:flex;gap:10px;flex-wrap:wrap}

.mu-opcoes{display:grid;gap:8px}
.mu-opcao{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.12);border:1px solid var(--panel-line);border-radius:var(--radius);padding:12px;color:#fff}

/* Mapa do trimestre (rolo) */
.mapa{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:16px;background:#F4F1EA;box-shadow:inset 0 0 0 2px #E2D8B8, 0 6px 16px rgba(20,18,60,.25);scrollbar-width:thin}

.mp-leg{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;font-size:11px;font-weight:700;color:#6B6189;line-height:1.25;text-align:center}

/* Chaves de liga/desliga em Minha conta */

/* Tela inicial */
.inicio-hero{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}

.streak{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.14);border-radius:var(--radius);padding:10px 14px;margin-top:10px}

.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (min-width:900px){ .inicio-grid{display:block;column-count:2;column-gap:18px} .inicio-grid>div{display:contents} .inicio-grid .panel,.inicio-grid .atalhos{break-inside:avoid;margin:0 0 18px} .inicio-grid>div+div{margin-top:0} #rkCorpo{margin-top:16px} .badges{grid-template-columns:repeat(6,1fr)} }

tes", "Os reis"], "c": 1, "ref": "João 16:13, citado na lição", "texto": "Depois da ascensão de Jesus ao Céu, o Espírito Santo continua a nos guiar “em toda a verdade”."}, {"p": "Saber que Jesus revela quem Deus é muda como você vê Deus?", "o": ["Muito, me aproxima d’Ele", "Me dá mais confiança", "Me faz querer conhecê-Lo mais", "Ainda estou pensando nisso"], "reflexao": true}], [{"p": "Quando e onde Ellen Harmon (mais tarde White) nasceu?", "o": ["Em 1844, em Portland", "Em 26 de novembro de 1827, em Gorham, no Maine", "Em 1827, em Battle Creek", "Em 1868, na Califórnia"], "c": 1, "ref": "Lição de sexta", "texto": "Ellen Gould Harmon (mais tarde White) e sua irmã gêmea, Elizabeth, nasceram em 26 de novembro de 1827, em Gorham, no estado do Maine."}, {"p": "Qual era o nome da irmã gêmea de Ellen?", "o": ["Elizabeth", "Sarah", "Mary", "Eunice"], "c": 0, "ref": "Lição de sexta", "texto": "Ellen e sua irmã gêmea, Elizabeth, eram as caçulas entre oito filhos de Eunice e Robert Harmon."}, {"p": "O que aconteceu com Ellen aos 9 anos?", "o": ["Teve sua primeira visão", "Mudou-se para a Europa", "Foi batizada", "Uma colega atirou uma pedra que atingiu seu rosto"], "c": 3, "ref": "Lição de sexta", "texto": "Uma colega de escola, em um acesso de raiva, atirou uma pedra que atingiu seu rosto, deixando-a em estado semiconsciente por várias semanas."}, {"p": "Quem ajudou Ellen a compreender e experimentar o amor e a graça de Deus?", "o": ["Guilherme Miller", "Tiago White", "O pastor metodista Levi Stockman", "Seu pai, Robert"], "c": 2, "ref": "Lição de sexta", "texto": "Foi somente ao conhecer Levi Stockman, um pastor metodista, que ela compreendeu e experimentou, de fato, o amor e a graça divinos."}, {"p": "Quais vozes mais influenciam suas decisões hoje?", "o": ["Redes sociais", "Amigos", "Família", "Deus e a Bíblia"], "reflexao": true}]]}, {"n": 2, "titulo": "O chamado do profeta", "datas": "3 a 9 de outubro", "inicio": "2026-10-03", "temas": ["Introdução: O chamado do profeta", "Um chamado desafiador", "Isaías, o profeta do evangelho", "Daniel, o profeta fiel", "Momento hipertexto", "O precursor de Cristo", "Chamada para o ministério profético"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Gênesis 3", "Isaías 6", "Daniel 2", "Jeremias 36"], "c": 1, "ref": "Isaías 6:8", "texto": "Depois disto, ouvi a voz do Senhor, que dizia: A quem enviarei, e quem há de ir por nós? Disse eu: eis-me aqui, envia-me a mim."}, {"p": "Na tirinha, como os jovens do primeiro quadrinho estão descritos?", "o": ["Todos conectados, mas muitos vazios", "Todos felizes e em paz", "Todos estudando a Bíblia", "Todos dormindo"], "c": 0, "ref": "Tirinha da Lição 2", "img": true}, {"p": "Segundo a tirinha, o que conecta com um coração transformado?", "o": ["As redes sociais", "Um celular novo", "O chamado de Deus", "A fama"], "c": 2, "ref": "Tirinha da Lição 2", "img": true}, {"p": "O que o jovem diz no último quadrinho?", "o": ["“Agora não, Senhor”", "“Vou pensar”", "“Me deixa em paz”", "“Eis-me aqui, Senhor. Me envie para levar esperança”"], "c": 3, "ref": "Tirinha da Lição 2", "img": true}, {"p": "Se Deus chamasse você hoje para uma missão, qual seria sua resposta?", "o": ["Eis-me aqui!", "Tenho medo, mas iria", "Preciso de ajuda para isso", "Ainda estou orando sobre isso"], "reflexao": true}], [{"p": "Mais do que anunciar juízos, para que os profetas foram enviados?", "o": ["Para governar o povo", "Para conduzir o povo de volta à fidelidade", "Para escrever leis novas", "Para construir templos"], "c": 1, "ref": "Lição de domingo", "texto": "Mais do que anunciar juízos iminentes, eles foram enviados para conduzir o povo de volta à fidelidade."}, {"p": "Quem é chamado na lição de “pai da fé”?", "o": ["Abraão", "Moisés", "Isaías", "Noé"], "c": 0, "ref": "Lição de domingo", "texto": "Começaremos com o chamado profético do “pai da fé”. Abraão foi chamado por Deus para deixar sua terra e seguir rumo ao desconhecido."}, {"p": "O que Deus pediu a Abraão para provar sua fé?", "o": ["Que construísse uma arca", "Que fosse ao Egito", "Que oferecesse Isaque", "Que derrubasse um altar"], "c": 2, "ref": "Gênesis 22:1-17, citado na lição", "texto": "Para provar sua fé e ilustrar o futuro sacrifício do Filho de Deus, pediu que oferecesse Isaque como oferta."}, {"p": "O que Deus providenciou no lugar de Isaque?", "o": ["Uma pomba", "Um anjo", "Uma oferta de trigo", "Um carneiro"], "c": 3, "ref": "Lição de domingo", "texto": "Em Sua misericórdia, porém, Deus impediu a morte de Isaque e providenciou um carneiro para ser sacrificado em seu lugar."}, {"p": "O que é mais difícil para você ao seguir a Deus?", "o": ["Ir contra a maioria", "Confiar sem entender", "Abrir mão de algo", "Ser constante"], "reflexao": true}], [{"p": "O que o serafim usou para purificar os lábios de Isaías?", "o": ["Água do Jordão", "Uma brasa viva do altar", "Azeite", "Fogo do céu"], "c": 1, "ref": "Isaías 6:6, 7, citado na lição", "texto": "Um serafim voou até o profeta com uma brasa viva do altar celestial e “purificou” seus pecados."}, {"p": "Qual foi a resposta de Isaías ao chamado de Deus?", "o": ["“Envia outro”", "“Não sei falar”", "“Eis-me aqui, envia-me a mim”", "“Depois eu vou”"], "c": 2, "ref": "Isaías 6:8, citado na lição", "texto": "A resposta de Isaías deveria ser também a nossa: “Eis-me aqui, envia-me a mim.”"}, {"p": "Qual capítulo de Isaías revela o plano da salvação de forma tão clara?", "o": ["Isaías 1", "Isaías 6", "Isaías 40", "Isaías 53"], "c": 3, "ref": "Lição de segunda", "texto": "Talvez mais do que qualquer outro capítulo do Antigo Testamento, Isaías 53 revela o plano da salvação de maneira inequívoca."}, {"p": "Complete Isaías 53:6: “Todos nós andávamos desgarrados como…”", "o": ["ovelhas", "crianças", "estrangeiros", "peixes"], "c": 0, "ref": "Isaías 53:6, citado na lição", "texto": "Todos nós andávamos desgarrados como ovelhas; cada um se desviava pelo seu próprio caminho, mas o Senhor fez cair sobre Ele a iniquidade de todos nós."}, {"p": "O que mais toca você em Isaías 53?", "o": ["Jesus sofreu no meu lugar", "Foi escrito 700 anos antes", "O amor de Deus", "A esperança da salvação"], "reflexao": true}], [{"p": "O que Daniel escolheu comer no lugar das iguarias do rei?", "o": ["Pão e mel", "Vegetais e água", "Peixe e vinho", "Nada, ficou em jejum"], "c": 1, "ref": "Daniel 1:12-16, citado na lição", "texto": "Diante das iguarias do rei, escolheu uma alimentação simples, à base de vegetais e água."}, {"p": "O que significa o nome Daniel?", "o": ["Deus é meu Juiz", "Deus é forte", "Deus salva", "Amado de Deus"], "c": 0, "ref": "Lição de terça", "texto": "É muito apropriado que o nome Daniel signifique “Deus é meu Juiz”."}, {"p": "Quais são os quatro impérios de Daniel 2?", "o": ["Egito, Assíria, Babilônia e Roma", "Grécia, Roma, França e Espanha", "Babilônia, Média-Pérsia, Grécia e Roma", "Assíria, Pérsia, Egito e Grécia"], "c": 2, "ref": "Lição de terça", "texto": "Em Daniel 2, ele descreve com precisão a sucessão de quatro grandes impérios mundiais: Babilônia, Média-Pérsia, Grécia e Roma."}, {"p": "Na estátua de Daniel 2, o que representa as nações da Europa moderna?", "o": ["A cabeça de ouro", "O peito de prata", "O ventre de bronze", "Os pés e dedos de ferro e barro"], "c": 3, "ref": "Daniel 2:43, citado na lição", "texto": "Assim como o ferro não se mistura com o barro, essas nações continuam distintas até hoje."}, {"p": "Em que área você quer ser firme como Daniel?", "o": ["Na escola ou no trabalho", "Nas amizades", "Nos hábitos", "Na minha vida com Deus"], "reflexao": true}], [{"p": "Como era o povo a quem Isaías foi enviado?", "o": ["Muito sensível à voz de Deus", "Marcado pela resistência espiritual", "Totalmente fiel", "Sem nenhuma religião"], "c": 1, "ref": "Lição de quarta", "texto": "Seu chamado não foi dirigido a um povo sensível à voz de Deus, mas a uma nação marcada pela resistência espiritual."}, {"p": "Que tipo de mensagem a maioria do povo preferia ouvir?", "o": ["Palavras agradáveis que não perturbassem", "Mensagens de arrependimento", "Profecias sobre o futuro", "Leis novas"], "c": 0, "ref": "Lição de quarta", "texto": "Preferiam palavras agradáveis e promessas que não perturbassem sua falsa sensação de segurança."}, {"p": "Segundo a lição, a fidelidade profética depende…", "o": ["de muita gente aceitar a mensagem", "de ter muitos seguidores", "da disposição de proclamar a mensagem com coragem", "de fazer milagres"], "c": 2, "ref": "Lição de quarta", "texto": "A fidelidade profética não depende da aceitação da mensagem, mas da disposição de proclamá-la com coragem, verdade e perseverança."}, {"p": "Qual destes textos a lição usa para mostrar um público teimoso e rebelde?", "o": ["Isaías 53:6", "Isaías 6:8", "Isaías 40:8", "Isaías 1:2-5"], "c": 3, "ref": "Isaías 1:2", "texto": "Criei filhos e os engrandeci, mas eles estão revoltados contra mim."}, {"p": "Na sua rede semântica, que palavra você ligaria a “chamado”?", "o": ["Missão", "Coragem", "Resposta", "Propósito"], "reflexao": true}], [{"p": "Como Jesus descreveu João Batista em Mateus 11:9?", "o": ["Um simples mensageiro", "Muito mais do que um profeta", "O maior dos reis", "Um sacerdote do templo"], "c": 1, "ref": "Mateus 11:9, citado na lição", "texto": "Jesus disse a Seus discípulos que João era “muito mais do que um profeta”."}, {"p": "Há quanto tempo Israel estava sem profetas quando João Batista apareceu?", "o": ["Mais de quatro séculos", "Dez anos", "Cem anos", "Mil anos"], "c": 0, "ref": "Lição de quinta", "texto": "Numa época em que Israel estava sem profetas havia mais de quatro séculos, João foi o precursor do Messias."}, {"p": "Que profecia o ministério de João Batista cumpriu?", "o": ["A de Daniel 2", "A de Jeremias 36", "A de Isaías sobre um mensageiro que viria", "A de Gênesis 3:15"], "c": 2, "ref": "Marcos 1:2-5, citando Isaías 40:3", "texto": "O ministério de João Batista foi o cumprimento da profecia de Isaías sobre um mensageiro que viria."}, {"p": "O que aconteceu com João Batista no fim do seu ministério?", "o": ["Foi para o Egito", "Virou rei", "Subiu ao céu", "Foi preso e morto, mas permaneceu fiel"], "c": 3, "ref": "Lição de quinta", "texto": "Apesar de suas duras condições, João permaneceu fiel até a morte."}, {"p": "Quando passa por dificuldades, o que mais ajuda você a continuar firme?", "o": ["Lembrar o que Deus já fez", "Orar", "Ler a Bíblia", "Conversar com alguém da igreja"], "reflexao": true}], [{"p": "Quando Ellen Harmon recebeu seu primeiro chamado?", "o": ["Em 1827", "Em dezembro de 1844", "Em 1863", "Em 1915"], "c": 1, "ref": "Lição de sexta", "texto": "Ellen Harmon (depois White) recebeu seu primeiro chamado em dezembro de 1844."}, {"p": "Que data os seguidores de Miller apontaram para a volta de Jesus?", "o": ["22 de outubro de 1844", "25 de dezembro de 1844", "1º de janeiro de 1900", "26 de novembro de 1827"], "c": 0, "ref": "Lição de sexta", "texto": "Seus seguidores acabaram apontando 22 de outubro de 1844 como a data da volta de Cristo à Terra."}, {"p": "Como ficou conhecido o episódio em que Jesus não voltou como os mileritas esperavam?", "o": ["A Grande Volta", "O Grande Despertar", "O Grande Desapontamento", "A Grande Reforma"], "c": 2, "ref": "Lição de sexta", "texto": "Os mileritas passaram por um dos episódios mais devastadores dos tempos modernos: o Grande Desapontamento."}, {"p": "Na primeira visão de Ellen, o que mantinha o povo seguro no caminho?", "o": ["Andar em grupo", "Levar lanternas", "Correr bem rápido", "Manter o olhar fixo em Jesus"], "c": 3, "ref": "Primeiros Escritos, p. 32, citado na lição", "texto": "Se conservavam o olhar fixo em Jesus, que Se achava precisamente diante deles, guiando-os para a cidade, permaneciam seguros."}, {"p": "O que ajuda você a manter os olhos fixos em Jesus?", "o": ["A oração", "A lição diária", "A igreja e os amigos", "A música"], "reflexao": true}]]}, {"n": 3, "titulo": "Profetas do AT", "datas": "10 a 16 de outubro", "inicio": "2026-10-10", "temas": ["Introdução: Profetas do AT", "GPS espiritual", "A humanidade dos profetas", "Confrontando falsos profetas", "Momento hipertexto", "Funções dos profetas", "Imperfeita, mas disposta"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["1 Reis 19:1-16", "Isaías 6", "Jeremias 36:1-19", "1 Samuel 3"], "c": 0, "ref": "1 Reis 19:12", "texto": "Depois do terremoto, um fogo, mas o Senhor não estava no fogo; e, depois do fogo, um cicio tranquilo e suave."}, {"p": "No primeiro quadrinho da tirinha, o que o profeta diz?", "o": ["“Eis-me aqui!”", "“Tira a minha vida!”", "“Fogo do céu!”", "“Estou com fome!”"], "c": 1, "ref": "Tirinha da Lição 3", "img": true}, {"p": "Que “modo” aparece ativado no segundo quadrinho?", "o": ["Modo avião", "Modo soneca", "Modo depressivo", "Modo foco"], "c": 2, "ref": "Tirinha da Lição 3", "img": true}, {"p": "O que o anjo diz no último quadrinho?", "o": ["“Pode descansar para sempre”", "“Volte para casa”", "“Desista”", "“Ainda há trabalho!”"], "c": 3, "ref": "Tirinha da Lição 3", "img": true}, {"p": "Quando você se sente desanimado, o que mais ajuda?", "o": ["Descansar e cuidar do corpo", "Orar e ler a Bíblia", "Conversar com alguém", "Lembrar o que Deus já fez"], "reflexao": true}], [{"p": "Como Elias foi levado ao Céu?", "o": ["Num redemoinho, com um carro de fogo", "Numa nuvem", "Numa escada", "Ele morreu velho em casa"], "c": 0, "ref": "2 Reis 2:11, citado na lição", "texto": "Elias não morreu, mas foi levado ao Céu em um redemoinho, acompanhado por um carro de fogo."}, {"p": "Onde Elias enfrentou centenas de profetas falsos?", "o": ["No monte Sinai", "No monte Carmelo", "No monte das Oliveiras", "No monte Moriá"], "c": 1, "ref": "Lição de domingo", "texto": "Reuniu a nação no monte Carmelo, onde enfrentou centenas de profetas falsos."}, {"p": "Com o que a lição compara o papel de Elias?", "o": ["Um mapa de papel", "Um farol", "Um GPS espiritual", "Uma bússola quebrada"], "c": 2, "ref": "Lição de domingo", "texto": "Como um GPS espiritual, Elias foi chamado para revelar a verdadeira condição espiritual de Israel."}, {"p": "Segundo Malaquias 4:6, o chamado do tempo do fim promove cura onde?", "o": ["Nos templos", "Nas cidades", "Nas escolas", "Nos corações e nos lares"], "c": 3, "ref": "Lição de domingo", "texto": "Segundo Malaquias 4:6, esse chamado do tempo do fim promove verdadeira cura nos corações e nos lares."}, {"p": "Qual área da sua vida mais precisa de um “GPS espiritual” agora?", "o": ["Minhas escolhas", "Meus relacionamentos", "Meus estudos ou trabalho", "Minha vida com Deus"], "reflexao": true}], [{"p": "O que diz Tiago 5:17 sobre Elias?", "o": ["Era um anjo", "Era humano como nós", "Nunca sentiu medo", "Era rei de Israel"], "c": 1, "ref": "Tiago 5:17, citado na lição", "texto": "Sem dúvida, “Elias era humano como nós”."}, {"p": "O que aconteceu logo depois da vitória no monte Carmelo?", "o": ["Elias foi coroado", "Elias entrou em desespero e fugiu", "Elias fez uma festa", "Elias foi para o Egito"], "c": 1, "ref": "Lição de segunda", "texto": "Ameaçado por uma rainha idólatra e perversa, Elias entrou em pânico e fugiu para salvar a própria vida."}, {"p": "O que Elias pediu a Deus debaixo do zimbro?", "o": ["Comida", "Uma esposa", "Que tirasse a sua vida", "Mais fogo do céu"], "c": 2, "ref": "1 Reis 19:4, citado na lição", "texto": "Basta, Senhor! Tira a minha vida, porque eu não sou melhor do que os meus pais."}, {"p": "Elias lamentava como se tudo dependesse de quem?", "o": ["De Acabe", "De Jezabel", "Do povo", "Apenas dele mesmo"], "c": 3, "ref": "Lição de segunda", "texto": "Elias parecia lamentar aquilo que via como fracasso, como se tudo dependesse apenas dele para corrigir toda a nação."}, {"p": "Que promessa bíblica ajuda você quando sente que falhou?", "o": ["Deus não me abandona", "Ele renova minhas forças", "Posso recomeçar com Ele", "Ainda estou procurando uma"], "reflexao": true}], [{"p": "Quantos “profetas” aconselharam Acabe e Josafá a ir à guerra?", "o": ["40", "120", "400", "4.000"], "c": 2, "ref": "1 Reis 22:6, citado na lição", "texto": "Um grupo de 400 “profetas” aconselhou, com uma só voz, os reis a irem à guerra."}, {"p": "Qual verdadeiro profeta do Senhor foi chamado nessa história?", "o": ["Elias", "Micaías", "Eliseu", "Natã"], "c": 1, "ref": "1 Reis 22:7, 8, citado na lição", "texto": "Micaías foi chamado. Embora fosse reconhecido como profeta de Deus, era odiado por Acabe."}, {"p": "Por que Acabe odiava Micaías?", "o": ["Porque nunca profetizava o bem a respeito dele", "Porque era estrangeiro", "Porque era muito jovem", "Porque não sabia falar"], "c": 0, "ref": "1 Reis 22:8, citado na lição", "texto": "Eu o odeio, porque nunca profetiza de mim o que é bom, mas somente o que é mau."}, {"p": "O que Micaías fez diante da pressão para concordar com os outros?", "o": ["Concordou com a maioria", "Fugiu da cidade", "Ficou em silêncio", "Esperou que Deus lhe dissesse o que falar"], "c": 3, "ref": "1 Reis 22:14, citado na lição", "texto": "Mas Micaías não cedeu. Em vez disso, esperou que Deus lhe dissesse o que falar."}, {"p": "Por que a opinião da maioria nem sempre é um bom guia?", "o": ["A maioria pode estar errada", "Deus fala mesmo pela minoria", "A verdade não depende de votação", "Por tudo isso"], "reflexao": true}], [{"p": "Qual profetisa foi líder espiritual durante o êxodo?", "o": ["Hulda", "Débora", "Miriã", "Ana"], "c": 2, "ref": "Êxodo 15:20, citado na lição", "texto": "Miriã aparece como profetisa e líder espiritual durante o êxodo de Israel."}, {"p": "Além de profetisa, que função Débora exercia?", "o": ["Sacerdotisa", "Rainha", "Juíza", "Escriba"], "c": 2, "ref": "Juízes 4:4, 5, citado na lição", "texto": "Débora, além de profetisa, foi juíza e orientou a nação com discernimento espiritual em um período de crise."}, {"p": "Quem os líderes consultaram quando o Livro da Lei foi encontrado?", "o": ["Hulda", "Miriã", "Débora", "Jezabel"], "c": 0, "ref": "2 Reis 22:11-14, citado na lição", "texto": "Quando o Livro da Lei foi encontrado, autoridades e líderes buscaram a orientação espiritual de Hulda."}, {"p": "Segundo a lição, qual era o problema das falsas profetisas?", "o": ["Serem mulheres", "Serem jovens", "Serem estrangeiras", "A infidelidade ao chamado de Deus"], "c": 3, "ref": "Lição de quarta", "texto": "O problema não estava em serem mulheres, mas na fidelidade ou infidelidade ao chamado de Deus."}, {"p": "Na sua rede semântica, que palavra você ligaria a “profetisas”?", "o": ["Coragem", "Liderança", "Fidelidade", "Sabedoria"], "reflexao": true}], [{"p": "O que o povo pediu a Samuel?", "o": ["Um templo novo", "Um rei, como as outras nações", "Mais profetas", "Uma nova lei"], "c": 1, "ref": "1 Samuel 8:5, citado na lição", "texto": "Queremos um rei, para que nos governe, como acontece em todas as nações."}, {"p": "Quem foi o primeiro rei de Israel ungido por Samuel?", "o": ["Saul", "Davi", "Salomão", "Acabe"], "c": 0, "ref": "Lição de quinta", "texto": "Samuel logo ungiu o primeiro rei de Israel, Saul."}, {"p": "Quem ungiu Arão e seus filhos como os primeiros sacerdotes?", "o": ["Samuel", "Elias", "Moisés", "Isaías"], "c": 2, "ref": "Levítico 8:10-13, citado na lição", "texto": "Moisés, profeta de Deus, ungiu Arão e seus filhos como os primeiros sacerdotes de Israel."}, {"p": "Qual família de sacerdote foi confrontada por causa de seus pecados?", "o": ["A de Arão", "A de Zadoque", "A de Hilquias", "A de Eli"], "c": 3, "ref": "1 Samuel 2:27-36, citado na lição", "texto": "Um exemplo marcante é o da família de Eli, confrontada por causa de seus pecados."}, {"p": "Com quem você gostaria de compartilhar uma mensagem de Deus esta semana?", "o": ["Alguém da família", "Um amigo", "Alguém da escola ou trabalho", "Alguém nas redes sociais"], "reflexao": true}], [{"p": "Como era Ellen quando recebeu o chamado de Deus?", "o": ["Experiente e famosa", "Jovem, tímida e com a saúde frágil", "Rica e influente", "Pastora conhecida"], "c": 1, "ref": "Lição de sexta", "texto": "Ela era jovem, tímida e tinha a saúde frágil quando recebeu o chamado divino."}, {"p": "Quantos anos Ellen tinha quando recebeu a segunda visão?", "o": ["12", "17", "25", "30"], "c": 1, "ref": "Testemunhos Para a Igreja, v. 1, p. 59, 60, citado na lição", "texto": "Eu estava, então, com apenas 17 anos de idade."}, {"p": "O que o anjo repetia aos ouvidos de Ellen?", "o": ["“Descanse”", "“Espere mais um pouco”", "“Fale a outros o que lhe revelei”", "“Escolha outra pessoa”"], "c": 2, "ref": "Testemunhos Para a Igreja, v. 1, p. 59, 60, citado na lição", "texto": "Soavam-se continuamente aos ouvidos as palavras do anjo: ‘Fale a outros o que lhe revelei.’"}, {"p": "O que ajudou Ellen a aceitar o chamado?", "o": ["Ganhar dinheiro", "Ser convidada para viajar", "Ficar famosa", "Muita oração e o encorajamento de irmãos de fé"], "c": 3, "ref": "Lição de sexta", "texto": "Depois de muita oração e do encorajamento de irmãos de fé, ela se rendeu e decidiu cumprir a ordem de Deus."}, {"p": "Você já sentiu que não era capaz de fazer algo para Deus?", "o": ["Sim, e Ele me ajudou", "Sim, ainda me sinto assim", "Às vezes", "Nunca pensei nisso"], "reflexao": true}]]}, {"n": 4, "titulo": "Profetas do NT", "datas": "17 a 23 de outubro", "inicio": "2026-10-17", "temas": ["Introdução: Profetas do NT", "A mesma fonte", "Funções dos profetas do NT", "Profetisas e jovens pastores", "Momento hipertexto", "O Profeta supremo", "Jesus e Sua Palavra no centro"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Efésios 2:19 a 3:7", "Atos 2:1-21", "Romanos 1:1-7", "1 Coríntios 14"], "c": 0, "ref": "Efésios 2:20", "texto": "Edificados sobre o fundamento dos apóstolos e profetas, sendo ele mesmo, Cristo Jesus, a pedra angular."}, {"p": "Que frase aparece no alto da tirinha?", "o": ["“Todos conectados, mas vazios”", "“Épocas diferentes, mas o mesmo Espírito”", "“Deus falou de muitas maneiras”", "“Preste atenção!”"], "c": 1, "ref": "Tirinha da Lição 4", "img": true}, {"p": "Quem aparece no centro da tirinha, entre os personagens de épocas diferentes?", "o": ["Um rei", "Um soldado", "Jesus", "Um anjo"], "c": 2, "ref": "Tirinha da Lição 4", "img": true}, {"p": "No último quadrinho, o que a jovem está fazendo?", "o": ["Dormindo", "Jogando no celular", "Cozinhando", "Lendo a Bíblia"], "c": 3, "ref": "Tirinha da Lição 4", "img": true}, {"p": "O que une você aos profetas e apóstolos do passado?", "o": ["O mesmo Espírito Santo", "A mesma Bíblia", "A mesma esperança", "Tudo isso"], "reflexao": true}], [{"p": "O que significa o termo grego “apóstolos”?", "o": ["Mensageiros ou enviados", "Sacerdotes", "Reis", "Escritores"], "c": 0, "ref": "Lição de domingo", "texto": "Os apóstolos eram “mensageiros” ou “enviados” do Senhor, como indica o termo grego apóstolos."}, {"p": "Paulo se via como apóstolo de quem?", "o": ["Dos sacerdotes", "Dos gentios", "Dos reis", "Somente dos judeus"], "c": 1, "ref": "Romanos 11:13, citado na lição", "texto": "Ele se via como apóstolo dos gentios e defendia seu apostolado como alicerçado na obra de Cristo."}, {"p": "Como Deus escolhia profetas e apóstolos?", "o": ["Por herança, de pai para filho", "Por sorteio", "De acordo com Sua vontade", "Por votação do povo"], "c": 2, "ref": "Lição de domingo", "texto": "Ao contrário do sacerdócio, que seguia uma linhagem física, Deus designava profetas e apóstolos de acordo com Sua vontade."}, {"p": "Segundo a lição, os apóstolos tinham que grau de inspiração?", "o": ["Menor que o dos profetas", "Nenhum", "Só quando escreviam cartas", "O mesmo grau que os profetas"], "c": 3, "ref": "Efésios 3:1-5, citado na lição", "texto": "Como receptores da revelação divina, os apóstolos tinham o mesmo grau de inspiração que os profetas."}, {"p": "Se você fosse um “enviado” de Deus hoje, para onde iria primeiro?", "o": ["Minha casa", "Minha escola ou trabalho", "Meus amigos", "Minhas redes sociais"], "reflexao": true}], [{"p": "Segundo Efésios 2:20, quem é o fundamento da igreja?", "o": ["Pedro", "Cristo", "Paulo", "Moisés"], "c": 1, "ref": "Lição de segunda", "texto": "Paulo defendia seu apostolado como alicerçado na obra de Cristo, que é o Fundamento da igreja."}, {"p": "Em Efésios 4:11, ao lado de quem os profetas são mencionados?", "o": ["Apóstolos, evangelistas, pastores e mestres", "Reis e sacerdotes", "Juízes e soldados", "Escribas e fariseus"], "c": 0, "ref": "Efésios 4:11, citado na lição", "texto": "Os profetas são mencionados ao lado de apóstolos, evangelistas, pastores e mestres."}, {"p": "Quais dois profetas de Atos encorajaram e fortaleceram os irmãos?", "o": ["Pedro e João", "Paulo e Barnabé", "Judas e Silas", "Timóteo e Tito"], "c": 2, "ref": "Atos 15:32, citado na lição", "texto": "Judas e Silas “encorajaram e fortaleceram os irmãos com muitas palavras” – e nenhum deles escreveu livros da Bíblia."}, {"p": "Como Apocalipse 22:6 descreve as palavras de Deus?", "o": ["Difíceis e escondidas", "Antigas e ultrapassadas", "Só para poucos", "Fiéis e verdadeiras"], "c": 3, "ref": "Apocalipse 22:6, citado na lição", "texto": "Jesus é apresentado como “o Senhor, o Deus dos espíritos dos profetas”, cujas “palavras são fiéis e verdadeiras”."}, {"p": "Quem você pode encorajar esta semana, como Judas e Silas?", "o": ["Um amigo", "Alguém da família", "Alguém da igreja", "Alguém que está sozinho"], "reflexao": true}], [{"p": "Quem é a primeira pessoa chamada de profetisa no Novo Testamento?", "o": ["Maria", "Isabel", "Ana", "Priscila"], "c": 2, "ref": "Lucas 2:37, 38, citado na lição", "texto": "Ana é a primeira pessoa chamada de profetisa no Novo Testamento. Ela adorava noite e dia, com jejuns e orações."}, {"p": "Quantas filhas de Filipe profetizavam?", "o": ["Duas", "Três", "Quatro", "Sete"], "c": 2, "ref": "Atos 21:9, citado na lição", "texto": "Filipe tinha “quatro filhas solteiras que profetizavam”."}, {"p": "Como Paulo chamava Timóteo?", "o": ["Verdadeiro filho na fé", "Meu servo", "Meu mestre", "Meu rei"], "c": 0, "ref": "1 Timóteo 1:2, citado na lição", "texto": "Paulo se dirigiu a Timóteo como “verdadeiro filho na fé”."}, {"p": "Em que lugar Paulo pediu a Tito que estabelecesse líderes?", "o": ["Roma", "Éfeso", "Corinto", "Creta"], "c": 3, "ref": "Tito 1:4, 5, citado na lição", "texto": "Paulo confiou a Tito a tarefa de estabelecer líderes entre os cristãos de Creta, uma igreja especialmente desafiadora."}, {"p": "Qual pode ser o seu papel na obra de Deus hoje?", "o": ["Cantar ou tocar", "Ensinar ou explicar", "Ajudar quem precisa", "Convidar amigos"], "reflexao": true}], [{"p": "Segundo a lição, qual será uma das marcas dos últimos tempos?", "o": ["O fim das profecias", "O engano espiritual", "A falta de igrejas", "O fim das Bíblias"], "c": 1, "ref": "Lição de quarta", "texto": "O Novo Testamento alerta que o engano espiritual será uma das marcas dos últimos tempos."}, {"p": "Qual é a orientação bíblica diante de mensagens espirituais?", "o": ["Aceitar tudo", "Rejeitar tudo", "Examinar com atenção", "Seguir a maioria"], "c": 2, "ref": "Lição de quarta", "texto": "A orientação bíblica não é aceitar tudo, mas examinar com atenção aquilo que é apresentado como mensagem espiritual."}, {"p": "Como se reconhece o verdadeiro profeta, segundo a lição?", "o": ["Pelo caráter, pela vontade de Deus e pelo cumprimento das mensagens", "Pelos milagres apenas", "Pela fama", "Pelo número de seguidores"], "c": 0, "ref": "Lição de quarta", "texto": "O verdadeiro profeta não é reconhecido apenas por palavras ou manifestações, mas pelo caráter, pela conformidade com a vontade divina e pelo cumprimento de suas mensagens."}, {"p": "Que texto fala sobre a armadura de Deus contra os ataques espirituais?", "o": ["Mateus 7:15", "1 João 4:1", "2 Pedro 2:1", "Efésios 6:10-18"], "c": 3, "ref": "Efésios 6:11", "texto": "Revesti-vos de toda a armadura de Deus, para poderdes ficar firmes contra as ciladas do diabo."}, {"p": "Na sua rede semântica, que palavra você ligaria a “examinar”?", "o": ["Bíblia", "Discernimento", "Cuidado", "Verdade"], "reflexao": true}], [{"p": "Para quem apontava a profecia de Moisés sobre “um profeta semelhante a mim”?", "o": ["Josué", "Jesus", "Elias", "Samuel"], "c": 1, "ref": "Deuteronômio 18:15, citado na lição", "texto": "O Senhor, seu Deus, fará com que do meio de vocês se levante um profeta semelhante a mim; a ele vocês devem ouvir."}, {"p": "Quando Jesus perguntou quem Ele era, o que os discípulos responderam?", "o": ["Que Ele era o Cristo", "Que era Elias", "Que era João Batista", "Que era um rabino"], "c": 0, "ref": "Marcos 8:27-29, citado na lição", "texto": "Eles responderam corretamente que Ele era o Cristo."}, {"p": "Segundo João 1:3, o que foi feito por meio do Verbo?", "o": ["Só os anjos", "Só a Terra", "Todas as coisas", "Só os seres humanos"], "c": 2, "ref": "João 1:3, citado na lição", "texto": "Todas as coisas foram feitas por Ele e, sem Ele, nada do que foi feito se fez."}, {"p": "Como Apocalipse 22:16 chama Jesus?", "o": ["O Sol da justiça", "O Leão de Judá", "A Pedra angular", "A Estrela da Manhã"], "c": 3, "ref": "Lição de quinta", "texto": "A profecia continuará trazendo luz até que Jesus, a “Estrela da Manhã”, estabeleça Seu reino eterno."}, {"p": "O que mais toca você em saber que o Criador morreu por você?", "o": ["Que Ele me ama tanto", "Que eu valho muito para Ele", "Que posso confiar n’Ele", "Que posso ser perdoado"], "reflexao": true}], [{"p": "Com que frase a Série Conflito começa e termina?", "o": ["“Deus é amor”", "“Eis que venho sem demora”", "“No princípio”", "“Maranata”"], "c": 0, "ref": "Lição de sexta", "texto": "A famosa Série Conflito, em cinco volumes, começa e termina com a frase “Deus é amor”."}, {"p": "Qual é talvez o livro mais conhecido de Ellen White?", "o": ["Patriarcas e Profetas", "Caminho a Cristo", "Primeiros Escritos", "O Grande Conflito"], "c": 1, "ref": "Lição de sexta", "texto": "Em Caminho a Cristo, talvez seu livro mais conhecido, ela escreveu sobre a união com Cristo."}, {"p": "Como Ellen White chamava seus escritos em relação à Bíblia?", "o": ["A luz maior", "Uma nova Bíblia", "Uma luz menor que guia à luz maior", "Um livro secreto"], "c": 2, "ref": "Lição de sexta", "texto": "Ela entendia seus escritos como uma “luz menor”, destinada a guiar as pessoas à “luz maior” – a Bíblia."}, {"p": "Que livro sobre a vida de Jesus deixava Ellen profundamente sensibilizada ao escrever?", "o": ["Caminho a Cristo", "Primeiros Escritos", "Educação", "O Desejado de Todas as Nações"], "c": 3, "ref": "Lição de sexta", "texto": "Enquanto trabalhava no livro O Desejado de Todas as Nações, ela registrou que ficava profundamente sensibilizada ao escrever sobre a vida de Cristo."}, {"p": "Qual é o centro da sua vida espiritual hoje?", "o": ["Jesus", "A Bíblia", "A igreja", "Ainda estou descobrindo"], "reflexao": true}]]}, {"n": 5, "titulo": "Revelação e inspiração", "datas": "24 a 30 de outubro", "inicio": "2026-10-24", "temas": ["Introdução: Revelação e inspiração", "Revelação geral e especial", "Recebendo e transmitindo", "Símbolos, parábolas e encenações", "Momento hipertexto", "Mensagens orais", "Revelação e inspiração"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Daniel 2", "Apocalipse 1", "Jeremias 36", "Atos 2"], "c": 1, "ref": "Apocalipse 1:3", "texto": "Bem-aventurados aqueles que leem e aqueles que ouvem as palavras da profecia e guardam as coisas nela escritas, pois o tempo está próximo."}, {"p": "Na tirinha, sobre o que os jovens conversam olhando a paisagem?", "o": ["Sobre o clima", "Sobre a natureza que fala de Deus", "Sobre o jogo de futebol", "Sobre a escola"], "c": 1, "ref": "Tirinha da Lição 5", "img": true}, {"p": "Segundo a tirinha, o que Deus nos deu além da natureza?", "o": ["Um celular", "Um mapa", "Sua Palavra, a Bíblia", "Um professor"], "c": 2, "ref": "Tirinha da Lição 5", "img": true}, {"p": "Na tirinha, por meio de que Deus falou para nos conduzir a Jesus?", "o": ["Só por anjos", "Por sorteios", "Pelas estrelas", "Por profetas, visões, parábolas e símbolos"], "c"  João e Deus"], "c": 0, "ref": "Apocalipse 1:1-3, citado na lição", "texto": "A sequência era: Deus, o Pai; Jesus Cristo; o anjo; o apóstolo João; e, por fim, os leitores e ouvintes."}, {"p": "O que Jesus ordenou a João em Apocalipse 1:19?", "o": ["Que fugisse", "Que ficasse calado", "Que escrevesse as coisas que viu", "Que voltasse a Jerusalém"], "c": 2, "ref": "Apocalipse 1:19, citado na lição", "texto": "Escreva, pois, as coisas que você viu: as coisas que são e as que hão de vir depois destas."}, {"p": "Segundo a lição, existem “graus” de inspiração entre os livros da Bíblia?", "o": ["Sim, os Evangelhos são mais inspirados", "Sim, só as profecias são inspiradas", "Depende do autor", "Não, não há graus de inspiração"], "c": 3, "ref": "Lição de segunda", "texto": "As nuances pessoais e os estilos variados de cada autor não diminuem em nada a validade das mensagens, pois não há “graus” de inspiração divina."}, {"p": "Por que você acha que Deus quer tanto falar com a gente?", "o": ["Porque nos ama", "Para nos guiar", "Para nos salvar", "Por tudo isso"], "reflexao": true}], [{"p": "Quais livros da Bíblia usam muitos símbolos como bestas e chifres?", "o": ["Daniel e Apocalipse", "Rute e Ester", "Provérbios e Salmos", "Atos e Romanos"], "c": 0, "ref": "Lição de terça", "texto": "O Apocalipse segue um estilo semelhante ao do livro de Daniel, cheio de símbolos proféticos."}, {"p": "Segundo a lição, quem oferece a interpretação correta dos símbolos?", "o": ["Os filmes", "A própria Bíblia", "Os jornais", "A imaginação de cada um"], "c": 1, "ref": "Lição de terça", "texto": "Aos poucos, estudantes dedicados acabam descobrindo que a própria Bíblia oferece a interpretação correta."}, {"p": "Qual destas metáforas Jesus usou para Si mesmo?", "o": ["A Pedra angular escondida", "O Rei do Egito", "O Pão da Vida", "O Leão do deserto"], "c": 2, "ref": "João 6:35, citado na lição", "texto": "Ele Se apresentou como o Pão da Vida, a Luz do mundo e a Videira Verdadeira."}, {"p": "O que
