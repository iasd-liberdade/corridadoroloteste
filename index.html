 Bíblia", "Nunca falou sobre isso"], "c": 2, "ref": "Lição de sexta", "texto": "Ela jamais considerou seus escritos como estando no mesmo nível das Escrituras. Pelo contrário, Ellen White sempre exaltou a Bíblia."}, {"p": "Como a lição chama a união entre revelação divina e experiência humana?", "o": ["Ditado palavra por palavra", "Escrita automática", "Tradução celestial", "Inspiração de pensamento"], "c": 3, "ref": "Lição de sexta", "texto": "Ellen White entendia a “inspiração de pensamento” como uma união entre a revelação divina e a experiência humana."}, {"p": "Qual pergunta sobre a Bíblia você gostaria de levar para o sábado?", "o": ["Sobre profecias", "Sobre como ela foi escrita", "Sobre Ellen White", "Sobre como aplicar na vida"], "reflexao": true}]]}, {"n": 6, "titulo": "Os escritos proféticos", "datas": "31 de outubro a 6 de novembro", "inicio": "2026-10-31", "temas": ["Introdução: Os escritos proféticos", "Gêneros e estilos literários", "Assistentes literários", "Fontes literárias", "Momento hipertexto", "Tesouro em vasos de barro", "Os escritos de Ellen White"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Jeremias 36:20-32", "Jeremias 36:1-19", "Êxodo 17:14", "Romanos 16:22"], "c": 1, "ref": "Jeremias 36:2", "texto": "Toma um rolo, um livro, e escreve nele todas as palavras que te falei contra Israel, contra Judá e contra todas as nações, desde o dia em que te falei, desde os dias de Josias até hoje."}, {"p": "Segundo a tirinha, o que Deus usou para a Bíblia chegar até nós?", "o": ["Apenas anjos", "Um único escritor", "Muitas pessoas e muitos planos", "Somente a internet"], "c": 2, "ref": "Tirinha da Lição 6", "img": true}, {"p": "No segundo quadrinho, que invenção aparece ajudando a espalhar a Bíblia?", "o": ["A prensa de impressão", "O rádio", "O telégrafo", "O computador"], "c": 0, "ref": "Tirinha da Lição 6", "img": true}, {"p": "No último quadrinho, onde a jovem está lendo a Bíblia?", "o": ["Num rolo de pergaminho", "Numa Bíblia de capa dura", "Num jornal", "No celular"], "c": 3, "ref": "Tirinha da Lição 6", "img": true}, {"p": "Como a Bíblia costuma chegar até você no dia a dia?", "o": ["Bíblia impressa", "App no celular", "Áudio", "Ouvindo na igreja"], "reflexao": true}], [{"p": "Quais são as três formas principais pelas quais os profetas comunicaram as mensagens de Deus?", "o": ["Por cartas, músicas e pinturas", "Oralmente, por escrito e por ações simbólicas", "Apenas por sonhos", "Por anjos, livros e jornais"], "c": 1, "ref": "Lição de domingo", "texto": "A Bíblia apresenta três formas principais pelas quais os profetas comunicaram as mensagens de Deus: (1) oralmente; (2) por escrito; e (3) por meio de ações simbólicas ou encenações."}, {"p": "Em que texto aparece a primeira instrução divina para registrar num “livro” o que Deus falou?", "o": ["Gênesis 1:1", "Jeremias 36:2", "Êxodo 17:14", "Apocalipse 1:3"], "c": 2, "ref": "Lição de domingo, sobre Êxodo 17:14", "texto": "Somente a partir do tempo de Moisés as Escrituras registram a primeira instrução divina a respeito dessas experiências: registrar em um “livro” aquilo que Deus havia falado."}, {"p": "Quais livros a lição cita como exemplos de escritos apocalípticos?", "o": ["Gênesis, Êxodo e Levítico", "Salmos, Provérbios e Eclesiastes", "Mateus, Marcos e Lucas", "Daniel, Zacarias e Apocalipse"], "c": 3, "ref": "Lição de domingo", "texto": "Já os livros de Daniel, Zacarias e Apocalipse contêm exemplos de escritos apocalípticos, que são marcados por forte simbolismo, temas cósmicos e descrições de seres celestiais."}, {"p": "Os diferentes estilos literários da Bíblia têm autoridades diferentes?", "o": ["Não, não há distinção de autoridade divina entre eles", "Sim, as poesias valem menos", "Sim, só as profecias têm autoridade", "Depende de quem escreveu"], "c": 0, "ref": "Lição de domingo", "texto": "Apesar das profundas diferenças entre esses gêneros e estilos literários, não há qualquer distinção de autoridade divina entre um estilo de comunicação e outro."}, {"p": "Que estilo da Bíblia você mais gosta de ler?", "o": ["Histórias", "Poesias e salmos", "Profecias", "Cartas"], "reflexao": true}], [{"p": "Quem escreveu no rolo as palavras ditadas por Jeremias?", "o": ["Tércio", "Baruque", "Esdras", "Lucas"], "c": 1, "ref": "Jeremias 36:18", "texto": "Ele pessoalmente ditou todas estas palavras, e eu as escrevi com tinta neste rolo."}, {"p": "Quem escreveu a carta aos Romanos, registrando o que Paulo ditava?", "o": ["Timóteo", "Silas", "Tércio", "Baruque"], "c": 2, "ref": "Romanos 16:22", "texto": "Eu, Tércio, que escrevi esta carta, mando saudações no Senhor."}, {"p": "O que era um “amanuense”?", "o": ["Um secretário que registrava as palavras de outra pessoa", "Um profeta do Antigo Testamento", "Um tipo de rolo", "Um sacerdote do templo"], "c": 0, "ref": "Lição de segunda", "texto": "Tércio era seu “amanuense” – isto é, um secretário ou assistente literário que registrava as palavras de Paulo."}, {"p": "Segundo a lição, o que é inspirado?", "o": ["Cada palavra exata, ditada por Deus", "Somente as palavras dos secretários", "Apenas os textos em hebraico", "O pensamento do profeta, não necessariamente cada palavra"], "c": 3, "ref": "Lição de segunda", "texto": "Em última análise, é o pensamento do profeta que é inspirado, não necessariamente cada palavra específica escolhida para expressar esse pensamento."}, {"p": "Quem ajudou você a poder ler a Bíblia na sua língua?", "o": ["Os tradutores", "Quem me deu minha primeira Bíblia", "Minha família ou igreja", "Nunca tinha pensado nisso"], "reflexao": true}], [{"p": "Segundo Eclesiastes 12:9, 10, o que Salomão fez com os provérbios?", "o": ["Escreveu todos sozinho, sem pesquisar", "Considerou, examinou e colecionou muitos provérbios", "Copiou tudo de um único livro", "Recebeu todos de um anjo"], "c": 1, "ref": "Eclesiastes 12:9, 10, citado na lição", "texto": "Ele considerou, examinou e colecionou muitos provérbios. Procurou também encontrar as palavras certas, e o que ele escreveu era reto e verdadeiro."}, {"p": "A quem é atribuída a descrição da mulher virtuosa em Provérbios 31?", "o": ["A Salomão", "A Davi", "À mãe do rei Lemuel", "A Rute"], "c": 2, "ref": "Lição de terça, sobre Provérbios 31:1", "texto": "A famosa descrição da mulher virtuosa em Provérbios 31 não é atribuída a Salomão, e sim à mãe do rei Lemuel."}, {"p": "Segundo Lucas 1:1-4, como Lucas escreveu o seu evangelho?", "o": ["Pesquisou com cuidado e reuniu relatos de testemunhas oculares", "Recebeu tudo num sonho", "Copiou o evangelho de João", "Escreveu só o que lembrava"], "c": 0, "ref": "Lição de terça, sobre Lucas 1:1-4", "texto": "Lucas é exemplo de um autor que pesquisou com cuidado e reuniu relatos de diferentes testemunhas oculares ao escrever seu evangelho."}, {"p": "Que obra fora da Bíblia Judas parece ter citado?", "o": ["Os Salmos de Salomão", "O livro de Jasar", "As cartas de Clemente", "O Primeiro Livro de Enoque"], "c": 3, "ref": "Lição de terça", "texto": "Judas parece ter citado o chamado “Primeiro Livro de Enoque”, uma obra judaica não canônica escrita no período entre o Antigo e o Novo Testamento."}, {"p": "Por que é importante lembrar que o Espírito Santo também guiou os autores no uso de outras fontes?", "o": ["Mostra que Deus trabalha junto com o esforço humano", "Ajuda a entender melhor a Bíblia", "Fortalece minha confiança nela", "Ainda estou pensando nisso"], "reflexao": true}], [{"p": "Segundo a lição, como a Bíblia nasceu?", "o": ["Caiu pronta do céu", "Foi escrita por anjos em linguagem celestial", "Do encontro entre o Espírito Santo e seres humanos imperfeitos", "Foi escrita por uma só pessoa"], "c": 2, "ref": "Lição de quarta", "texto": "A Bíblia não caiu do Céu como um documento produzido por anjos em linguagem celestial. Ela nasceu do encontro entre o Espírito Santo e seres humanos imperfeitos."}, {"p": "Que texto fala de um tesouro guardado em vasos de barro?", "o": ["2 Coríntios 4:7", "João 1:14", "Romanos 15:4", "Apocalipse 1:3"], "c": 0, "ref": "2 Coríntios 4:7, citado na lição", "texto": "Temos, porém, esse tesouro em vasos de barro, para mostrar que o poder que a tudo excede provém de Deus, não de nós."}, {"p": "Com o que a lição compara a Bíblia, uma Palavra ao mesmo tempo divina e humana?", "o": ["Com a criação em seis dias", "Com a torre de Babel", "Com o dilúvio", "Com a encarnação: o Verbo que Se fez carne"], "c": 3, "ref": "Lição de quarta, sobre João 1:14", "texto": "Foi a mesma lógica da encarnação: o Verbo que Se fez carne é o mesmo princípio que percorre toda a Escritura."}, {"p": "Segundo Apocalipse 1:3, quem é bem-aventurado?", "o": ["Quem só ouve falar da profecia", "Quem lê, ouve e guarda as palavras da profecia", "Quem decora o livro inteiro", "Quem prega todos os dias"], "c": 1, "ref": "Apocalipse 1:3", "texto": "Bem-aventurados aqueles que leem e aqueles que ouvem as palavras da profecia e guardam as coisas nela escritas, pois o tempo está próximo."}, {"p": "Na sua rede semântica, que palavra você ligaria a “inspiração”?", "o": ["Espírito Santo", "Profetas", "Confiança", "Verdade"], "reflexao": true}], [{"p": "Segundo a lição, como o Senhor fala por meio dos profetas?", "o": ["Eles usam linguagem humana imperfeita para comunicar os pensamentos perfeitos de Deus", "Deus controla cada movimento das mãos deles", "Eles falam numa língua celestial", "Somente por meio de anjos"], "c": 0, "ref": "Lição de quinta", "texto": "O Senhor fala por meio dos profetas enquanto eles usam linguagem humana imperfeita para comunicar os pensamentos perfeitos de Deus."}, {"p": "Com quem a lição compara as duas dimensões da Bíblia, divina e humana?", "o": ["Com o templo e o tabernáculo", "Com a lei e a graça", "Com Jesus, que tinha natureza divina e humana", "Com o céu e a terra"], "c": 2, "ref": "Testemunhos Para a Igreja, v. 5, p. 634, citado na lição", "texto": "A união do divino com o humano, manifestada em Cristo, existe também na Bíblia."}, {"p": "Qual destes mensageiros a lição cita como exemplo de quem não ficou livre de falhas pessoais?", "o": ["Enoque", "Jonas", "Daniel", "José"], "c": 1, "ref": "Lição de quinta", "texto": "Os mensageiros de Deus não foram preservados de modo sobrenatural de falhas em sua vida pessoal (veja, por exemplo, Moisés, Elias, Davi, Jonas e Pedro)."}, {"p": "O que fazer quando há coisas na Bíblia que não entendemos completamente?", "o": ["Ignorar esses textos", "Parar de ler a Bíblia", "Concluir que a Bíblia está errada", "Confiar no Senhor e seguir a Palavra à medida que a compreendemos"], "c": 3, "ref": "Lição de quinta", "texto": "Devemos nos submeter à Palavra de Deus à medida que a compreendemos e confiar no Senhor, ainda que haja coisas que não entendamos completamente."}, {"p": "Por que você acha que Deus escolheu usar pessoas falíveis como mensageiros?", "o": ["Para mostrar que o poder vem d’Ele", "Porque elas nos entendem melhor", "Para mostrar que Ele pode usar qualquer um", "Por tudo isso"], "reflexao": true}], [{"p": "Por que Ellen White achava que não conseguiria escrever?", "o": ["Não sabia ler", "Estava debilitada por causa de um acidente", "Não tinha papel", "Estava sempre viajando"], "c": 1, "ref": "General Conference Bulletin, 31 de maio de 1909", "texto": "Por causa do acidente que quase me custou a vida, eu havia ficado debilitada e incapaz de escrever."}, {"p": "O que o anjo disse a Ellen White naquela noite?", "o": ["“Você deve escrever as coisas que lhe transmito.”", "“Descanse até ficar curada.”", "“Peça a alguém para escrever por você.”", "“Viaje e pregue em outra cidade.”"], "c": 0, "ref": "General Conference Bulletin, 31 de maio de 1909", "texto": "Certa noite, o anjo do Senhor veio até meu leito e me disse: ‘Você deve escrever as coisas que lhe transmito.’"}, {"p": "Qual era o papel dos secretários de Ellen White?", "o": ["Escrever os livros no lugar dela", "Inventar novas mensagens", "Traduzir tudo para outra língua", "Ajudar a expressar a mensagem com clareza, sem acrescentar pensamentos próprios"], "c": 3, "ref": "Lição de sexta", "texto": "Seus secretários auxiliavam a autora a expressar com clareza sua mensagem, sem acrescentar pensamentos próprios."}, {"p": "Para Ellen White, todas as palavras dela vinham diretamente do Céu?", "o": ["Sim, cada palavra era inspirada", "Não, às vezes ela precisava dizer coisas comuns", "Só as cartas eram inspiradas", "Ela nunca falou sobre isso"], "c": 1, "ref": "Mensagens Escolhidas, v. 3, p. 48, citado na lição", "texto": "Há momentos, porém, em que devem ser declaradas coisas comuns."}, {"p": "Comparando o tempo no celular com o tempo na Bíblia, como está o seu?", "o": ["Muito mais no celular", "Um pouco mais no celular", "Mais ou menos igual", "Mais com a Bíblia"], "reflexao": true}]]}, {"n": 7, "titulo": "Preste atenção!", "datas": "7 a 13 de novembro", "inicio": "2026-11-07", "temas": ["Introdução: Preste atenção!", "Irados com a mensagem de Deus", "Destruindo a mensagem", "História de resistência", "Momento hipertexto", "Para nossa advertência", "Sonhos e visões"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Jeremias 36:20-32", "Jeremias 1:17-19", "2 Crônicas 36:11-21", "1 Coríntios 10:6-13"], "c": 0, "ref": "Jeremias 36:32", "texto": "Tomou, pois, Jeremias outro rolo e o deu a Baruque, filho de Nerias, o escrivão, o qual escreveu nele, ditado por Jeremias, todas as palavras do livro que Jeoaquim, rei de Judá, queimara; e ainda se lhes acrescentaram muitas palavras semelhantes."}, {"p": "Na tirinha, o que a voz do celular diz para o jovem?", "o": ["Leia a Bíblia todos os dias", "Siga seu coração, sua verdade é o que importa", "Ouça sempre os mais velhos", "Não confie em ninguém"], "c": 1, "ref": "Tirinha da Lição 7", "img": true}, {"p": "Na tirinha, o que a Bíblia pergunta ao jovem?", "o": ["Por que você me esqueceu?", "Posso falar também?", "Você vai me ler hoje?", "Cadê a sua fé?"], "c": 1, "ref": "Tirinha da Lição 7", "img": true}, {"p": "No último quadrinho, o que “acaba” para quem só quer seguir a própria luz?", "o": ["A paciência", "A luz do quarto", "A bateria da própria verdade", "O tempo de leitura"], "c": 2, "ref": "Tirinha da Lição 7", "img": true}, {"p": "O título da lição é “Preste atenção!”. Em que momento você costuma prestar mais atenção à voz de Deus?", "o": ["De manhã, ao acordar", "Durante o dia", "À noite, antes de dormir", "Ainda estou procurando esse momento"], "reflexao": true}], [{"p": "Quando os espias voltaram de Canaã falando de gigantes, o que o povo quis fazer?", "o": ["Atacar a cidade na mesma hora", "Voltar ao Egito", "Ficar no deserto para sempre", "Construir uma nova cidade"], "c": 1, "ref": "Números 14:4", "texto": "E diziam uns aos outros: Levantemos um capitão e voltemos para o Egito."}, {"p": "Enquanto a multidão se rebelava, quem permaneceu fiel e pediu que o povo confiasse no Senhor?", "o": ["Moisés e Arão", "Baruque e Jeremias", "Josué e Calebe", "Davi e Jônatas"], "c": 2, "ref": "Números 14:9", "texto": "Não sejam rebeldes contra o Senhor."}, {"p": "Segundo Jeremias 1:17, o que Deus mandou o profeta fazer?", "o": ["Fugir para o Egito", "Ficar em silêncio até o exílio", "Falar só com os sacerdotes", "Falar tudo o que Ele mandasse, sem medo da oposição"], "c": 3, "ref": "Lição de domingo, sobre Jeremias 1:17", "texto": "Recebeu de Deus a ordem de falar tudo o que lhe fosse mandado, sem medo da oposição."}, {"p": "Segundo Hebreus 11:32-38, o que aconteceu com muitos profetas?", "o": ["Foram rejeitados, perseguidos e até mortos", "Ficaram ricos e famosos", "Foram todos coroados reis", "Viveram isolados, sem falar com ninguém"], "c": 0, "ref": "Lição de domingo, sobre Hebreus 11:32-38", "texto": "Os profetas bíblicos frequentemente foram chamados a transmitir mensagens difíceis que o povo não queria ouvir. Por isso, muitos foram rejeitados, perseguidos e até mortos."}, {"p": "Quando a verdade de Deus contraria o que eu sinto, eu geralmente…", "o": ["Paro e penso melhor", "Converso com alguém de confiança", "Tento ignorar e seguir em frente", "Ainda estou aprendendo a lidar com isso"], "reflexao": true}], [{"p": "Quem escreveu a mensagem de Jeremias e a leu em voz alta em Jerusalém?", "o": ["Zedequias", "Baruque", "Josias", "Calebe"], "c": 1, "ref": "Jeremias 36:4", "texto": "Então, Jeremias chamou a Baruque, filho de Nerias; escreveu Baruque no rolo, segundo o que ditou Jeremias, todas as palavras que o Senhor lhe havia falado."}, {"p": "O que o rei Jeoaquim fez com o rolo da mensagem?", "o": ["Guardou no templo", "Mandou fazer uma cópia", "Cortou em pedaços e jogou no fogo", "Leu até o fim e se arrependeu"], "c": 2, "ref": "Jeremias 36:23", "texto": "Tendo Jeudi lido três ou quatro colunas, cortou-as o rei com um canivete de escrivão e lançou-as no fogo que havia no braseiro, até que todo o rolo se consumiu no fogo."}, {"p": "O que Deus mandou Jeremias comprar, como sinal de que o povo voltaria para a terra?", "o": ["Uma casa", "Um campo", "Um rolo novo", "Um jumento"], "c": 1, "ref": "Jeremias 32:15", "texto": "Porque assim diz o Senhor dos Exércitos, o Deus de Israel: Ainda se comprarão casas, campos e vinhas nesta terra."}, {"p": "O que as autoridades da corte aconselharam Baruque e Jeremias a fazer?", "o": ["Fugir para o Egito", "Pedir perdão ao rei", "Se esconderem", "Queimar o rolo"], "c": 2, "ref": "Lição de segunda, sobre Jeremias 36:19", "texto": "Preocupados com sua segurança, aconselharam Baruque e Jeremias a se esconderem."}, {"p": "Se Jeoaquim tivesse aceitado a mensagem de Jeremias, o que você acha que teria mudado?", "o": ["Jerusalém poderia ter sido poupada", "O povo teria voltado para Deus", "Ele seria lembrado como um rei fiel", "Tudo isso"], "reflexao": true}], [{"p": "Com quantos anos Zedequias assumiu o trono de Judá?", "o": ["12", "18", "21", "30"], "c": 2, "ref": "2 Crônicas 36:11", "texto": "Tinha Zedequias a idade de vinte e um anos quando começou a reinar e reinou onze anos em Jerusalém."}, {"p": "O que a longa rejeição aos profetas acabou causando a Judá?", "o": ["A volta ao Egito", "O exílio em Babilônia", "A divisão do reino", "A construção de um novo templo"], "c": 1, "ref": "2 Crônicas 36:16, 20", "texto": "Eles, porém, zombaram dos mensageiros de Deus, desprezaram as suas palavras e escarneceram dos seus profetas […]. Os que escaparam da espada, a esses levou ele para a Babilônia."}, {"p": "Que rei babilônico já havia saqueado Jerusalém quando Zedequias assumiu o trono?", "o": ["Ciro", "Dario", "Faraó Neco", "Nabucodonosor"], "c": 3, "ref": "Lição de terça", "texto": "O Império Babilônico, liderado por Nabucodonosor, já havia saqueado Jerusalém e levado alguns prisioneiros para a Babilônia quando Zedequias assumiu o trono de Judá."}, {"p": "Segundo 2 Pedro 3:9, o que Deus deseja?", "o": ["Que só os fiéis sejam ouvidos", "Que ninguém pereça, mas que todos cheguem ao arrependimento", "Que os profetas se calem", "Que cada um siga a própria verdade"], "c": 1, "ref": "2 Pedro 3:9", "texto": "Que ninguém pereça, mas que todos cheguem ao arrependimento."}, {"p": "Por que você acha que os profetas enfrentavam tanta oposição?", "o": ["Porque chamavam as pessoas à mudança", "Porque diziam o que ninguém queria ouvir", "Porque confrontavam o orgulho", "Por tudo isso"], "reflexao": true}], [{"p": "Segundo Paulo, por que as histórias de Israel no deserto foram escritas?", "o": ["Como advertência para nós", "Só como registro histórico", "Para mostrar que Israel era pior que os outros povos", "Para servir de entretenimento"], "c": 0, "ref": "1 Coríntios 10:11", "texto": "Estas coisas aconteceram com eles para servir de exemplo e foram escritas como advertência a nós, para quem o fim dos tempos tem chegado."}, {"p": "Segundo a lição, qual destas é uma forma sutil de rejeitar a mensagem de Deus?", "o": ["Pedir conselho a alguém maduro", "Orar antes de decidir", "Relativizar a verdade", "Estudar a lição todos os dias"], "c": 2, "ref": "Lição de quarta, Momento hipertexto", "texto": "Podemos rejeitar Suas mensagens de maneiras mais sutis: ignorando conselhos bíblicos, relativizando a verdade ou aceitando apenas aquilo que nos agrada."}, {"p": "Qual destes textos a lição usa para mostrar Jeremias como um profeta marcado pela tristeza?", "o": ["Jeremias 9:1", "Jeremias 26:2", "Jeremias 38:4", "1 Coríntios 10:13"], "c": 0, "ref": "Jeremias 9:1", "texto": "Prouvera a Deus a minha cabeça se tornasse em águas, e os meus olhos, em fonte de lágrimas! Então, choraria de dia e de noite os mortos da filha do meu povo."}, {"p": "Segundo a lição, o que Deus promete em 1 Coríntios 10:13?", "o": ["Uma vida sem dificuldades", "Que nunca seremos tentados", "Força para vencer as tentações e permanecer fiéis", "Riqueza para os fiéis"], "c": 2, "ref": "Lição de quarta, sobre 1 Coríntios 10:12, 13", "texto": "A boa notícia é que Deus também promete força para vencermos as tentações e permanecermos fiéis."}, {"p": "Na sua rede semântica, que palavra você ligaria a “advertência”?", "o": ["Cuidado", "Amor", "Escolha", "Consequência"], "reflexao": true}], [{"p": "Complete: “Aquele que considera estar de pé, cuide-se para que…”", "o": ["não se canse", "não caia", "não se esqueça", "não se perca"], "c": 1, "ref": "1 Coríntios 10:12", "texto": "Assim, aquele que considera estar de pé, cuide-se para que não caia!"}, {"p": "Segundo Isaías 40:8, citado na lição, as palavras de Deus…", "o": ["mudam com o tempo", "valiam só para Israel", "permanecem para sempre", "servem apenas para o passado"], "c": 2, "ref": "Isaías 40:8", "texto": "Seca-se a erva, e cai a sua flor, mas a palavra de nosso Deus permanece eternamente."}, {"p": "Segundo a lição, o que acontece se estivermos dispostos a ouvir, aprender e obedecer?", "o": ["Estaremos seguros e seremos bem-sucedidos", "Nunca teremos problemas", "Seremos famosos", "Não precisaremos mais estudar"], "c": 0, "ref": "Lição de quinta, sobre 2 Crônicas 20:20", "texto": "Se estivermos dispostos a ouvir, aprender e obedecer, estaremos seguros e seremos bem-sucedidos."}, {"p": "Segundo a lição, estamos condenados a repetir os erros das gerações anteriores?", "o": ["Sim, é inevitável", "Depende da família em que nascemos", "Não, desde que levemos a sério as advertências da Bíblia", "Depende da sorte"], "c": 2, "ref": "Lição de quinta", "texto": "Deus nos diz que não estamos condenados a repetir os erros das gerações anteriores, desde que levemos a sério as advertências da Bíblia e as mensagens proféticas que Ele nos envia."}, {"p": "Que lição dos relatos de rebelião você mais quer levar para a sua vida?", "o": ["Confiar mais em Deus", "Ser mais humilde", "Ouvir bons conselhos", "Obedecer mesmo quando é difícil"], "reflexao": true}], [{"p": "Segundo a descrição de Tiago White, como Ellen White ficava durante uma visão?", "o": ["Dormia profundamente", "Falava sem parar", "Não respirava e mantinha os olhos abertos", "Ficava de olhos fechados e deitada"], "c": 2, "ref": "Lição de sexta, citando James White, Life Incidents", "texto": "Ela ficava totalmente inconsciente de tudo o que se passava ao redor; não respirava […] e seus olhos permaneciam abertos."}, {"p": "Como Ellen White pediu que fossem tratadas as pessoas que duvidavam do seu dom profético?", "o": ["Com paciência e amor fraternal", "Com distância", "Com debates firmes", "Afastando-as da igreja"], "c": 0, "ref": "Testemunhos Para a Igreja, v. 1, p. 297", "texto": "Paciência e amor fraternal até que tomem posição e tenham opinião definida contra ou a favor."}, {"p": "Em que ano Tiago White descreveu o estado de Ellen White durante uma visão?", "o": ["1844", "1868", "1888", "1915"], "c": 1, "ref": "Lição de sexta", "texto": "Em 1868, Tiago White, marido de Ellen, descreveu em detalhes o estado dela durante uma visão."}, {"p": "Para Ellen White, onde estava a verdadeira confirmação do seu dom profético?", "o": ["Nos fenômenos durante as visões", "Na aprovação das pessoas", "No número de visões que teve", "Nas mensagens que Deus lhe entregara"], "c": 3, "ref": "Lição de sexta", nstruísse um templo", "Que fosse sacerdote", "Que voltasse para a Galileia"], "c": 0, "ref": "Lucas 24:21, citado na lição", "texto": "Eles aguardavam um Messias político que libertasse Israel de Roma. O problema era uma compreensão parcial das profecias."}, {"p": "Que pergunta Jesus fez ao intérprete da lei em Lucas 10:26?", "o": ["“Você tem fé?”", "“Como você interpreta?”", "“Quem é o seu próximo?”", "“Você leu Moisés?”"], "c": 1, "ref": "Lucas 10:26, citado na lição", "texto": "Jesus perguntou: “Como você interpreta?”, mostrando que a interpretação importa."}, {"p": "O que pode gerar distorções na interpretação da Bíblia?", "o": ["Ler com oração", "Comparar textos", "Usar textos isolados, fora do contexto", "Estudar com outros"], "c": 2, "ref": "Lição de domingo", "texto": "Textos isolados podem gerar distorções. Muitas heresias surgem exatamente desse hábito de retirar textos de seu cenário original."}, {"p": "Por onde a lição recomenda começar ao estudar a Bíblia?", "o": ["Pelos textos mais difíceis", "Pelo Apocalipse", "Pelo que diz a internet", "Pelo que é claro, deixando a Bíblia iluminar o difícil"], "c": 3, "ref": "Lição de domingo", "texto": "Devemos buscar a “sã doutrina”, começando pelo que é claro e permitindo que a própria Bíblia ilumine os pontos difíceis."}, {"p": "Qual texto da Bíblia você gostaria de entender melhor?", "o": ["Algum de Daniel", "Algum do Apocalipse", "Alguma parábola", "Algum dos profetas"], "reflexao": true}], [{"p": "O que o oficial etíope estava lendo na viagem de volta?", "o": ["Os Salmos", "O livro de Isaías", "O livro de Daniel", "As cartas de Paulo"], "c": 1, "ref": "Atos 8:27, 28, citado na lição", "texto": "Ele possuía um rolo do livro de Isaías e o lia com grande interesse durante a viagem de volta."}, {"p": "Quem Deus enviou para ajudar o etíope a entender a profecia?", "o": ["Pedro", "Filipe", "Paulo", "Um sacerdote"], "c": 1, "ref": "Lição de segunda", "texto": "Em resposta à oração daquele homem, um anjo enviou Filipe ntes", "Pergunto a alguém", "Comparo com a Bíblia", "Às vezes nem confiro"], "reflexao": true}], [{"p": "Como a lição sugere testar se um diamante é verdadeiro?", "o": ["Pesando numa balança", "Aquecendo e mergulhando em água fria", "Batendo com um martelo", "Olhando contra o sol"], "c": 1, "ref": "Lição de domingo", "texto": "Uma das maneiras é aquecê-lo e, em seguida, mergulhá-lo em água fria. Um diamante verdadeiro não seria danificado."}, {"p": "O que a Bíblia pede que façamos com quem diz ter o dom de profecia?", "o": ["Aceitar sem pensar", "Pôr à prova com testes bíblicos", "Ignorar sempre", "Seguir se fizer milagres"], "c": 1, "ref": "1 Tessalonicenses 5:19-21, citado na lição", "texto": "Essa alegação precisa ser posta à prova por meio de diversos testes bíblicos."}, {"p": "Fenômenos sobrenaturais provam, sozinhos, que alguém é de Deus?", "o": ["Sim, sempre", "Sim, se forem grandes", "Não, porque Satanás também produz manifestações", "Só se acontecerem na igreja"], "c": 2, "ref": "Deuteronômio 13:1-3, citado na lição", "texto": "Embora fenômenos visíveis revelem um poder sobrenatural, isso não significa, por si só, que a pessoa seja inspirada por Deus."}, {"p": "Qual é o padrão final para avaliar qualquer alegação de inspiração?", "o": ["A opinião da maioria", "Os sentimentos", "Os sinais visíveis", "A Bíblia"], "c": 3, "ref": "Lição de domingo", "texto": "A Bíblia permanece como o padrão final para avaliar qualquer alegação de inspiração divina."}, {"p": "O que mais você valoriza como um “diamante” na sua vida espiritual?", "o": ["A Bíblia", "A oração", "A igreja", "Minha família"], "reflexao": true}], [{"p": "Que critério Jesus deu para reconhecer os falsos profetas?", "o": ["Pelos seus frutos", "Pelas suas roupas", "Pela sua idade", "Pelos seus milagres"], "c": 0, "ref": "Mateus 7:20, citado na lição", "texto": "Assim, pois, pelos seus frutos vocês os conhecerão."}, {"p": "Ser profeta torna alguém sem pecado e infalível?", "o": ["Sim, sempre", "Não, só Deus é perfeito", "Sim, depois do chamado", "Só se for do Antigo Testamento"], "c": 1, "ref": "Lição de segunda", "texto": "Ser profeta não torna ninguém isento de pecado nem infalível. Só Deus é perfeito."}, {"p": "Por quantos anos a reconstrução do templo ficou parada antes de Ageu?", "o": ["7 anos", "12 anos", "19 anos", "40 anos"], "c": 2, "ref": "Ageu 1:12, citado na lição", "texto": "A fidelidade de Ageu encorajou Judá a retomar a reconstrução do segundo templo, interrompida por 19 anos."}, {"p": "A quantos reis de Judá o ministério de Isaías serviu?", "o": ["Um", "Dois", "Três", "Quatro"], "c": 3, "ref": "Isaías 1:1, citado na lição", "texto": "O ministério de Isaías serviu a quatro reis de Judá, guiando-os em meio a um período turbulento."}, {"p": "Que fruto você gostaria que as pessoas vissem na sua vida?", "o": ["Bondade", "Alegria", "Paciência", "Fidelidade"], "reflexao": true}], [{"p": "Segundo Deuteronômio 18:22, o que mostra que uma palavra não veio do Senhor?", "o": ["Quando ela não se cumpre", "Quando é difícil de ouvir", "Quando é dita a um rei", "Quando é escrita"], "c": 0, "ref": "Deuteronômio 18:22, citado na lição", "texto": "Quando esse profeta falar em nome do Senhor, e a palavra dele não se cumprir, esta é uma palavra que o Senhor não falou."}, {"p": "O que Jonas anunciou a Nínive?", "o": ["Que ela seria a capital do mundo", "Que em quarenta dias seria destruída", "Que um rei nasceria lá", "Que choveria por sete dias"], "c": 1, "ref": "Jonas 3:4, citado na lição", "texto": "Daqui a quarenta dias, Nínive será destruída."}, {"p": "Por que Nínive não foi destruída naquele momento?", "o": ["Jonas errou a data", "Deus esqueceu", "O povo se arrependeu", "Um rei estrangeiro a protegeu"], "c": 2, "ref": "Jonas 3:10, citado na lição", "texto": "Os moradores de Nínive deram crédito à mensagem de Jonas e mudaram de rumo; por isso, Deus não os destruiu naquele momento."}, {"p": "Do que dependem as profecias condicionais?", "o": ["Da sorte", "Do tempo", "Do isto veio em carne”, essa pessoa “não procede de Deus”."}, {"p": "O que os verdadeiros profetas ensinam sobre as tentações de Jesus?", "o": ["Que Ele nunca foi tentado", "Que foi tentado, mas nunca pecou", "Que pecou uma vez", "Que não sabemos"], "c": 1, "ref": "Hebreus 4:15, citado na lição", "texto": "Eles ensinam que Jesus foi tentado, mas nunca pecou."}, {"p": "Quem precisa ser o centro dos ensinos de um profeta?", "o": ["O próprio profeta", "Os anjos", "Jesus", "A igreja"], "c": 2, "ref": "Lição de quinta", "texto": "Jesus precisa ser o centro dos ensinos do profeta."}, {"p": "Profetas que exaltam Jesus procuram…", "o": ["Formar seu próprio grupo de seguidores", "Ficar famosos", "Ganhar dinheiro", "Servir, sem promover a si mesmos"], "c": 3, "ref": "Atos 4:12, citado na lição", "texto": "Profetas que exaltam a Jesus não procuram formar seu próprio grupo de seguidores nem promover a si mesmos. Eles estão prontos para servir."}, {"p": "Por que é tão importante para você que Jesus seja Deus e homem?", "o": ["Ele me entende", "Ele pode me salvar", "Ele venceu por mim", "Por tudo isso"], "reflexao": true}], [{"p": "Quando Ellen White teve sua primeira visão?", "o": ["Em 1827", "Em dezembro de 1844", "Em 1863", "Em 1909"], "c": 1, "ref": "Lição de sexta", "texto": "Depois de sua primeira visão, em dezembro de 1844, alguns começaram a questionar suas reivindicações proféticas."}, {"p": "Que textos mostram que o dom de profecia continuaria até o fim?", "o": ["Joel 2:28, 29 e Apocalipse 12:17", "Gênesis 1 e 2", "Salmo 23 e João 3:16", "Rute 1 e Ester 4"], "c": 0, "ref": "Lição de sexta", "texto": "Com base em textos como Joel 2:28 e 29 e Apocalipse 12:17, concluíram que o dom profético se manifestaria “nos últimos dias”."}, {"p": "Que encontros, no fim da década de 1840, foram unificados com ajuda das orientações de Ellen White?", "o": ["Os Congressos de Jovens", "As Semanas de Oração", "As Conferências Sabáticas", "Os Acampamentos"], "c": 2, "ref": "Lição de sexta", "t s na fé", "Servir junto", "Crescer espiritualmente", "Cumprir a missão"], "reflexao": true}], [{"p": "Segundo a lição, quanto maior a responsabilidade da mensagem…", "o": ["menos importa quem fala", "maior a necessidade de confiança em quem a comunica", "mais rápido deve ser dita", "menos pessoas devem ouvir"], "c": 1, "ref": "Lição de quarta", "texto": "Quanto maior a responsabilidade da mensagem, maior também a necessidade de confiança em quem a comunica."}, {"p": "Que livro, que não chegou até nós, Josué 10:13 menciona?", "o": ["O livro dos Justos", "O livro de Enoque", "O livro de Natã", "O livro dos Reis"], "c": 0, "ref": "Josué 10:13", "texto": "Não está isto escrito no Livro dos Justos?"}, {"p": "Que profetas tinham registros citados em 1 Crônicas 29:29?", "o": ["Isaías e Jeremias", "Elias e Eliseu", "Samuel, Natã e Gade", "Daniel e Ezequiel"], "c": 2, "ref": "1 Crônicas 29:29", "texto": "Os atos do rei Davi estão escritos nas crônicas de Samuel, nas crônicas do profeta Natã e nas crônicas de Gade."}, {"p": "Segundo Lucas 7:28, quem Jesus disse ser o maior entre os nascidos de mulher?", "o": ["Moisés", "Elias", "Abraão", "João Batista"], "c": 3, "ref": "Lucas 7:28", "texto": "Entre os nascidos de mulher, ninguém é maior do que João."}, {"p": "Na sua rede semântica, que palavra você ligaria a “confiabilidade”?", "o": ["Verdade", "Fidelidade", "Coerência", "Caráter"], "reflexao": true}], [{"p": "Que pergunta os sacerdotes fizeram a Jesus em Mateus 21:23?", "o": ["Quem Lhe deu autoridade", "De onde Ele veio", "Quantos anos Ele tinha", "Onde Ele morava"], "c": 0, "ref": "Mateus 21:23-27, citado na lição", "texto": "Os sacerdotes exigiram saber quem Lhe havia dado autoridade para realizar aquele ministério."}, {"p": "Por que os ensinos de Jesus deixavam as pessoas maravilhadas?", "o": ["Porque falava alto", "Porque ensinava com autoridade", "Porque usava palavras difíceis", "Porque era rico"], "c": 1, "ref": "Mateus 7:29, citado na lição", "texto": "Seus ensinos d a", "texto": "Outro tema marcante em suas mensagens é nossa necessidade de Jesus, a única esperança de vida eterna, concedida pela graça."}, {"p": "O que o estudo desta semana fortaleceu em você?", "o": ["Confiança na Bíblia", "Confiança em Jesus", "Vontade de servir", "Respeito pelos profetas"], "reflexao": true}]]}, {"n": 11, "titulo": "Momentos decisivos", "datas": "5 a 11 de dezembro", "inicio": "2026-12-05", "temas": ["Introdução: Momentos decisivos", "Revelando Seus planos", "Na época dos juízes", "Dos reis ao exílio", "Momento hipertexto", "Um profeta para o tempo de espera", "A voz profética"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Êxodo 3 e 4", "Juízes 4 e 5", "1 Reis 18", "2 Reis 22"], "c": 1, "ref": "Juízes 4:4", "texto": "Débora, profetisa, mulher de Lapidote, julgava a Israel naquele tempo."}, {"p": "Na tirinha, do que zombam de Noé?", "o": ["Dizem que nunca choveu", "Dizem que ele é rico", "Dizem que é preguiçoso", "Dizem que é estrangeiro"], "c": 0, "ref": "Tirinha da Lição 11", "img": true}, {"p": "Como chamam Noé na tirinha?", "o": ["Mais um herói", "Mais um rei", "Mais um fanático", "Mais um sábio"], "c": 2, "ref": "Tirinha da Lição 11", "img": true}, {"p": "Que texto aparece no último quadrinho da tirinha?", "o": ["Gênesis 9:13", "Mateus 24:37", "Hebreus 11:7", "2 Crônicas 20:20"], "c": 3, "ref": "Tirinha da Lição 11, citando 2 Crônicas 20:20", "img": true}, {"p": "Você já foi zoado por causa da sua fé?", "o": ["Sim, e continuei firme", "Sim, e fiquei sem graça", "Ainda não", "Prefiro nem falar da minha fé"], "reflexao": true}], [{"p": "O que o arco-íris lembra, segundo a lição?", "o": ["Que vai chover", "A promessa de nunca mais destruir o mundo pelas águas", "O fim do mundo", "A criação dos animais"], "c": 1, "ref": "Gênesis 9:8-17, citado na lição", "texto": "Cada arco-íris carrega em si essa promessa – e, com ela, a esperança da redenção."}, {"p": "O que o dilúvio revela, segundo a lição?", "o": ["A depravação humana e r todas as batalhas", "Conduzir o povo a glorificar a Deus"], "c": 3, "ref": "Lição de segunda", "texto": "As principais figuras de Israel conduziram a comunidade a glorificar a Deus. Essa é a essência da verdadeira liderança espiritual."}, {"p": "Em que situação você precisa confiar mais em Deus agora?", "o": ["Estudos ou trabalho", "Família", "Amizades", "Futuro"], "reflexao": true}], [{"p": "Que mensagem Elias levou no reinado de Acabe?", "o": ["Haveria fartura", "Não haveria chuva", "O rei seria eterno", "Viria um exército"], "c": 1, "ref": "1 Reis 18:18, citado na lição", "texto": "Não haveria chuva porque os israelitas adoraram imagens de Baal."}, {"p": "O que levou o povo ao arrependimento no monte Carmelo?", "o": ["O fogo que desceu do céu e a mensagem de Elias", "Um terremoto", "Um anjo visível", "Uma inundação"], "c": 0, "ref": "1 Reis 18:38, 39, citado na lição", "texto": "O fogo que desceu do céu, unido à mensagem profética de Elias, impactou profundamente o povo e o levou ao arrependimento."}, {"p": "Para onde Judá foi levado cativo?", "o": ["Assíria", "Egito", "Babilônia", "Roma"], "c": 2, "ref": "2 Reis 24 e 25, citado na lição", "texto": "Israel foi levado cativo pela Assíria, e Judá foi deportado para a Babilônia."}, {"p": "Quais profetas Deus enviou para dar esperança no exílio?", "o": ["Elias e Eliseu", "Samuel e Natã", "Moisés e Arão", "Ezequiel e Daniel"], "c": 3, "ref": "Lição de terça", "texto": "Mesmo ao disciplinar Seu povo, Deus continuou a enviar profetas, como Ezequiel e Daniel, para lhes dar esperança."}, {"p": "Como permanecer fiel quando quase ninguém ao redor segue a Deus?", "o": ["Ter amigos na fé", "Estar perto de Deus todo dia", "Lembrar quem eu sou", "Tudo isso"], "reflexao": true}], [{"p": "Como a lição descreve a era em que vivemos?", "o": ["Era de pouca informação", "Era de excesso de informação e escassez de direção", "Era sem tecnologia", "Era de silêncio"], "c": 1, "ref": "Lição de quarta", "texto": "Vivemos em uma era marcada por excesso de informação e escassez de direção."}, {"p": "Nos momentos decisivos da história, o que Deus fez?", "o": ["Não permaneceu em silêncio", "Ficou calado", "Abandonou o povo", "Mandou só castigos"], "c": 0, "ref": "Lição de quarta", "texto": "Nos momentos mais decisivos da história, Deus não permaneceu em silêncio. Ele enviou profetas."}, {"p": "Segundo João 15:15, como Jesus chama os Seus seguidores?", "o": ["Servos", "Soldados", "Amigos", "Estranhos"], "c": 2, "ref": "João 15:15", "texto": "Já não vos chamo servos, porque o servo não sabe o que faz o seu senhor; mas tenho-vos chamado amigos."}, {"p": "Por que Deus revela Seus segredos, segundo a lição?", "o": ["Para mostrar poder", "Para assustar", "Para testar", "Por desejar um relacionamento próximo com Seus filhos"], "c": 3, "ref": "Lição de quarta", "texto": "Isso revela não apenas Seu cuidado, mas também Seu desejo de manter um relacionamento próximo com Seus filhos."}, {"p": "Na sua rede semântica, que palavra você ligaria a “instrução”?", "o": ["Direção", "Bíblia", "Obediência", "Sabedoria"], "reflexao": true}], [{"p": "Onde João estava quando escreveu o Apocalipse?", "o": ["Em Roma", "Na ilha de Patmos", "Em Jerusalém", "No Egito"], "c": 1, "ref": "Lição de quinta", "texto": "Enquanto estava exilado na ilha de Patmos, João escreveu sobre a promessa da volta de Jesus."}, {"p": "Como João se apresentou em Apocalipse 1:9?", "o": ["Irmão e companheiro na tribulação", "Rei dos profetas", "Mestre das igrejas", "Último dos apóstolos"], "c": 0, "ref": "Apocalipse 1:9, citado na lição", "texto": "João se identificou como “irmão e companheiro de vocês na tribulação, no reino e na perseverança em Jesus”."}, {"p": "A quantas igrejas João escreveu mensagens em Apocalipse 2 e 3?", "o": ["Três", "Cinco", "Sete", "Doze"], "c": 2, "ref": "Lição de quinta", "texto": "Além das mensagens de encorajamento e repreensão dirigidas às sete igrejas, essas revelações incluíam visões do juízo."}, {"p": "O que Apocalipse 19:10 chama de “testemunho de Jesus”?", "o": ["Um livro perdido", "Um templo", "Uma oração", "O testemunho que Ele deu de Si mesmo por meio dos profetas"], "c": 3, "ref": "Lição de quinta", "texto": "Também precisamos guardar o “testemunho de Jesus” – o testemunho que Ele deu a respeito de Si mesmo por meio dos profetas."}, {"p": "Como você pode testemunhar de Jesus enquanto espera Sua volta?", "o": ["Contando o que Ele fez por mim", "Ajudando alguém", "Convidando um amigo", "Vivendo com coerência"], "reflexao": true}], [{"p": "Para que serviu a primeira visão de Ellen Harmon?", "o": ["Para anunciar uma nova data", "Para consolar os cristãos desapontados", "Para fundar uma escola", "Para condenar Miller"], "c": 1, "ref": "Lição de sexta", "texto": "Sua primeira visão tinha o propósito de consolá-los em meio ao desespero."}, {"p": "Quando a Igreja Adventista do Sétimo Dia foi fundada oficialmente?", "o": ["Em 21 de maio de 1863", "Em 22 de outubro de 1844", "Em 1888", "Em 1915"], "c": 0, "ref": "Lição de sexta", "texto": "Em 21 de maio de 1863, a Igreja Adventista do Sétimo Dia foi fundada oficialmente."}, {"p": "Que reforma começou com visões em 1863 e 1865?", "o": ["A reforma do templo", "A reforma da música", "A reforma de saúde", "A reforma do calendário"], "c": 2, "ref": "Lição de sexta", "texto": "Por meio de duas visões sobre saúde, em 1863 e 1865, esse quadro começou a mudar."}, {"p": "Em que área Ellen White teve papel fundamental entre as décadas de 1870 e 1890?", "o": ["Construção de templos", "Música sacra", "Política", "No sistema educacional adventista"], "c": 3, "ref": "Lição de sexta", "texto": "Entre as décadas de 1870 e 1890, Ellen White teve papel fundamental no desenvolvimento do sistema educacional adventista."}, {"p": "Qual “momento decisivo” você está vivendo agora?", "o": ["Escolhas de estudo ou carreira", "Decisão de batismo", "Relacionamentos", "Ainda não sei"], "reflexao": true}]]}, {"n": 12, "titulo": "Luz para o tempo do fim", "datas": "12 a 18 de dezembro", "inicio": "2026-12-12", "temas": ["Introdução: Luz para o tempo do fim", "Prazo de validade?", "Promessas para os últimos dias", "Manifestações atuais", "Momento hipertexto", "O testemunho de Jesus", "Compromisso com a missão"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["Atos 2:1-21", "Atos 8:26-40", "Joel 1", "Apocalipse 12"], "c": 0, "ref": "Atos 2:17", "texto": "E acontecerá nos últimos dias, diz o Senhor, que derramarei do meu Espírito sobre toda a carne."}, {"p": "Na tirinha, em que o primeiro jovem diz acreditar?", "o": ["Em nada", "Somente na Bíblia", "Somente na ciência", "Em sonhos"], "c": 1, "ref": "Tirinha da Lição 12", "img": true}, {"p": "Qual é a resposta do amigo na tirinha?", "o": ["Que profetas não existem", "Que a Bíblia está errada", "Que a própria Bíblia disse que haveria profetas no tempo do fim", "Que ele deve parar de ler"], "c": 2, "ref": "Tirinha da Lição 12", "img": true}, {"p": "Como o primeiro jovem reage no último quadrinho?", "o": ["Fica feliz", "Pede desculpas", "Vai embora correndo", "Diz que odeia quando o argumento vira contra ele"], "c": 3, "ref": "Tirinha da Lição 12", "img": true}, {"p": "Você se sentiria preparado para conversar sobre esse assunto com um amigo?", "o": ["Sim", "Mais ou menos", "Ainda não", "Quero estudar mais"], "reflexao": true}], [{"p": "Qual é o propósito dos dons espirituais, segundo Efésios 4:12, 13?", "o": ["Dar fama a quem os tem", "Fortalecer o corpo de Cristo e levar à maturidade", "Substituir a Bíblia", "Dividir a igreja"], "c": 1, "ref": "Lição de domingo", "texto": "Todos com o propósito de fortalecer o corpo de Cristo, promover a proclamação do evangelho e conduzir os crentes à plena maturidade espiritual."}, {"p": "Segundo Isaías 8:20, com o que a mensagem de um profeta precisa estar em harmonia?", "o": ["Com a mensagem dos profetas anteriores", "Com a opinião da maioria", "Com as notícias", "Com os sentimentos"], "c": 0, "ref": "Lição de domingo", "texto": "A "O que Apocalipse 12:17 mostra que Jesus faz com Sua igreja?", "o": ["Deixa sem direção", "Esconde Seus planos", "Envia só anjos", "Torna-a reconhecível pelo dom de profecia"], "c": 3, "ref": "Lição de quinta", "texto": "Apocalipse 12:17 mostra que Jesus torna Sua igreja reconhecível por meio do dom de profecia."}, {"p": "O que mais ajuda você a confiar no dom de profecia?", "o": ["A harmonia com a Bíblia", "Os bons frutos", "O foco em Jesus", "Ainda estou avaliando"], "reflexao": true}], [{"p": "Segundo Efésios 4, qual é a principal finalidade dos dons espirituais?", "o": ["Ganhar prêmios", "Capacitar os cristãos para a missão de Deus", "Formar grupos separados", "Substituir os pastores"], "c": 1, "ref": "Lição de sexta", "texto": "Paulo indica que a principal finalidade dos dons espirituais é capacitar os cristãos para cumprirem a missão de Deus."}, {"p": "Segundo Ellen White, o que os adventistas devem ser os primeiros a fazer?", "o": ["Exaltar Cristo perante o mundo", "Construir templos", "Escrever livros", "Viajar"], "c": 0, "ref": "Obreiros Evangélicos, p. 120, citado na lição", "texto": "Dentre todos os que se declaram cristãos, os adventistas do sétimo dia devem ser os primeiros a exaltar Cristo perante o mundo."}, {"p": "Segundo Evangelismo, p. 81, o que não pode haver na obra do Senhor?", "o": ["Música", "Jovens", "Ociosos", "Mulheres"], "c": 2, "ref": "Evangelismo, p. 81, citado na lição", "texto": "Não pode haver ociosos na obra do Senhor."}, {"p": "Onde Ellen White atuou como missionária?", "o": ["Na África e na Ásia", "No Brasil", "Só nos Estados Unidos", "Na Europa e na Austrália"], "c": 3, "ref": "Lição de sexta", "texto": "Ellen White atuou como missionária na Europa, na década de 1880, e na Austrália, na década de 1890."}, {"p": "Como você quer participar da missão nas próximas semanas?", "o": ["Convidar alguém para a igreja", "Ajudar num projeto", "Compartilhar nas redes", "Orar por alguém"], "reflexao": true}]]}, {"n": 13, "titulo": "Bênçãos da profecia", "datas": "19 a 25 de dezembro", "inicio": "2026-12-19", "temas": ["Introdução: Bênçãos da profecia", "A profecia reafirma a Bíblia", "Um povo seguro e bem-sucedido", "O detector da verdade", "Momento hipertexto", "A profecia exalta a Cristo", "Experimente de novo"], "dias": [[{"p": "Qual é o texto bíblico desta semana?", "o": ["2 Crônicas 20", "1 Reis 18", "Juízes 4", "Atos 2"], "c": 0, "ref": "2 Crônicas 20:20", "texto": "Crede no Senhor, vosso Deus, e estareis seguros; crede nos seus profetas e prosperareis."}, {"p": "Na tirinha, o que o rei Josafá diz que precisam?", "o": ["De mais soldados", "De um plano", "De comida", "De um navio"], "c": 1, "ref": "Tirinha da Lição 13", "img": true}, {"p": "O que o profeta Jaaziel responde na tirinha?", "o": ["“Fujam!”", "“Lutem sozinhos”", "“Confiem!”", "“Desistam”"], "c": 2, "ref": "Tirinha da Lição 13", "img": true}, {"p": "Que frase aparece no último quadrinho da tirinha?", "o": ["“Só isso?”", "“Precisamos de um plano”", "“Vamos voltar”", "“Creiam nos seus profetas e prosperareis!”"], "c": 3, "ref": "Tirinha da Lição 13", "img": true}, {"p": "Qual “batalha” você está entregando a Deus agora?", "o": ["Estudos ou trabalho", "Família", "Saúde", "Uma decisão importante"], "reflexao": true}], [{"p": "O que o verdadeiro dom de profecia sempre faz com a Bíblia?", "o": ["Substitui", "Reafirma e exalta", "Corrige", "Ignora"], "c": 1, "ref": "Lição de domingo", "texto": "Uma das bênçãos mais preciosas do dom de profecia é que ele sempre reafirma e exalta a Bíblia."}, {"p": "Quem Paulo advertiu sobre os falsos mestres em 2 Timóteo 3?", "o": ["O jovem Timóteo", "Tito", "Pedro", "Barnabé"], "c": 0, "ref": "2 Timóteo 3:13, citado na lição", "texto": "Ele advertiu o jovem Timóteo de que muitos cristãos seriam enganados por falsos mestres."}, {"p": "Na época de Jesus, quem geralmente tinha acesso aos rolos do Antigo Testamento?", "o": ["Todos, em casa", "Só as crianças", "Sacerdotes e rabinos", "Só os romanos"], "c": 2, "ref": "Lição de domingo", "texto": "Na época de Jesus, existiam apenas os rolos do Antigo Testamento e, geralmente, somente sacerdotes e rabinos tinham acesso a eles."}, {"p": "O que muitos falsos profetas atuais fazem com a confiança na Bíblia?", "o": ["Fortalecem", "Ensinam a amar", "Distribuem Bíblias", "Enfraquecem, de modo sutil"], "c": 3, "ref": "Lição de domingo", "texto": "Muitos líderes religiosos que afirmam ser profetas acabam, de modo sutil, enfraquecendo a confiança na Bíblia."}, {"p": "Em que formato você mais lê a Bíblia?", "o": ["Impressa", "No celular", "Em áudio", "Quase não leio, mas quero mudar"], "reflexao": true}], [{"p": "Quais povos marcharam contra Judá no tempo de Josafá?", "o": ["Egípcios e assírios", "Moabitas, amonitas e aliados", "Filisteus", "Romanos"], "c": 1, "ref": "2 Crônicas 20:1-12, citado na lição", "texto": "Grandes exércitos de moabitas, amonitas e seus aliados marcharam contra Judá."}, {"p": "O que Josafá fez ao perceber a ameaça?", "o": ["Convocou o povo a buscar o Senhor com jejum e oração", "Fugiu da cidade", "Pediu ajuda ao Egito", "Se rendeu"], "c": 0, "ref": "Lição de segunda", "texto": "O rei convocou a nação para se reunir e buscar o Senhor com jejum e oração."}, {"p": "Por meio de qual profeta Deus respondeu a Josafá?", "o": ["Elias", "Isaías", "Jaaziel", "Natã"], "c": 2, "ref": "2 Crônicas 20:14-17, citado na lição", "texto": "Deus respondeu por meio do profeta Jaaziel, que disse ao povo que não tivesse medo, pois aquela batalha era do Senhor."}, {"p": "Complete 2 Crônicas 20:20: “Creiam nos profetas do Senhor e vocês serão…”", "o": ["perdoados", "ricos", "famosos", "bem-sucedidos"], "c": 3, "ref": "2 Crônicas 20:20, citado na lição", "texto": "Creiam no Senhor, seu Deus, e vocês estarão seguros; creiam nos profetas do Senhor e vocês serão bem-sucedidos."}, {"p": "Diante de um problema grande, qual costuma ser a sua primeira atitude?", "o": ["Orar", "Pedir ajuda", "Ficar ansioso", "Tentar resolver sozinho"], "reflexao": true}], [{"p": "Quantas denominações cristãs alguns estudiosos estimam existir hoje?", "o": ["Cerca de 450", "Mais de 45 mil", "Cerca de 12", "Mais de 1 milhão"], "c": 1, "ref": "Lição de terça", "texto": "Alguns estudiosos estimam que hoje existam mais de 45 mil denominações cristãs no mundo."}, {"p": "Como Jesus respondeu às tentações de Satanás em Mateus 4?", "o": ["Com “está escrito”", "Com silêncio", "Com um milagre", "Chamando os anjos"], "c": 0, "ref": "Mateus 4:4, citado na lição", "texto": "Ele respondeu às investidas de Satanás com um claro “está escrito”."}, {"p": "Qual é um dos principais meios de Satanás para desviar as pessoas da verdade?", "o": ["A pobreza", "A doença", "A confusão", "O cansaço"], "c": 2, "ref": "Lição de terça", "texto": "Desde o início, a confusão tem sido um dos principais meios de Satanás para desviar os seres humanos da verdade divina."}, {"p": "O que Jesus prometeu aos receptivos em João 8:32?", "o": ["Riquezas", "Fama", "Vida fácil", "Que conheceriam a verdade"], "c": 3, "ref": "João 8:32, citado na lição", "texto": "Para aqueles que se mostram receptivos, Jesus prometeu que eles “conhecerão a verdade”."}, {"p": "Como você ou sua família conheceram a Igreja Adventista?", "o": ["Nasci numa família adventista", "Por um amigo", "Por um estudo bíblico ou evento", "Pela internet, TV ou rádio"], "reflexao": true}], [{"p": "Segundo a lição, Deus pede de nós uma fé cega?", "o": ["Sim, sempre", "Só às vezes", "Não, as evidências de Sua existência são contundentes", "Ninguém sabe"], "c": 2, "ref": "Lição de quarta", "texto": "Deus nunca nos pede uma fé cega. Pelo contrário, as evidências de Sua existência são contundentes."}, {"p": "Onde Pedro ouviu a voz vinda dos céus?", "o": ["No mar da Galileia", "No monte santo, com Jesus", "No templo", "Na prisão"], "c": 1, "ref": "2 Pedro 1:18, citado na lição", "texto": "Nós mesmos ouvimos essa voz vinda dos céus quando estávamos com Ele no monte santo."}, {"p": "Segundo 2 Pedro 1:19, o que é “ainda mais firme”?", "o": ["A palavra dos profetas", "Os sonhos", "A voz da maioria", "Os sentimentos"], "c": 0, "ref": "2 Pedro 1:19, citado na lição", "texto": "Assim, temos ainda mais firme a palavra dos profetas, e vocês farão bem se nela prestarem atenção."}, {"p": "Que texto de Provérbios fala do que acontece sem a orientação profética?", "o": ["Provérbios 3:5", "Provérbios 22:6", "Provérbios 31:10", "Provérbios 29:18"], "c": 3, "ref": "Provérbios 29:18", "texto": "Não havendo profecia, o povo se corrompe; mas o que guarda a lei, esse é feliz."}, {"p": "Na sua rede semântica, que palavra você ligaria a “segurança”?", "o": ["Confiança", "Bíblia", "Jesus", "Paz"], "reflexao": true}], [{"p": "Segundo Apocalipse 12:17, com quem o dragão ficou irado?", "o": ["Com os anjos", "Com a mulher, a igreja de Deus", "Com os reis", "Com os profetas falsos"], "c": 1, "ref": "Apocalipse 12:17, citado na lição", "texto": "O dragão ficou irado com a mulher e foi travar guerra com o restante da descendência dela."}, {"p": "Quem é o tema central da mensagem profética para o tempo do fim?", "o": ["Jesus", "Os anjos", "A igreja", "O profeta"], "c": 0, "ref": "Lição de quinta", "texto": "Jesus é o tema central dessa mensagem profética para o tempo do fim."}, {"p": "Segundo a lição, a fé que salva é apenas intelectual?", "o": ["Sim, é só saber", "Sim, é decorar textos", "Não, diz respeito ao coração, não apenas à mente", "Não, é só sentimento"], "c": 2, "ref": "Lição de quinta", "texto": "A questão da fé que salva não é meramente intelectual; é moral. Diz respeito ao coração, não apenas à mente."}, {"p": "Como João apresenta Jesus em João 1:1-5?", "o": ["Como um profeta comum", "Como um anjo", "Como um rei terreno", "Como o Verbo eterno que criou todas as coisas"], "c": 3, "ref": "Lição de quinta", "texto": "Em seu evangelho, João apresenta Jesus como o Verbo eterno que criou todas as coisas."}, {"p": "Que esperança você leva deste trimestre sobre os profetas?", "o": ["Deus continua falando", "Posso confiar na Bíblia", "Jesus vai voltar", "Deus quer me guiar"], "reflexao": true}], [{"p": "Qual era o slogan da empresa citado na lição?", "o": ["“Experimente de novo – pela primeira vez”", "“Café da manhã dos campeões”", "“Tem gosto de infância”", "“O melhor do dia”"], "c": 0, "ref": "Lição de sexta", "texto": "Ela os incentivava com o convite: “Experimente de novo – pela primeira vez.”"}, {"p": "Segundo a lição, o que é preciso para experimentar de fato as mensagens de Ellen White?", "o": ["Assistir a seminários", "Ler seus escritos pessoalmente", "Ouvir falar dela", "Ter os livros na estante"], "c": 1, "ref": "Lição de sexta", "texto": "Somente quem lê seus escritos, especialmente em seu devido contexto, pode apreciar plenamente o que Deus nos deu por meio dela."}, {"p": "Quem realizou a pesquisa citada na lição?", "o": ["Tiago White e Uriah Smith", "Guilherme Miller", "Roger Dudley e Des Cummings Jr.", "Levi Stockman"], "c": 2, "ref": "Lição de sexta", "texto": "Uma pesquisa realizada por Roger Dudley e Des Cummings Jr. revelou resultados muito significativos."}, {"p": "O que a pesquisa mostrou sobre quem lê Ellen White regularmente?", "o": ["Lê menos a Bíblia", "Vai menos à igreja", "Não muda nada", "Tem um relacionamento mais profundo com Cristo"], "c": 3, "ref": "Lição de sexta", "texto": "Aqueles que leem regularmente os escritos de Ellen White têm um relacionamento mais profundo e pessoal com Cristo."}, {"p": "Que livro de Ellen White você gostaria de ler no próximo trimestre?", "o": ["Caminho a Cristo", "O Desejado de Todas as Nações", "O Grande Conflito", "Patriarcas e Profetas"], "reflexao": true}]]}];
const FALAS = {"maria":["O anjo Gabriel me visitou em Nazaré. Deus vê até quem mora numa cidadezinha!", "Respondi ao anjo: “Aqui está a serva do Senhor.” Diga sim a Deus hoje também!", "Fui visitar minha parenta Isabel. Contar o que Deus fez enche a gente de alegria!", "Cantei que Deus derruba os orgulhosos e levanta os humildes. Leia e louve!", "Jesus nasceu e foi deitado numa manjedoura em Belém. Deus chega de forma simples.", "Eu guardava tudo no coração e pensava sobre isso. Guarde a lição de hoje no seu!", "Nas bodas de Caná, eu disse: “Façam tudo o que Ele mandar.” Esse conselho vale para hoje!"],"jose":["Sonhei com feixes de trigo se curvando diante do meu. Deus fala até nos sonhos!", "Meu pai me deu uma túnica especial, e meus irmãos ficaram com inveja. Cuidado com a inveja!", "Fui vendido pelos meus irmãos, mas Deus estava comigo no Egito. Ele está com você também!", "Na casa de Potifar, eu disse não à tentação. Ser fiel vale a pena!", "Na prisão, expliquei os sonhos do copeiro e do padeiro. Deus age até nos lugares difíceis!", "Deus avisou de sete anos de fartura e sete de fome. Guardamos trigo e salvamos muita gente!", "Perdoei meus irmãos: vocês planejaram o mal, mas Deus o transformou em bem."],"moises": ["Fui salvo das águas do Nilo num cestinho. Deus cuida de você desde sempre!", "Deus falou comigo numa sarça que queimava sem se consumir. Ele ainda fala pela Palavra!", "Eu achava que não sabia falar bem, e Deus me usou mesmo assim. Ele também usa você!", "Vi o mar se abrir! Leia hoje e descubra o que Deus pode abrir na sua vida.", "No deserto, Deus mandava maná todo dia. A lição também é alimento diário!", "Passei 40 dias no monte com Deus. Que tal começar com 10 minutos hoje?", "Meu rosto brilhava depois de falar com Deus. Estar com Ele transforma a gente!"], "miria": ["Eu vigiei meu irmãozinho Moisés no rio. Fique de olho na lição de hoje também!", "Tive coragem de falar com a filha do faraó. Deus dá coragem a quem confia n’Ele!", "Depois do mar aberto, toquei o tamborim e cantei. Estude e encontre motivos para louvar!", "Servi a Deus ao lado dos meus irmãos, Moisés e Arão. Estudar junto é ainda melhor!", "Também errei e precisei de perdão. Deus é paciente com quem volta para Ele.", "O povo esperou por mim para seguir viagem. Ninguém fica para trás nesta classe!", "Cante um louvor hoje antes de abrir a lição. Faz diferença!"], "debora": ["O povo vinha até a minha palmeira ouvir o conselho de Deus. Venha ouvir também!", "Baraque só iria à batalha se eu fosse junto. Às vezes, encorajar é só ir junto!", "Eu disse a Baraque: “Levante-se, o Senhor vai à sua frente!” Bora estudar?", "Fui juíza, profetisa e líder. Deus chama mulheres e jovens para coisas grandes!", "Depois da vitória, cantei um cântico inteiro a Deus. Gratidão faz bem!", "Até as estrelas lutaram a favor de Israel! Deus usa tudo a favor do Seu povo.", "Coragem vem de confiar em Deus. Abra a Bíblia e ganhe coragem para hoje!"], "samuel": ["Minha mãe, Ana, orou muito pedindo um filho. Eu sou resposta de oração!", "Ainda menino, ouvi Deus me chamar à noite. “Fala, Senhor, que eu ouço!”", "Deus me chamou três vezes até eu entender. Ele tem paciência com você também!", "Cresci servindo no templo. Nunca é cedo demais para conhecer a Deus!", "Ungi Davi, o caçula que cuidava das ovelhas. Deus olha o coração!", "Ergui uma pedra e disse: “Até aqui nos ajudou o Senhor.” Lembre o que Ele já fez por você!", "Nenhuma palavra que Deus me deu caiu por terra. Leia o que Ele diz hoje!"], "elias": ["Corvos me traziam pão e carne junto ao riacho. Deus sustenta quem confia n’Ele!", "A farinha e o azeite da viúva não acabaram. A Palavra de Deus também não acaba!", "No Carmelo, Deus respondeu com fogo do céu. Ele ainda responde a quem O busca!", "Orei sete vezes até ver uma nuvenzinha de chuva. Não desista de buscar a Deus!", "Também fiquei cansado e com medo. Deus me deu comida e descanso. Ele cuida de você!", "Deus não falou no vento nem no terremoto, mas numa voz mansa e suave. Preste atenção!", "Subi ao céu num carro de fogo! Quem anda com Deus vai longe."], "eliseu": ["Eu estava arando o campo quando Elias lançou o manto sobre mim. Deus chama no meio da rotina!", "Pedi porção dobrada do espírito de Elias. Peça a Deus coisas grandes hoje!", "Deus multiplicou o azeite da viúva até encher todas as vasilhas. Leve a sua para a lição!", "Um machado de ferro flutuou na água! Para Deus, nada está perdido.", "Meu servo viu cavalos e carros de fogo protegendo a gente. Deus está do seu lado!", "Naamã mergulhou sete vezes no Jordão e foi curado. Obedecer faz diferença!", "Cem homens comeram com vinte pães, e ainda sobrou. Deus multiplica o pouco!"], "hulda": ["Acharam o livro da Lei esquecido no templo. Não deixe a sua Bíblia esquecida!", "Quando o rei Josias ouviu a Lei, rasgou as vestes, arrependido. A Palavra toca o coração!", "Os enviados do rei vieram até mim para saber o que Deus dizia. Busque a Deus primeiro!", "Josias tinha um coração sensível à Palavra, e Deus viu isso. Deixe o seu sensível também!", "Depois da mensagem, o povo renovou a aliança com Deus. Um estudo pode mudar tudo!", "Falei com firmeza o que Deus disse, sem aumentar nem diminuir nada.", "Um livro reencontrado mudou um reino inteiro. Imagine o que a lição de hoje pode mudar!"], "isaias": ["Vi o Senhor num trono alto e sublime. Leia hoje e conheça mais desse Deus!", "Um serafim tocou meus lábios com uma brasa. Deus purifica quem se aproxima d’Ele.", "Eu disse: “Eis-me aqui, envia-me a mim!” Que tal dizer isso hoje?", "Anunciei que nasceria o Emanuel: Deus conosco! E Ele está com você hoje.", "Quem espera no Senhor sobe com asas como águias. Renove suas forças na Palavra!", "Escrevi que a palavra de Deus permanece para sempre. Isso vale para você hoje!", "Falei do Servo que seria ferido por nós. Leia Isaías 53 e encontre Jesus lá!"], "jeremias": ["Deus me chamou quando eu me achava jovem demais. Ele chama você também!", "Deus me disse que me conhecia antes de eu nascer. Você também é conhecido por Ele!", "Vi o oleiro refazer o vaso. Deus também refaz a gente com carinho.", "Queimaram o rolo, mas a Palavra continuou de pé. Leia hoje: ela não passa!", "Me jogaram numa cisterna de lama, e Deus mandou alguém me tirar de lá. Ele não abandona!", "Mesmo com a cidade cercada, comprei um campo confiando nas promessas de Deus.", "Deus tem planos de paz e de esperança para você. Leia e confie!"], "ezequiel": ["Vi os céus se abrirem junto ao rio Quebar. Deus aparece onde a gente menos espera!", "Deus me deu um rolo para comer, e ele era doce como mel. A Palavra é doce!", "Deus me colocou como atalaia, um vigia do povo. Fique atento ao que Ele diz!", "Vi um vale de ossos secos voltar à vida. A Palavra de Deus dá vida nova!", "Deus prometeu trocar o coração de pedra por um coração de carne. Ele quer renovar o seu!", "Vi um rio sair do templo, cada vez mais fundo. Mergulhe mais fundo na Palavra!", "Deus me mandou ficar de pé e me deu forças para isso. Fique firme hoje!"], "daniel": ["Ainda jovem, decidi não me contaminar com a comida do rei. Decisões firmes começam cedo!", "Com legumes e água, fiquei mais saudável que os outros. Deus honra quem O honra!", "Deus me revelou o sonho do rei e o seu significado. Ele revela os mistérios!", "Meus amigos não se curvaram à estátua, e Deus estava com eles no fogo!", "Eu orava três vezes ao dia, com a janela aberta. Separe o seu horário com Deus!", "Na cova, Deus fechou a boca dos leões. Ele protege quem é fiel!", "O anjo Gabriel veio me ajudar a entender a profecia. Deus ajuda quem quer entender!"], "jonas": ["Deus me mandou para Nínive, e eu peguei um navio para o outro lado. Não fuja da lição!", "Dormi no porão do navio no meio da tempestade. Acorde! Hoje tem lição.", "Orei de dentro de um grande peixe. Dá para falar com Deus em qualquer lugar!", "Deus me deu uma segunda chance. Ele também dá a você!", "Nínive inteira se arrependeu. Uma mensagem de Deus pode mudar uma cidade!", "Fiquei bravo quando Deus perdoou Nínive. Aprendi que Ele ama todo mundo.", "Deus usou uma plantinha para me ensinar sobre misericórdia. Ele ensina de jeitos criativos!"], "joao": ["Pulei de alegria na barriga da minha mãe, Isabel, quando Maria chegou!", "Vivi no deserto comendo gafanhotos e mel silvestre. Simples, mas perto de Deus!", "Eu dizia: “Preparem o caminho do Senhor!” Cada estudo prepara o seu coração.", "Batizei Jesus no rio Jordão e vi o Espírito descer como pomba.", "Apontei para Jesus e disse: “Eis o Cordeiro de Deus!” Procure Jesus na lição de hoje.", "Ele precisa crescer, e eu diminuir. Jesus em primeiro lugar!", "Eu falava a verdade até para reis. A coragem vem da Palavra!"], "joel": ["Vi uma nuvem de gafanhotos destruir tudo. Mas Deus prometeu restaurar!", "Deus disse: “Rasguem o coração, e não as roupas.” Ele quer sinceridade!", "Deus prometeu devolver os anos que os gafanhotos comeram. Ele restaura!", "Deus prometeu que os jovens teriam visões. Isso inclui você!", "Pedro citou a minha profecia no Pentecostes. A Palavra de Deus se cumpre!", "Todo aquele que invocar o nome do Senhor será salvo. Todo mundo mesmo!", "Toquem a trombeta! Hoje é dia de buscar a Deus. Bora estudar?"], "miqueias": ["Anunciei que o Salvador nasceria na pequena Belém. Deus usa o que parece pequeno!", "Deus já mostrou o que é bom: praticar a justiça, amar a misericórdia e andar humildemente com Ele.", "Eu vim de uma cidadezinha, Moresete. Deus chama gente de todo lugar!", "Escrevi que Deus lança os nossos pecados no fundo do mar. Que perdão!", "Anunciei um tempo em que espadas virariam ferramentas de plantar. Deus traz paz!", "Eu olho para o Senhor e espero n’Ele. Espere em Deus hoje também!", "Quem é Deus como o nosso, que perdoa e se alegra em mostrar amor?"], "nata": ["Contei a Davi a história de uma ovelhinha para ele enxergar o próprio pecado.", "Tive coragem de dizer ao rei: “Você é esse homem.” A Palavra fala com a gente.", "Davi queria construir um templo, e Deus me deu a resposta para ele. let manifestUrl = null;
function aplicarIcone(url){
  url = url || ICONE_PADRAO;
  const padrao = url === ICONE_PADRAO, urlPng = padrao ? ICONE_PADRAO_PNG : url;
  $("favicon").href = url; $("touchicon").href = urlPng;
  try{
    const man = { name:"Corrida do Rolo – Quiz da Lição", short_name:"Corrida do Rolo", start_url: location.href.split("#")[0], display:"standalone", background_color:"#524F9C", theme_color:"#524F9C",
      icons:[{ src:urlPng, sizes:"180x180 192x192 512x512", type:"image/png", purpose:"any" }] };
    if(manifestUrl) URL.revokeObjectURL(manifestUrl);
    manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:"application/manifest+json"}));
    $("manifest").href = manifestUrl;
  }catch(e){}
  if(url === ICONE_PADRAO) localStorage.removeItem(KEY + ":icone"); else lsSet(KEY + ":icone", url);
}
aplicarIcone(lsGet(KEY + ":icone", ""));
function redimensionarIcone(file, tam){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const c = document.createElement("canvas"); c.width = tam; c.height = tam; const x = c.getContext("2d");
      const r = Math.min(tam / img.naturalWidth, tam / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r;
      x.drawImage(img, (tam - w)/2, (tam - h)/2, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/png"));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Não deu para abrir essa imagem. Use PNG, JPG ou SVG.")); };
    img.src = url;
  });
}

   CAMADA DE DADOS — Firebase (real) ou Local (demonstração)
   ============================================================ */
const FB_OK = !!(FIREBASE_CONFIG.apiKey && !/^COLE_/.test(FIREBASE_CONFIG.apiKey) && typeof firebase !== "undefined");
function novoPerfil(nome, email, extra){
  const boot = ADMINS_INICIAIS.map(e=>e.toLowerCase()).includes(String(email).toLowerCase());
  return Object.assign({ nome, email:String(email).toLowerCase(), emoji:"🙂", tema:"auto", profeta:"", admin:boot, master:boot, aprovado:boot, liberarAnterior:false, criadoEm:Date.now() }, extra||{});
}

function dbFirebase(){
  const fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  const col = n => fs.collection(n);
  const lista = async q => (await q.get()).docs.map(d=>Object.assign({id:d.id}, d.data()));
  // O Firestore não aceita array dentro de array: "dias" (7 listas de perguntas) vira um mapa {"0":[...], ..., "6":[...]} ao salvar
  const paraFs = doc => { const o = Object.assign({}, doc); if(Array.isArray(o.dias)){ const m = {}; o.dias.forEach((qs,k)=> m[String(k)] = qs || []); o.dias = m; } return o; };
  const deFs = doc => { if(doc && doc.dias && !Array.isArray(doc.dias)){ const m = doc.dias; doc.dias = Array.from({length:7}, (_,k)=> Array.isArray(m[String(k)]) ? m[String(k)] : []); } return doc; };
  return {
    modo:"firebase",
    onAuth(cb){ auth.onAuthStateChanged(u => cb(u ? {uid:u.uid, email:u.email} : null)); },
    async login(email, senha){ await auth.signInWithEmailAndPassword(email, senha); },
    async criarConta(nome, email, senha){
      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      let auto = false; try{ const c = await col("config").doc("geral").get(); auto = !!(c.exists && c.data().aprovacaoAuto); }catch(e){}
      await col("usuarios").doc(cred.user.uid).set(novoPerfil(nome, email, auto ? {aprovado:true} : {}));
    },
    async sair(){ await auth.signOut(); },
    async alterarSenha(atual, nova){
      const u = auth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, atual));
      await u.updatePassword(nova);
    },
    async resetSenha(email){ await auth.sendPasswordResetEmail(email); },
    async criarUsuarioAdmin(nome, email, senha, aprovado, admin){
      const sec = firebase.apps.find(a=>a.name==="sec") || firebase.initializeApp(FIREBASE_CONFIG, "sec");
      const cred = await sec.auth().createUserWithEmailAndPassword(email, senha);
      await col("usuarios").doc(cred.user.uid).set(novoPerfil(nome, email, { aprovado:!!aprovado, admin:!!admin }));
      await sec.auth().signOut();
      return cred.user.uid;
    },
    async getUsuario(uid){ const d = await col("usuarios").doc(uid).get(); return d.exists ? Object.assign({id:d.id}, d.data()) : null; },
    async salvarUsuario(uid, dados){ await col("usuarios").doc(uid).set(dados, {merge:true}); },
    async listarUsuarios(){ return lista(col("usuarios")); },
    async excluirUsuario(uid){ await col("usuarios").doc(uid).delete(); },
    async listarLicoes(){ return (await lista(col("licoes"))).map(deFs); },
    async salvarLicao(id, dados){ await col("licoes").doc(id).set(paraFs(dados)); },
    async excluirLicao(id){ await col("licoes").doc(id).delete(); },
    async meusResultados(uid){ return lista(col("resultados").where("uid","==",uid)); },
    async resultadosLicao(licaoId){ return lista(col("resultados").where("licaoId","==",licaoId)); },
    async todosResultados(){ return lista(col("resultados")); },
    async resultadosTrimestre(tri){ return lista(col("resultados").where("trimestre","==",tri)); },
    // Resultados só de algumas pessoas (membros de uma sala), em blocos de 30 uids; com licaoId, só daquela lição
    async resultadosDeUsuarios(uids, licaoId){
      const out = [];
      for(let i = 0; i < uids.length; i += 30){
        const bloco = uids.slice(i, i + 30);
        let docs;
        if(licaoId){
          try{ docs = await lista(col("resultados").where("uid","in",bloco).where("licaoId","==",licaoId)); }
          catch(e){ docs = (await lista(col("resultados").where("uid","in",bloco))).filter(r => r.licaoId === licaoId); }   // sem índice composto: filtra aqui
        } else docs = await lista(col("resultados").where("uid","in",bloco));
        out.push(...docs);
      }
      return out;
    },
    async salvarResultado(r){ await col("resultados").doc(r.uid+"_"+r.licaoId+"_"+r.data).set(r); },
    async getConfig(){ const d = await col("config").doc("geral").get(); return d.exists ? d.data() : {}; },
    async salvarConfig(c){ await col("config").doc("geral").set(c, {merge:true}); },
    // Salas (turmas) e seus membros. Membro: id = salaId_uid, status "ativo" | "pendente"
    async getSala(id){ const d = await col("salas").doc(id).get(); return d.exists ? Object.assign({id:d.id}, d.data()) : null; },
    async listarSalas(){ return lista(col("salas")); },
    async salasPublicas(){ return lista(col("salas").where("publica","==",true)); },
    async salasDoDono(uid){ return lista(col("salas").where("dono","==",uid)); },
    async salaPorCodigo(codigo){ const r = await lista(col("salas").where("codigo","==",codigo).limit(1)); return r[0] || null; },
    async salvarSala(id, dados){ await col("salas").doc(id).set(dados, {merge:true}); },
    async excluirSala(id){ const e = await col("equipes").where("salaId","==",id).get(); for(const d of e.docs) await d.ref.delete(); const s = await col("membros").where("salaId","==",id).get(); for(const d of s.docs) await d.ref.delete(); await col("salas").doc(id).delete(); },
    async membrosDoUsuario(uid){ return lista(col("membros").where("uid","==",uid)); },
    async membrosDaSala(salaId){ return lista(col("membros").where("salaId","==",salaId)); },
    async salvarMembro(m){ await col("membros").doc(m.salaId + "_" + m.uid).set(m, {merge:true}); },
    async excluirMembro(salaId, uid){ await col("membros").doc(salaId + "_" + uid).delete(); },
    // Equipes de uma sala: {salaId, nome, cor, criadaPor, membros:[uid], pessoas:{uid:{nome,profeta}}}
    async equipesDaSala(salaId){ return lista(col("equipes").where("salaId","==",salaId)); },

/* IndexedDB (modo demonstração) para as páginas do PDF, que não cabem no localStorage */
function idbTx(modo, fn){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(KEY + ":idb", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("paginas", { keyPath:"id" });
    r.onerror = ()=> rej(r.error);
    r.onsuccess = ()=>{ const db = r.result, tx = db.transaction("paginas", modo), req = fn(tx.objectStore("paginas")); tx.oncomplete = ()=>{ db.close(); res(req && req.result); }; tx.onerror = ()=> rej(tx.error); };
  });
}

function montarLicao(L){
  const trimestre = L.trimestre || TRIMESTRE_BASE;
  const n = Number(L.n);
  const temas = (L.temas && L.temas.length===7) ? L.temas : NOMES_DIAS.map((d,k)=> (L.temas||[])[k] || d);
  const diasQ = Array.from({length:7}, (_,k)=> (L.dias && L.dias[k]) || []);
  return {
    id: L.id || (trimestre + "-l" + n), trimestre, n, exemplo:false,
    titulo: L.titulo || ("Lição " + n), numero: "Lição " + n, datas: L.datas || "",
    subtitulo: "Lição " + n + (L.datas ? ", de " + L.datas : ""),
    recap: "Recapitulação no sábado, " + dataLonga(somarDias(L.inicio, 7)),
    inicio: L.inicio, textos: L.textos || [], resumos: L.resumos || [], origem: L.origem || "banco", qtd: Array.isArray(L.qtd) ? L.qtd : null,
    dias: diasQ.map((qs, k) => ({ data: somarDias(L.inicio, k), nome: NOMES_DIAS[k], curto: CURTOS[k], tema: temas[k],
      perguntas: qs.map(q => (q.img && L.trimestre===TRIMESTRE_BASE && TIRINHAS[String(n)]) ? Object.assign({}, q, { img: TIRINHAS[String(n)] }) : Object.assign({}, q, {img:undefined})) }))
  };
}
function montarLicoes(){
  const baseRaw = {}; LICOES_DADOS.forEach(L => { const r = Object.assign({}, L, { trimestre:TRIMESTRE_BASE, origem:"arquivo", id: TRIMESTRE_BASE + "-l" + L.n }); baseRaw[r.id] = r; });
  const mapa = {}; Object.values(baseRaw).forEach(r => mapa[r.id] = montarLicao(r));
  LICOES_DB.filter(l => l.status === "publicada" && l.inicio).forEach(l => {
    const b = baseRaw[l.id];
    // Lição do banco com o mesmo id da que vem no arquivo: o banco manda, mas dias sem perguntas no banco usam as perguntas do arquivo
    const r = b ? Object.assign({}, b, l, { dias: Array.from({length:7}, (_,k)=> ((l.dias||[])[k] && l.dias[k].length) ? l.dias[k] : (b.dias[k] || [])), origem:"mesclada" }) : l;
    const m = montarLicao(r); mapa[m.id] = m;
  });
  LICOES = Object.values(mapa).sort((a,b)=> a.inicio < b.inicio ? -1 : a.inicio > b.inicio ? 1 : 0);
}
function indiceLicaoAtual(){
  const h = hoje();
  let i = LICOES.findIndex(l => h >= l.dias[0].data && h <= l.dias[6].data);
  if(i < 0){ i = LICOES.findIndex(l => l.dias[0].data > h); if(i < 0) i = LICOES.length - 1; else if(i > 0 && h > LICOES[i-1].dias[6].data) i = i; }
  return Math.max(0, i);
}
function resDe(L, dia){ return RES[L.id + "|" + dia.data]; }
function licaoFutura(L){ return L.dias[0].data > hoje(); }
function licaoPassada(L){ return L.dias[6].data < hoje(); }
function licaoTravada(L){ return licaoPassada(L) && !podeAnterior(); }
function status(L, dia){
  if(resDe(L, dia)) return "feito";
  const h = hoje();
  if(licaoFutura(L)) return "bloqueado";
  if(licaoTravada(L)) return "travado";
  if(dia.data > h) return "bloqueado";
  if(dia.data === h) return "hoje";
  return "atrasado";
}
function totalSemana(L){ L = L || LICAO; return L.dias.reduce((s,d)=> s + (resDe(L,d) ? resDe(L,d).pts : 0), 0); }
function noPrazo(L){ L = L || LICAO; return L.dias.filter(d=> resDe(L,d) && resDe(L,d).noPrazo).length; }
function totalTrimestre(trimestre){ return LICOES.filter(l=> !trimestre || l.trimestre===trimestre).reduce((s,l)=> s + totalSemana(l), 0); }

function modal(titulo, html, aoAbrir, aoFechar){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="modal-h"><h3>${esc(titulo)}</h3><button class="fechar" type="button" aria-label="Fechar">✕</button></div><div class="modal-c">${html}</div></div>`;
  document.body.appendChild(bg);
  let fechado = false;
  const fechar = ()=>{ if(fechado) return; fechado = true; bg.remove(); document.removeEventListener("keydown", esc_); if(aoFechar) aoFechar(); };
  const esc_ = e => { if(e.key === "Escape") fechar(); };
  document.addEventListener("keydown", esc_);
  bg.querySelector(".fechar").onclick = fechar;
  bg.addEventListener("click", e => { if(e.target === bg) fechar(); });
  const m = bg.querySelector(".modal");
  if(aoAbrir) aoAbrir(m, fechar);
  const f = m.querySelector("input,textarea,select,button.btn"); if(f && f.tagName !== "BUTTON") setTimeout(()=> f.focus(), 50);
  return fechar;
}
function confirmar(titulo, texto, rotulo, cls){
  return new Promise(res => {
    modal(titulo, `<p>${esc(texto)}</p><div class="btn-row"><button class="btn ${cls||"btn-danger"}" id="cfOk">${esc(rotulo||"Confirmar")}</button><button class="btn btn-ghost" id="cfNao">Cancelar</button></div>`, (m, fechar)=>{
      m.querySelector("#cfOk").onclick = ()=>{ fechar(); res(true); };
      m.querySelector("#cfNao").onclick = ()=>{ fechar(); res(false); };
    });
  });
}

function contagem(dia, cb){
  const rapido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.createElement("div"); el.className = "cd";
  el.innerHTML = `<div class="cd-ring"></div><div class="cd-in">${meuAvatar()}<div class="cd-dia">${esc(dia.nome)} · ${esc(dia.tema)}</div><div class="cd-num" id="cdNum">Pronto?</div><div class="cd-sub" id="cdSub">Leu a lição de hoje? Então vamos!</div></div>`;
  document.body.appendChild(el);
  const passos = [["3","Prepare-se…"],["2","Mantenha a calma…"],["1","Quanto mais rápido, mais pontos!"],["VAI!",""]];
  let k = -1;
  const prox = ()=>{
    k++;
    if(k >= passos.length){ el.remove(); cb(); return; }
    const num = $("cdNum"); if(!num){ cb(); return; }
    const novo = num.cloneNode(false); novo.textContent = passos[k][0];
    novo.className = "cd-num " + (passos[k][0] === "VAI!" ? "vai" : "anim");
    if(typeof tocar === "function") tocar(passos[k][0] === "VAI!" ? "vai" : "tique");
    num.replaceWith(novo);
    if(passos[k][1]) $("cdSub").textContent = passos[k][1];
    setTimeout(prox, rapido ? 350 : (passos[k][0] === "VAI!" ? 650 : 850));
  };
  setTimeout(prox, rapido ? 300 : 900);
}
