async function carregarTudo(){
  const [cfg, lics, meus, prog] = await Promise.all([DB.getConfig(), DB.listarLicoes(), DB.meusResultados(usuario.uid), DB.listarProgresso(usuario.uid).catch(()=>[])]);
  CONFIG = cfg || {}; LICOES_DB = lics || []; resCache = {};
  aplicarIcone(CONFIG.icone || "");
  RES = {}; (meus||[]).forEach(r => RES[r.licaoId + "|" + r.data] = r);
  PROG = {}; (prog||[]).forEach(p => PROG[p.licaoId + "|" + p.data] = p);
  // cópia local (caso o servidor esteja fora do ar no meio de um quiz)
  const localProg = lsGet(KEY + ":prog:" + usuario.uid, {}); Object.keys(localProg).forEach(k => { if(!PROG[k] || (localProg[k].q || 0) > (PROG[k].q || 0)) PROG[k] = localProg[k]; });
  montarLicoes();
  LICAO = LICOES[indiceLicaoAtual()];
}
DB.getConfig().then(c => { if(c && c.icone !== undefined) aplicarIcone(c.icone || ""); }).catch(()=>{});
DB.onAuth(async u => {
  usuario = u;
  try{
    if(!u){ perfil = null; atualizarCasca(); telaLogin(); return; }
    perfil = await DB.getUsuario(u.uid);
    if(!perfil){ let auto = false; try{ auto = !!((await DB.getConfig()) || {}).aprovacaoAuto; }catch(e){} perfil = novoPerfil(u.email.split("@")[0], u.email, auto ? {aprovado:true} : {}); await DB.salvarUsuario(u.uid, perfil); }
    if(emailInicial() && !(perfil.master && perfil.admin && perfil.aprovado)){
      perfil.master = true; perfil.admin = true; perfil.aprovado = true; await DB.salvarUsuario(u.uid, {master:true, admin:true, aprovado:true});
    }
    if(!perfil.aprovado && !perfil.admin && !ehMaster()){ atualizarCasca(); telaPendente(); return; }
    aplicarTema(perfil.tema || "auto");
    await carregarTudo();
    await carregarSalas();
    if(typeof iniciarConquistasVistas === "function") iniciarConquistasVistas();
    if(!perfil.profeta){ atualizarCasca(); telaProfeta(); return; }
    nav("inicio");
    conferirConvite();
  }catch(e){ console.error(e); app.innerHTML = `<section class="panel"><h2 class="h2">Ops</h2><p>${esc(erroMsg(e))}</p><div class="btn-row"><button class="btn btn-main" onclick="location.reload()">Tentar de novo</button><button class="btn btn-ghost" onclick="DB.sair()">Sair</button></div></section>`; }
});

let inicioTimer = null;
function saudacao(){ const h = new Date().getHours(); return h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function todosDias(){ const out = []; LICOES.forEach(L => L.dias.forEach(d => out.push({ L, d }))); return out.sort((a,b)=> a.d.data < b.d.data ? -1 : 1); }
function sequencia(){
  // dias consecutivos (no calendário) feitos no prazo, contando para trás a partir de hoje ou de ontem
  const feitos = {}; todosDias().forEach(({L,d}) => { const r = resDe(L,d); if(r) feitos[d.data] = r; });
  let dia = hoje(); if(!feitos[dia]) dia = somarDias(dia, -1);
  let n = 0; while(feitos[dia] && feitos[dia].noPrazo){ n++; dia = somarDias(dia, -1); }
  return n;
}
function minutoDoDia(ts){ if(!ts) return -1; const d = new Date(ts); return d.getHours()*60 + d.getMinutes(); }
function conquistas(){
  const rs = Object.values(RES), st = sequencia();
  const semanaCompleta = LICOES.some(L => L.dias.every(d => resDe(L,d) && resDe(L,d).noPrazo));
  return [
    { ic:"👣", id:"passo", t:"Primeiro passo", d:"Fez o primeiro quiz", on: rs.length > 0 },
    { ic:"🎯", id:"gabarito", t:"Gabaritou", d:"Acertou todas num dia", on: rs.some(r => r.total > 0 && r.acertos === r.total) },
    { ic:"⚡", id:"relampago", t:"Relâmpago", d:"4.500+ pontos num dia", on: rs.some(r => r.pts >= 4500) },
    { ic:"🏹", id:"mira", t:"Mira certeira", d:"5 dias com todas certas", on: rs.filter(r => r.total > 0 && r.acertos === r.total).length >= 5 },
    { ic:"🔥", id:"chamas", t:"Em chamas", d:"5 dias seguidos no prazo", on: st >= 5 },
    { ic:"📅", id:"semana", t:"Semana completa", d:"7 de 7 no prazo", on: semanaCompleta },
    { ic:"🌙", id:"madrugador", t:"Madrugador", d:"Quiz entre 00h e 06h", on: rs.some(r => minutoDoDia(r.quando) >= 0 && minutoDoDia(r.quando) < 6*60) },
    { ic:"🌅", id:"reino", t:"Primeiro o Reino", d:"Quiz entre 06h e 08h", on: rs.some(r => minutoDoDia(r.quando) >= 6*60 && minutoDoDia(r.quando) <= 8*60) },
    { ic:"🏁", id:"maratonista", t:"Maratonista", d:"21 dias de estudo", on: rs.length >= 21 },
    { ic:"🕊️", id:"fiel", t:"Fiel na reta", d:"3 semanas completas", on: LICOES.filter(L => L.dias.every(d => resDe(L,d) && resDe(L,d).noPrazo)).length >= 3 },
    { ic:"💎", id:"tesouro", t:"Tesouro", d:"20.000 pontos no trimestre", on: totalTrimestre() >= 20000 },
    { ic:"📖", id:"rolo", t:"Rolo inteiro", d:"Todos os dias do trimestre", on: LICOES.length > 0 && LICOES.every(L => L.dias.every(d => resDe(L,d))) }
  ];
}

function conferirNovidades(){ if(tabAtual !== "inicio" || conferirTutorial()) return; if(!conferirConquistasNovas()) conferirMissoesNovas(); }
function conferirConquistasNovas(){

      <div class="btn-row">${uma ? `<button class="btn btn-wa" id="cqnUma">Compartilhar esta conquista</button>` : ""}<button class="btn ${uma ? "btn-ghost" : "btn-wa"}" id="cqnTodas">Compartilhar todas as minhas conquistas</button><button class="btn btn-ghost" id="cqnMural">Publicar no mural</button><button class="btn btn-ghost" id="cqnOk">Continuar</button></div>
    </div>`, (m, fechar)=>{

    m.querySelectorAll("[data-cqn]").forEach(b => b.onclick = ()=> compartilharConquista(novas[+b.dataset.cqn], b));
    m.querySelector("#cqnTodas").onclick = e => compartilharConquistas(e.currentTarget);
    m.querySelector("#cqnMural").onclick = e => publicarNoMural(uma ? postDaConquista(novas[0]) : { tipo: "conquistas", ref: novas.map(c => c.id).join("-"), ic: "🏅", titulo: `Desbloqueou ${novas.length} conquistas de uma vez`, texto: novas.map(c => c.t).join(" · ") }, e.currentTarget);
    m.querySelector("#cqnOk").onclick = fechar;
  }, ()=>{ pararConfete(); setTimeout(conferirMissoesNovas, 300); });
  tocar("missao");
}
/* Confetes caindo por cima de tudo (some sozinho; respeita "reduzir movimento"). Retorna uma função para parar. */
function confetes(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return ()=>{};
  const cv = document.createElement("canvas"); cv.className = "confete"; cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);
  const x = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const medir = ()=>{ W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); };
  medir(); window.addEventListener("resize", medir);
  const CORES = ["#8FE6FF","#5FE0B0","#F2BE2E","#E8505D","#B48CF0","#FFFFFF","#F08A4B"];
  const N = Math.min(180, Math.round(W / 5) + 60), DUR = 6500, ini = performance.now();
  const ps = Array.from({length: N}, (_, i) => ({
    x: Math.random() * W, y: -20 - Math.random() * H * .6, w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
    vy: 3 + Math.random() * 4, vx: -1 + Math.random() * 2, rot: Math.random() * Math.PI * 2, vr: -.15 + Math.random() * .3,
    bal: Math.random() * Math.PI * 2, cor: CORES[i % CORES.length], redondo: i % 6 === 0 }));
  let raf = 0, parado = false;
  const parar = ()=>{ if(parado) return; parado = true; cancelAnimationFrame(raf); window.removeEventListener("resize", medir); cv.remove(); };
  const quadro = t => {
    if(parado) return;
    const passou = t - ini, fim = passou > DUR;
    x.clearRect(0, 0, W, H);
    let vivos = 0;
    ps.forEach(p => {
      p.bal += .05; p.x += p.vx + Math.sin(p.bal) * 1.2; p.y += p.vy; p.rot += p.vr;
      if(p.y > H + 20){ if(fim) return; p.y = -20; p.x = Math.random() * W; }
      vivos++;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.globalAlpha = fim ? Math.max(0, 1 - (passou - DUR) / 1500) : 1; x.fillStyle = p.cor;
      if(p.redondo){ x.beginPath(); x.arc(0, 0, p.w / 2, 0, Math.PI * 2); x.fill(); } else x.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.bal)), p.w, p.h * Math.abs(Math.cos(p.bal)) + 1);
      x.restore();
    });
    if(!vivos || passou > DUR + 1500){ parar(); return; }
    raf = requestAnimationFrame(quadro);
  };
  raf = requestAnimationFrame(quadro);
  return parar;
}
function modalConquista(k){
  const cq = conquistas(), c = cq[k]; if(!c) return;
  const ganhas = cq.filter(x=>x.on).length;
  modal(c.on ? "Conquista desbloqueada" : "Conquista bloqueada", `<div class="cq-modal ${c.on?"on":"off"}"><div class="ic">${c.ic}</div><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p>
    ${c.on ? `<p class="muted small">Mande no grupo e inspire a turma.</p><div class="btn-row"><button class="btn btn-wa" id="cqUma">Compartilhar esta conquista</button><button class="btn btn-ghost" id="cqMural">Publicar no mural</button>${ganhas > 1 ? `<button class="btn btn-ghost" id="cqTodas">Compartilhar todas (${ganhas} de ${cq.length})</button>` : ""}</div>` : `<p class="muted small">Você ainda não ganhou esta conquista. Continue estudando e fazendo o quiz todo dia!</p>`}</div>`, (m)=>{
    const u = m.querySelector("#cqUma"); if(u) u.onclick = ()=> compartilharConquista(c, u);
    const mu = m.querySelector("#cqMural"); if(mu) mu.onclick = ()=> publicarNoMural(postDaConquista(c), mu);
    const t = m.querySelector("#cqTodas"); if(t) t.onclick = ()=> compartilharConquistas(t);
  });
}

  const h = hoje(), L = LICOES[indiceLicaoAtual()], hojeIdx = L ? L.dias.findIndex(d => d.data === h) : -1, dHoje = hojeIdx >= 0 ? L.dias[hojeIdx] : null;
  const fala = falaDoDia();
  let html = `<div class="inicio-grid"><div>`;
  html += `<section class="panel"><div class="inicio-hero">${meuAvatar()}<div><div class="saud">${saudacao()}</div><h2>${esc(perfil.nome)}!</h2>${fala ? `<div class="balao mini"><p>${esc(fala)}</p></div>` : ""}</div></div></section>`;
  // HOJE
  html += `<section class="panel hoje">`;
  if(dHoje){
    const r = resDe(L, dHoje), prog = PROG[L.id + "|" + dHoje.data];
    html += `<span class="hoje-lbl">Hoje · ${esc(dHoje.nome)}, ${esc(dataLonga(dHoje.data))}</span><h2>${esc(dHoje.tema)}</h2><p class="muted small" style="margin:0 0 10px">${esc(L.numero)}: ${esc(L.titulo)}</p>`;
    if(r) html += `<p class="status"><span class="pill ok">✓ Quiz de hoje feito</span><span>${fmt(r.pts)} pontos · ${r.acertos} de ${r.total} certas</span></p><div class="btn-row"><button class="btn btn-ghost" id="inVer">Ver resultado</button><button class="btn btn-ghost" id="inEstudar">Reler a lição</button></div>`;
    else if(prog) html += `<p class="status"><span class="pill late">Em andamento</span><span>pergunta ${Math.min(prog.q+1, prog.n)} de ${prog.n}</span></p><div class="btn-row"><button class="btn btn-main" id="inJogar">Continuar o quiz</button><button class="btn btn-ghost" id="inEstudar">Estudar</button></div>`;

async function posicaoCorrida(L){
  const el = $("inCorrida"); if(!el) return;
  try{
    const sala = salaAtual();
    let res = await resultadosDaSala(sala, { licaoId: L.id });
    const membros = await membrosAtivos(sala).catch(()=>null);
    if(membros) res = res.filter(r => membros.has(r.uid));
    if(!$("inCorrida")) return;
    // Mesma ordem da pista (Corrida): passos, depois pontos, depois nome.
    const passos = {}, pts = {}, nomes = {};
    res.forEach(r => { passos[r.uid] = (passos[r.uid]||0) + (r.noPrazo ? 1 : .5); pts[r.uid] = (pts[r.uid]||0) + (r.pts||0); nomes[r.uid] = r.nome || (r.uid===usuario.uid ? (perfil.nome||"") : ""); });
    const ordem = Object.keys(passos).sort((a,b)=> passos[b]-passos[a] || pts[b]-pts[a] || (nomes[a]||"").localeCompare(nomes[b]||"","pt-BR"));
    const meus = passos[usuario.uid] || 0, pos = meus ? ordem.indexOf(usuario.uid) + 1 : 0, lider = ordem[0] ? passos[ordem[0]] : 0;
    // Subiu de posição desde a última vez que olhou? Comemora.
    const chavePos = sala.id + "|" + L.id, ant = lsGet(KEY + ":pos:" + usuario.uid, null);
    if(pos && ant && ant.chave === chavePos && ant.pos && pos < ant.pos && !document.querySelector(".modal-bg")){ tocar("subiu"); aviso(`Você subiu para ${pos}º na sala ${sala.nome}!`); }
    if(pos) lsSet(KEY + ":pos:" + usuario.uid, { chave: chavePos, pos });
    const fmt1 = n => (Math.round(n*10)/10).toLocaleString("pt-BR");
    el.innerHTML = `<div class="cq-head"><span class="hoje-lbl">Corrida do Rolo · ${esc(L.numero)}</span><button class="btn btn-ghost btn-sm" id="inSala" title="Trocar de sala">${esc(sala.nome)}</button></div>
      <div class="posicao">${pos ? `<b>${pos}º</b><span>de ${ordem.length} na pista · ${fmt1(meus)} ${meus===1?"passo":"passos"}</span>` : `<b>—</b><span>${ordem.length ? ordem.length + " já estão correndo. Entre na pista!" : "A pista está vazia. Seja o primeiro!"}</span>`}</div>
      <div class="track" style="--seg:7"><span class="flag" aria-hidden="true">🏁</span><div class="runner" style="--p:${Math.min(1, meus/7)}">${meuAvatar()}</div></div>
      <p class="muted small" style="margin:10px 0 0">${pos === 1 && meus ? "Você está na frente! Mantenha o ritmo." : lider > meus ? `O líder tem ${fmt1(lider)} ${lider===1?"passo":"passos"}. Cada dia no prazo é um passo.` : "Cada dia no prazo é um passo. Com atraso, meio passo."}</p>
      <div class="btn-row uma" style="margin-top:12px"><button class="btn btn-ghost" id="inRolo">Ver a corrida completa</button></div>`;
    $("inRolo").onclick = ()=> nav("ranking");
    $("inSala").onclick = ()=> nav("salas");
  }catch(e){ el.innerHTML = `<span class="hoje-lbl">Corrida do Rolo</span><p class="muted small" style="margin:0">${esc(erroMsg(e))}</p>`; }
}

/* ============================================================
   QUIZ: perguntas
   ============================================================ */
function iniciar(i){
  const dia = LICAO.dias[i];
  if(!dia.perguntas.length){ aviso("Este dia ainda não tem perguntas."); return; }
  if(resDe(LICAO, dia)){ telaResultado(i); return; }
  const diaJogo = Object.assign({}, dia, { perguntas: perguntasDoDia(LICAO, i).slice() });
  const total = diaJogo.perguntas.filter(p=>!p.reflexao).length;
  const salvo = PROG[LICAO.id + "|" + dia.data];
  if(salvo && salvo.q > 0 || (salvo && salvo.mostrada)){
    // Retoma de onde parou (inclusive perguntas trocadas pela Segunda chance e ajudas em uso)
    const trocas = salvo.trocas || {};
    Object.keys(trocas).forEach(k => { const nova = dia.perguntas.find(x => x.p === trocas[k]); if(nova && diaJogo.perguntas[+k]) diaJogo.perguntas[+k] = nova; });
    jogo = { i, dia: diaJogo, L: LICAO, q: Math.min(salvo.q || 0, diaJogo.perguntas.length), pts: salvo.pts || 0, acertos: salvo.acertos || 0, total, prazo: !!salvo.prazo, mostrada: salvo.mostrada || null, resp: Array.isArray(salvo.resp) ? salvo.resp : [], trocas, dobro: !!salvo.dobro, meio: salvo.meio || null };
    retomar();
    return;
  }
  const prazo = dia.data >= hoje();
  jogo = { i, dia: diaJogo, L: LICAO, q:0, pts:0, acertos:0, total, prazo, mostrada:null, resp: [], trocas: {}, dobro: false, meio: null };
  contagem(dia, telaPergunta);
}
/* Continua um quiz salvo. Se a pessoa saiu no meio de uma pergunta e já passou o tempo dela, a pergunta conta como "tempo esgotado". */
function retomar(){
  while(jogo.q < jogo.dia.perguntas.length){
    const p = jogo.dia.perguntas[jogo.q], m = jogo.mostrada;
    if(m && m.q === jogo.q && !p.reflexao && (Date.now() - m.em) > TEMPO * 1000){ registrarResposta(p, -1); jogo.q++; jogo.mostrada = null; continue; }   // tempo esgotado: 0 pontos
    break;
  }
  if(jogo.q >= jogo.dia.perguntas.length){ salvarProgresso(); finalizarQuiz(); return; }
  aviso("Continuando de onde você parou");
  telaPergunta();
}
function salvarProgresso(){
  const id = usuario.uid + "_" + jogo.L.id + "_" + jogo.dia.data;
  const p = { id, uid: usuario.uid, licaoId: jogo.L.id, data: jogo.dia.data, q: jogo.q, n: jogo.dia.perguntas.length, pts: jogo.pts, acertos: jogo.acertos, total: jogo.total, prazo: jogo.prazo, mostrada: jogo.mostrada || null, resp: jogo.resp || [], trocas: jogo.trocas || {}, dobro: !!jogo.dobro, meio: jogo.meio || null, quando: Date.now() };
  PROG[jogo.L.id + "|" + jogo.dia.data] = p;
  const lp = lsGet(KEY + ":prog:" + usuario.uid, {}); lp[jogo.L.id + "|" + jogo.dia.data] = p; lsSet(KEY + ":prog:" + usuario.uid, lp);
  DB.salvarProgresso(p).catch(()=>{});
}
function limparProgresso(L, data){
  const chave = L.id + "|" + data; delete PROG[chave];
  const lp = lsGet(KEY + ":prog:" + usuario.uid, {}); delete lp[chave]; lsSet(KEY + ":prog:" + usuario.uid, lp);
  DB.excluirProgresso(usuario.uid + "_" + L.id + "_" + data).catch(()=>{});
}
async function finalizarQuiz(){
  const r = { uid: usuario.uid, nome: perfil.nome, profeta: perfil.profeta || "", licaoId: jogo.L.id, trimestre: jogo.L.trimestre, data: jogo.dia.data,
    pts: jogo.pts, acertos: jogo.acertos, total: jogo.total, noPrazo: jogo.prazo, resp: jogo.resp || [], nivel: Math.max(1, meuNivel()), quando: Date.now() };
  try{ await DB.salvarResultado(r); }catch(e){ aviso("Não deu para salvar no servidor: " + erroMsg(e)); }
  RES[r.licaoId + "|" + r.data] = r;
  limparCacheResultados();
  limparProgresso(jogo.L, jogo.dia.data);
  LICAO = jogo.L;
  telaResultado(jogo.i, true);
}

  h += `</div>
    <h2 class="qtext">${esc(p.p)}</h2>
    <p class="qhint">${p.reflexao ? "Reflexão: qualquer resposta vale ponto" : "Quanto mais rápido, mais pontos"}</p>
    ${p.reflexao ? "" : barraAjudas(p)}
    <div class="tiles" id="tiles">
      ${p.o.map((op,k)=>`<button class="tile t${k}" data-k="${k}"><span class="letter">${LETRAS[k]}</span><span>${esc(op)}</span></button>`).join("")}
    </div><div id="fb"></div></div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
  app.querySelectorAll(".tile").forEach(t=> t.onclick = ()=> responder(+t.dataset.k));
  if(!p.reflexao) ligarAjudas(p);
  if(!(jogo.mostrada && jogo.mostrada.q === jogo.q)) jogo.mostrada = { q: jogo.q, em: Date.now() };
  salvarProgresso();
  if(!p.reflexao) iniciarTimer(Math.max(0, (Date.now() - jogo.mostrada.em) / 1000));
}
function iniciarTimer(jaPassou){
  pararTimer();
  const ini = performance.now() - (jaPassou || 0) * 1000;
  const bar = $("bar"), num = $("num"), ring = $("ring");
  const C = 169.65;
  jogo.inicio = ini;
  const tick = (t)=>{
    if(!document.getElementById("bar")){ timer = null; return; }
    const passou = (t - ini)/1000, resta = Math.max(0, TEMPO - passou);
    bar.setAttribute("stroke-dashoffset", String(C * (1 - resta/TEMPO)));
    num.textContent = Math.ceil(resta);
    ring.classList.toggle("low", resta <= 5);
    if(resta <= 0){ timer = null; responder(-1); return; }
    timer = requestAnimationFrame(tick);
  };
  timer = requestAnimationFrame(tick);
}
function pararTimer(){ if(timer){ cancelAnimationFrame(timer); timer = null; } }

/* ---------- Ajudas durante a pergunta ---------- */
function barraAjudas(p){
  const d = ajudasDisponiveis(), meioAqui = jogo.meio && jogo.meio.q === jogo.q;
  if(!d.meio && !d.dobro && !jogo.dobro && !meioAqui) return "";
  return `<div class="ajudas-bar" id="ajBar">
    ${d.meio || meioAqui ? `<button type="button" class="ajuda-btn ${meioAqui ? "usada" : ""}" id="ajMeio" ${meioAqui ? "disabled" : ""}><span class="ic">${AJUDAS.meio.ic}</span>${meioAqui ? "Meio a meio usado" : "Meio a meio"}${meioAqui ? "" : `<b>${d.meio}</b>`}</button>` : ""}
    ${d.dobro || jogo.dobro ? `<button type="button" class="ajuda-btn ${jogo.dobro ? "ativa" : ""}" id="ajDobro" aria-pressed="${!!jogo.dobro}"><span class="ic">${AJUDAS.dobro.ic}</span>${jogo.dobro ? "Dobro ativado" : "Pontos em dobro"}<b>${d.dobro}</b></button>` : ""}
  </div>${jogo.dobro ? `<p class="ajuda-dica" id="ajDica">Sua próxima resposta certa vale o dobro.</p>` : `<p class="ajuda-dica" id="ajDica" hidden></p>`}`;
}
function aplicarMeio(){
  if(!jogo.meio || jogo.meio.q !== jogo.q) return;
  const tiles = $("tiles"); if(!tiles) return;
  jogo.meio.fora.forEach(k => { const t = tiles.querySelector(`.tile[data-k="${k}"]`); if(t){ t.classList.add("fora"); t.disabled = true; } });
}
function ligarAjudas(p){
  aplicarMeio();
  const bm = $("ajMeio");
  if(bm && !bm.disabled) bm.onclick = ()=>{
    if($("tiles").classList.contains("done") || ajudasDisponiveis().meio < 1) return;
    const erradas = embaralhar(p.o.map((_, k) => k).filter(k => k !== p.c), semente(p.p + "|" + usuario.uid)).slice(0, Math.max(0, p.o.length - 2));
    jogo.meio = { q: jogo.q, fora: erradas }; gastarAjuda("meio"); tocar("ajuda"); salvarProgresso(); aplicarMeio();
    bm.disabled = true; bm.classList.add("usada"); bm.innerHTML = `<span class="ic">${AJUDAS.meio.ic}</span>Meio a meio usado`;
  };
  const bd = $("ajDobro");
  if(bd) bd.onclick = ()=>{
    if($("tiles").classList.contains("done")) return;
    if(!jogo.dobro && ajudasDisponiveis().dobro < 1) return;
    jogo.dobro = !jogo.dobro; tocar("ajuda"); salvarProgresso();
    bd.classList.toggle("ativa", jogo.dobro); bd.setAttribute("aria-pressed", String(jogo.dobro));
    bd.innerHTML = `<span class="ic">${AJUDAS.dobro.ic}</span>${jogo.dobro ? "Dobro ativado" : "Pontos em dobro"}<b>${ajudasDisponiveis().dobro}</b>`;
    const dica = $("ajDica"); if(dica){ dica.hidden = !jogo.dobro; dica.textContent = "Sua próxima resposta certa vale o dobro."; }
  };
}
/* Outra pergunta do mesmo dia que ainda não apareceu para a pessoa (para a Segunda chance) */
function perguntaReserva(){
  const dia = jogo.L.dias[jogo.i]; if(!dia) return null;
  const vistas = new Set(jogo.dia.perguntas.map(x => x.p).concat((jogo.resp || []).map(r => r.p)).concat(Object.values(jogo.trocas || {})));
  const livres = dia.perguntas.filter(x => !x.reflexao && !vistas.has(x.p));
  return livres.length ? embaralhar(livres, semente(usuario.uid + "|" + jogo.dia.data + "|" + jogo.q))[0] : null;
}
function usarSegundaChance(){
  const nova = perguntaReserva();
  if(!nova || ajudasDisponiveis().chance < 1){ aviso("Não há outra pergunta disponível para este dia."); return; }
  gastarAjuda("chance"); tocar("ajuda");
  // A resposta errada continua registrada para o acompanhamento, mas a vaga passa a ser da nova pergunta
  const reg = (jogo.resp || []).find(r => r.q === jogo.q); if(reg){ reg.q = jogo.q + 0.5; reg.sc = true; }
  jogo.dia.perguntas[jogo.q] = nova;
  jogo.trocas = jogo.trocas || {}; jogo.trocas[jogo.q] = nova.p;
  if(jogo.meio && jogo.meio.q === jogo.q) jogo.meio = null;
  jogo.mostrada = null; salvarProgresso();
  aviso("Segunda chance! Aí vai outra pergunta.");
  telaPergunta();
}
/* Guarda o que foi respondido em cada pergunta (para o acompanhamento do admin). k = -1: tempo esgotado. */
function registrarResposta(p, k){
  if(!jogo.resp) jogo.resp = [];
  if(jogo.resp.some(r => r.q === jogo.q)) return;
  jogo.resp.push({ q: jogo.q, p: p.p, k, c: p.reflexao ? -1 : p.c, r: !!p.reflexao, ok: p.reflexao ? true : k === p.c, o: k >= 0 && p.o[k] != null ? String(p.o[k]) : "" });
}
function responder(k){
  const tiles = $("tiles");
  if(!tiles || tiles.classList.contains("done")) return;
  pararTimer();
  tiles.classList.add("done");
  const p = jogo.dia.perguntas[jogo.q];
  const mult = jogo.prazo ? 1 : ATRASO;
  let ganho = 0, cls = "ok", titulo = "", texto = "";
  if(p.reflexao){
    ganho = Math.round(REFLEXAO * mult);
    titulo = "Valeu! +" + fmt(ganho);
    texto = "Leve essa resposta para a conversa de sábado.";
    tocar("certo");
    tiles.querySelectorAll(".tile").forEach(t=>{ if(+t.dataset.k !== k) t.classList.add("dim"); });
  } else {
    const resta = Math.max(0, TEMPO - (performance.now() - jogo.inicio)/1000);
    const certo = k === p.c;
    if(certo){
      ganho = Math.round((BASE + (MAX-BASE) * (resta/TEMPO)) * mult); jogo.acertos++;
      if(jogo.dobro){ ganho *= 2; jogo.dobro = false; gastarAjuda("dobro"); titulo = "Certo! +" + fmt(ganho) + " (em dobro)"; }
      else titulo = "Certo! +" + fmt(ganho);
    }
    else { cls = "bad"; titulo = k === -1 ? "Tempo esgotado" : "Não foi dessa vez"; }
    tocar(certo ? "certo" : "errado");
    texto = certo ? "" : "A resposta certa era " + LETRAS[p.c] + ": " + p.o[p.c] + ".";
    tiles.querySelectorAll(".tile").forEach(t=>{
      const kk = +t.dataset.k;
      if(kk === p.c){ const m=document.createElement("span"); m.className="mark"; m.textContent="Resposta certa"; t.appendChild(m); }
      else t.classList.add("dim");
    });
  }
  jogo.pts += ganho;
  registrarResposta(p, k);
  const ultima = jogo.q === jogo.dia.perguntas.length - 1;
  jogo.q++; jogo.mostrada = null; salvarProgresso(); jogo.q--;   // já fica salvo como respondida, mesmo que a pessoa saia antes de clicar em "Próxima"
  let prova = "";
  if(p.texto) prova += `<blockquote class="verso"><p><em>“${esc(p.texto)}”</em></p><cite>${esc(p.ref||"")}</cite></blockquote>`;
  if(p.img) prova += `<figure class="tira"><div class="rolagem"><img src="${p.img}" alt="Tirinha da ${esc(jogo.L.numero)}" onerror="this.closest('figure').hidden=true"></div><figcaption>${esc(p.ref||"")}. Arraste para o lado para ver a tirinha toda.</figcaption></figure>`;
  // Segunda chance: só quando errou, tem a ajuda, ainda não usou nesta pergunta e existe outra pergunta do dia para pôr no lugar
  const podeChance = cls === "bad" && !p.reflexao && !(jogo.trocas && jogo.trocas[jogo.q]) && ajudasDisponiveis().chance > 0 && !!perguntaReserva();
  $("fb").innerHTML = `<div class="feedback ${cls}"><h3>${esc(titulo)}</h3>${texto?`<p>${esc(texto)}</p>`:""}${prova}</div>
    ${podeChance ? `<div class="chance-box"><p><b>${AJUDAS.chance.ic} Quer usar a Segunda chance?</b> Esta pergunta sai e entra outra no lugar, valendo ponto. Você tem ${ajudasDisponiveis().chance}.</p>
      <div class="btn-row"><button class="btn btn-ok" id="chSim">Sim, trocar a pergunta</button><button class="btn btn-ghost" id="prox">${ultima ? "Não, ver resultado" : "Não, próxima pergunta"}</button></div></div>`
    : `<div class="btn-row uma"><button class="btn btn-main" id="prox">${ultima ? "Ver resultado" : "Próxima pergunta"}</button></div>`}`;
  const sim = $("chSim"); if(sim) sim.onclick = usarSegundaChance;
  const prox = $("prox");
  prox.focus({preventScroll:true});
  prox.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  prox.onclick = async ()=>{
    if(ultima){ ocupado(prox, true); jogo.q++; await finalizarQuiz(); }
    else { jogo.q++; telaPergunta(); }
  };
}

const PAG_CACHE = {};

/* Corrida do Rolo: cada dia feito no prazo = 1 passo; com atraso = meio passo.
   No modo trimestre, a pista começa sozinha na primeira lição em que alguém da sala fez quiz (sem configuração). */
function corridaCfg(res, membros){
  const tri = (LICAO && LICAO.trimestre) || TRIMESTRE_BASE;
  const lics = LICOES.filter(l=>l.trimestre===tri);
  const atual = lics.find(l => l.id === (LICOES[indiceLicaoAtual()]||{}).id) || lics[0];
  let inicio = atual ? atual.n : (lics[0] ? lics[0].n : 1);
  if(res){
    const nDe = {}; lics.forEach(l => nDe[l.id] = l.n);
    res.forEach(r => { const n = nDe[r.licaoId]; if(n && n < inicio && (!membros || membros.has(r.uid))) inicio = n; });
  }
  const pista = lics.filter(l => l.n >= inicio);
  return { tri, lics, pista, inicio, atual };
}

      <div class="tabs" role="tablist" style="margin-bottom:${porLicao||porEquipe?"10px":"0"}"><button role="tab" aria-selected="${porLicao}" data-m="licao">Por lição</button><button role="tab" aria-selected="${corridaModo==="tri"}" data-m="tri">Trimestre</button><button role="tab" aria-selected="${porEquipe}" data-m="equipes">Equipes</button></div>
      ${porLicao ? `<div class="field" style="margin:0"><select id="crLic" aria-label="Lição">${cfg.lics.map(l=>`<option value="${l.id}" ${l.id===corridaLicao?"selected":""}>${esc(l.numero)}: ${esc(l.titulo)}${l===cfg.atual?" (esta semana)":""}</option>`).join("")}</select></div>` : ""}
      ${porEquipe ? `<div class="field" style="margin:0"><select id="eqEscopo" aria-label="Período">${cfg.lics.map(l=>`<option value="${l.id}" ${l.id===equipeEscopo?"selected":""}>${esc(l.numero)}: ${esc(l.titulo)}${l===cfg.atual?" (esta semana)":""}</option>`).join("")}<option value="*" ${equipeEscopo==="*"?"selected":""}>Trimestre inteiro</option></select></div>` : ""}
    </section></div>
    <div class="principal" id="rkCorpo"><section class="panel"><p class="vazio">Carregando a pista…</p></section></div></div>`;
  app.querySelectorAll("[data-m]").forEach(b=> b.onclick = ()=>{ corridaModo = b.dataset.m; telaRanking(); });
  const sel = $("crLic"); if(sel) sel.onchange = ()=>{ corridaLicao = sel.value; telaRanking(); };
  $("crSala").onchange = e => { definirSala(e.target.value); telaRanking(); };
  $("crSalas").onclick = ()=> nav("salas");
  const eqs = $("eqEscopo"); if(eqs) eqs.onchange = ()=>{ equipeEscopo = eqs.value; telaRanking(); };
  if(porEquipe){ await telaEquipes(sala, cfg); return; }
  try{
    // Só os resultados desta sala: da lição escolhida ou do trimestre
    const membros = await membrosAtivos(sala);
    const res = await resultadosDaSala(sala, porLicao && licSel ? { licaoId: licSel.id } : { trimestre: cfg.tri });
    if(!$("rkCorpo") || salaAtual().id !== sala.id) return;

    renderCorrida(cfgP, res, pessoasDaSala(sala, res), porLicao ? licSel : null, membros);
  }catch(e){ const el = $("rkCorpo"); if(el) el.innerHTML = `<section class="panel"><p class="erro">${esc(erroMsg(e))}</p></section>`; }
}
function renderCorrida(cfg, res, pessoas, licSel, membros){
  if(membros) res = res.filter(r => membros.has(r.uid));
  // Por lição: cada coluna é um dia (7). Trimestre: cada coluna é uma lição/semana.
  const idsPista = new Set(licSel ? [licSel.id] : cfg.pista.map(l=>l.id));
  const colunas = licSel ? licSel.dias.map(d=> ({ rotulo: d.curto, titulo: d.nome + " " + dataCurta(d.data) })) : cfg.pista.map(l=> ({ rotulo: "L" + l.n, titulo: l.titulo }));
  const TOTAL = Math.max(1, colunas.length * (licSel ? 1 : 7));
  const jov = {};
  res.filter(r => idsPista.has(r.licaoId)).forEach(r=>{
    const u = pessoas[r.uid];
    const j = jov[r.uid] || (jov[r.uid] = { uid:r.uid, nome:(u&&u.nome)||r.nome||"?", profeta:(u&&u.profeta)||r.profeta||"", nivel:(u&&u.nivel)||r.nivel||0, passos:0, pts:0, regs:[] });
    j.passos += r.noPrazo ? 1 : .5; j.pts += r.pts||0; j.regs.push(r);
  });
  const ids = Object.keys(jov).sort((a,b)=> jov[b].passos - jov[a].passos || jov[b].pts - jov[a].pts || jov[a].nome.localeCompare(jov[b].nome,"pt-BR"));
  const fmt1 = n => (Math.round(n*10)/10).toLocaleString("pt-BR");
  let h = "";
  h += `<section class="panel"><h2 class="h3" style="font-size:32px">A pista</h2>`;
  if(!ids.length) h += `<p class="vazio">${licSel ? "Ninguém fez o quiz desta lição ainda." : "A corrida desta sala começa quando chegarem os primeiros resultados do quiz."}</p>`;
  else {
    h += `<div class="escala" style="grid-template-columns:repeat(${colunas.length},1fr)">${colunas.map(c=>`<span title="${esc(c.titulo)}">${esc(c.rotulo)}</span>`).join("")}</div><ol class="lanes">`;
    ids.forEach((id,k)=>{ const j = jov[id];
      h += `<li class="lane ${id===usuario.uid?"eu":""}"><div class="lane-top"><strong>${k<3 && j.passos>0 ? `<span class="pos">${k+1}º</span>` : ""}${esc(j.nome)}${id===usuario.uid?" (você)":""}</strong><span>${fmt1(j.passos)} ${j.passos===1?"passo":"passos"} · ${fmt(j.pts)} pts</span></div>
        <div class="track" style="--seg:${colunas.length}"><span class="flag" aria-hidden="true">🏁</span><div class="runner" style="--p:${Math.min(1, j.passos/TOTAL)}">${avatarSVG(j.profeta || PROFETA_PADRAO, j.nome, j.nivel)}</div></div></li>`; });
    h += `</ol>`;
  }
  h += `</section>`;
  const lic = licSel || cfg.atual;
  if(ids.length && lic){
    const daSemana = ids.map(id => ({ id, regs: jov[id].regs.filter(r=>r.licaoId===lic.id) }));
    const completos = daSemana.filter(x => x.regs.filter(r=>r.noPrazo).length >= 7);
    const emDia = daSemana.filter(x => x.regs.length && x.regs.every(r=>r.noPrazo));
    const topPts = daSemana.map(x=>({ id:x.id, p:x.regs.reduce((s,r)=>s+(r.pts||0),0) })).filter(x=>x.p>0).sort((a,b)=>b.p-a.p)[0];
    const chip = id => `<span class="chip">${avatarSVG(jov[id].profeta || PROFETA_PADRAO, null, jov[id].nivel)}${esc(jov[id].nome)}</span>`;
    h += `<section class="panel"><h2 class="h3" style="font-size:32px">Destaques da lição ${lic.n}</h2><div class="dest">
      <div><h3>Semana completa, 7 de 7</h3>${completos.length ? `<div class="chips">${completos.map(x=>chip(x.id)).join("")}</div>` : `<p class="muted" style="margin:0">Ainda ninguém. Quem vai ser o primeiro?</p>`}</div>
      <div><h3>Tudo no prazo até agora</h3>${emDia.length ? `<div class="chips">${emDia.map(x=>chip(x.id)).join("")}</div>` : `<p class="muted" style="margin:0">Ninguém por enquanto.</p>`}</div>
      ${topPts ? `<div><h3>Mais pontos no quiz</h3><div class="chips">${chip(topPts.id)}</div></div>` : ""}
    </div></section>`;
  }
  h += `<p class="rodape">Atualizado em ${new Date().toLocaleDateString("pt-BR")} às ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</p>`;
  $("rkCorpo").innerHTML = h;
  requestAnimationFrame(()=> $("rkCorpo") && $("rkCorpo").querySelectorAll(".runner").forEach(r => r.style.left = ""));
}

/* ---------- Selfie com o resultado ---------- */
let stream = null, fotoBlob = null;
function pararCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }

function telaSelfie(i){
  pararTimer(); pararCamera();
  app.innerHTML = `<h2 class="selfie-h">#EuEstudoMinhaLição</h2>
    <canvas class="preview" id="prev" width="1080" height="1350" aria-label="Prévia da foto com o resultado"></canvas>
    <video id="vid" playsinline autoplay muted hidden></video>
    <p class="note" id="camMsg">Abrindo a câmera…</p>
    <div class="btn-row">
      <button class="btn btn-main" id="clicar" hidden>Tirar foto</button>
      <label class="btn btn-main" id="abrirCam" hidden>Abrir a câmera<input type="file" accept="image/*" capture="user" id="fileCam" hidden></label>
      <label class="btn btn-ghost">Escolher da galeria<input type="file" accept="image/*" id="fileGal" hidden></label>
      <button class="btn btn-ghost" id="voltarRes">Voltar para o resultado</button>
    </div>`;
  $("voltarRes").onclick = ()=>{ pararCamera(); telaResultado(i); };
  const usarArquivo = e => { const f = e.target.files && e.target.files[0]; if(f) carregarArquivo(f, i); };
  $("fileCam").onchange = usarArquivo;
  $("fileGal").onchange = usarArquivo;
  Promise.all([carregarFontes(), carregarProfetaImg()]).then(()=>{ const pv = $("prev"); if(pv && !stream) desenhar(pv.getContext("2d"), null, i); });
  iniciarCamera(i);
}

async function iniciarCamera(i){
  const msg = $("camMsg");
  const semVideo = ()=>{
    if(!$("prev")) return;
    msg.textContent = "Assim vai ficar a sua foto. Toque em “Abrir a câmera” para tirar a selfie.";
    $("abrirCam").hidden = false;
  };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ semVideo(); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:1280} }, audio:false });
    const vid = $("vid");
    if(!vid){ pararCamera(); return; }
    vid.srcObject = stream;
    await vid.play().catch(()=>{});
    msg.textContent = "Ajuste o rosto na moldura e toque em “Tirar foto”.";
    await carregarFontes();
    const pv = $("prev"), px = pv.getContext("2d");
    const loop = ()=>{
      if(!stream || !$("prev")) return;
      if(vid.videoWidth) desenhar(px, vid, i, true);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    const b = $("clicar"); b.hidden = false;
    b.onclick = ()=>{
      const c = document.createElement("canvas");
      c.width = vid.videoWidth; c.height = vid.videoHeight;
      c.getContext("2d").drawImage(vid, 0, 0);
      pararCamera();
      compor(c, i, true);
    };
  }catch(e){ pararCamera(); semVideo(); }
}

function carregarArquivo(file, i){
  pararCamera();
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{ compor(img, i); URL.revokeObjectURL(url); };
  img.onerror = ()=>{ aviso("Não deu para abrir essa imagem. Tente outra."); URL.revokeObjectURL(url); };
  img.src = url;
}

function rr(x, X, Y, W, H, R){
  x.beginPath(); x.moveTo(X+R, Y); x.arcTo(X+W, Y, X+W, Y+H, R); x.arcTo(X+W, Y+H, X, Y+H, R);
  x.arcTo(X, Y+H, X, Y, R); x.arcTo(X, Y, X+W, Y, R); x.closePath();
}

const FONTES = '"Bebas Neue","Arial Narrow",Impact,sans-serif';
async function carregarFontes(){
  try{ await Promise.all([document.fonts.load('120px "Bebas Neue"'), document.fonts.load('700 40px "Barlow"'), document.fonts.load('italic 600 36px "Barlow"')]); }catch(e){}
}
function desenhar(x, foto, i, espelhar){
  const dia = LICAO.dias[i], r = resDe(LICAO, dia);
  const W = 1080, H = 1350;
  x.save(); x.textAlign = "left"; x.clearRect(0, 0, W, H);
  const BB = '"Bebas Neue","Arial Narrow",Impact,sans-serif', BR = '"Barlow",system-ui,sans-serif';

  // Fundo em degradê da capa
  const g = x.createLinearGradient(0, 0, W*0.45, H);
  g.addColorStop(0, "#524F9C"); g.addColorStop(.55, "#6889AE"); g.addColorStop(1, "#83C6BD");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  // Traço de pena
  x.save(); x.translate(790, 20); x.scale(1.7, 1.7);
  x.strokeStyle = "rgba(255,255,255,.45)"; x.lineWidth = 1.4; x.lineCap = "round"; x.lineJoin = "round";
  ["M152 6 C120 18 84 50 64 100 C56 120 52 140 50 160","M152 6 C146 40 126 78 98 102 C86 112 72 118 58 122","M152 6 C124 28 104 56 86 90","M118 34 C112 40 106 48 100 56 M132 52 C122 60 112 70 104 78","M50 160 C46 176 38 188 26 194 C14 200 8 192 16 186 C34 174 66 190 96 184 C118 180 136 196 150 214"]
    .forEach(d=> x.stroke(new Path2D(d)));
  x.restore();

  // Etiqueta da lição
  x.fillStyle = "#fff"; x.strokeStyle = "#fff"; x.lineWidth = 4; x.textBaseline = "alphabetic";
  x.font = "48px " + BB;
  const tag = LICAO.numero.toUpperCase(), tw = x.measureText(tag).width;
  x.strokeRect(72, 64, tw + 40, 64);
  x.fillText(tag, 92, 114);
  x.fillStyle = "rgba(255,255,255,.85)";
  x.fillText(LICAO.datas.toUpperCase(), 72 + tw + 64, 114);

  // Título
  const palavras = LICAO.titulo.toUpperCase().split(" "), ult = palavras.pop(), ini = palavras.join(" ") + " ";
  let tam = 120;
  x.font = tam + "px " + BB;
  while(x.measureText(ini + ult).width > W - 144 && tam > 50){ tam -= 4; x.font = tam + "px " + BB; }
  const w1 = x.measureText(ini).width;
  let tx = 72;
  x.fillStyle = "#fff"; x.fillText(ini, tx, 256);
  x.fillStyle = "#8FE6FF"; x.fillText(ult, tx + w1, 256);

  // Foto na moldura
  const S = 720, FX = (W - S)/2, FY = 300, B = 18;
  x.save();
  x.translate(W/2, FY + S/2); x.rotate(-0.025); x.translate(-W/2, -(FY + S/2));
  x.shadowColor = "rgba(20,18,60,.35)"; x.shadowBlur = 30; x.shadowOffsetY = 12;
  x.fillStyle = "#fff"; rr(x, FX - B, FY - B, S + 2*B, S + 2*B, 30); x.fill();
  x.shadowColor = "transparent";
  rr(x, FX, FY, S, S, 18); x.clip();
  if(foto){
    const fw = foto.videoWidth || foto.naturalWidth || foto.width, fh = foto.videoHeight || foto.naturalHeight || foto.height;
    const lado = Math.min(fw, fh);
    if(espelhar){ x.translate(FX + S, 0); x.scale(-1, 1); x.translate(-FX, 0); }
    x.drawImage(foto, (fw - lado)/2, (fh - lado)/2, lado, lado, FX, FY, S, S);
  } else if(PROFETA_IMG){
    // Sem selfie: o profeta da pessoa no lugar da foto
    x.fillStyle = "#3B3A78"; x.fillRect(FX, FY, S, S);
    x.fillStyle = "rgba(255,255,255,.10)"; x.beginPath(); x.arc(W/2, FY + S/2 + 40, 300, 0, Math.PI*2); x.fill();
    const ih = S * 0.86, iw = ih * 24/31; x.drawImage(PROFETA_IMG, W/2 - iw/2, FY + S - ih - 30, iw, ih);
  } else {
    x.fillStyle = "#3B3A78"; x.fillRect(FX, FY, S, S);
    x.fillStyle = "rgba(255,255,255,.28)";
    x.beginPath(); x.arc(W/2, FY + 290, 120, 0, Math.PI*2); x.fill();
    x.beginPath(); x.ellipse(W/2, FY + S + 40, 250, 260, 0, Math.PI, 0); x.fill();
    x.fillStyle = "rgba(255,255,255,.85)"; x.textAlign = "center";
    x.font = "64px " + BB; x.fillText("SUA SELFIE AQUI", W/2, FY + 130);
    x.textAlign = "left";
  }
  x.restore();

  // Resultado
  x.textAlign = "center";
  x.font = "150px " + BB;
  const pts = fmt(r.pts), lbl = " PONTOS";
  const pw = x.measureText(pts).width;
  x.font = "70px " + BB; const lw = x.measureText(lbl).width;
  const sx = W/2 - (pw + lw)/2;
  x.textAlign = "left";
  x.font = "150px " + BB; x.fillStyle = "#fff"; x.fillText(pts, sx, 1192);
  x.font = "70px " + BB; x.fillStyle = "#8FE6FF"; x.fillText(lbl, sx + pw, 1192);
  x.textAlign = "center";
  x.font = "700 42px " + BR; x.fillStyle = "#fff";
  x.fillText(dia.nome, W/2, 1254);
  x.font = "italic 600 36px " + BR; x.fillStyle = "rgba(255,255,255,.88)";
  x.fillText(quem(), W/2, 1306);

  x.restore();
}
async function compor(foto, i, espelhar){
  await carregarFontes();
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
  desenhar(c.getContext("2d"), foto, i, espelhar);
  c.toBlob(b=>{ fotoBlob = b; telaFoto(i, c.toDataURL("image/jpeg", .9)); }, "image/jpeg", .9);
}

function nomeArquivo(i){
  const d = LICAO.dias[i].nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  return "quiz-" + LICAO.numero.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-" + d + ".jpg";
}

let PROFETA_IMG = null;
function carregarProfetaImg(){
  return new Promise(res => {
    const svg = meuAvatar().replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ').replace(/class="avatar[^"]*"/, 'width="240" height="310"');
    const img = new Image(); img.onload = ()=>{ PROFETA_IMG = img; res(img); }; img.onerror = ()=> res(null);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
/* Compartilha só a imagem do resultado (sem texto). Sem selfie, usa o profeta. */
async function compartilharImagem(blob, nome){
  const file = new File([blob], nome, { type:"image/jpeg" });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if(e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
  aviso("Imagem salva. Agora é só mandar no grupo do WhatsApp.");
}
async function compartilharCartao(i){
  await carregarFontes(); await carregarProfetaImg();
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
  desenhar(c.getContext("2d"), null, i, false);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .9));
  await compartilharImagem(blob, nomeArquivo(i));
}
function telaFoto(i, src){
  const file = fotoBlob ? new File([fotoBlob], nomeArquivo(i), { type:"image/jpeg" }) : null;
  const podeCompartilhar = !!(file && navigator.canShare && navigator.canShare({ files:[file] }));
  app.innerHTML = `<figure class="foto-final"><img src="${src}" alt="Sua selfie com o resultado de ${esc(LICAO.dias[i].nome)}"></figure>
    <div class="btn-row">
      ${podeCompartilhar ? `<button class="btn btn-wa" id="share">Compartilhar a foto</button>` : ""}
      <button class="btn ${podeCompartilhar ? "btn-ghost" : "btn-main"}" id="salvar">Salvar a foto</button>
      <button class="btn btn-ghost" id="outra">Tirar outra</button>
      <button class="btn btn-ghost" id="voltarRes">Voltar para o resultado</button>
    </div>
    <p class="note">Depois é só mandar a foto no grupo. No celular, você também pode tocar e segurar na imagem para salvar.</p>`;
  window.scrollTo(0,0);
  $("outra").onclick = ()=> telaSelfie(i);
  $("voltarRes").onclick = ()=> telaResultado(i);
  const sh = $("share");
  if(sh) sh.onclick = async ()=>{
    try{ await navigator.share({ files:[file] }); }
    catch(e){ if(e && e.name !== "AbortError") aviso("Não deu para compartilhar daqui. Use “Salvar a foto”."); }
  };
  $("salvar").onclick = ()=>{
    try{ const a = document.createElement("a"); a.href = src; a.download = nomeArquivo(i); document.body.appendChild(a); a.click(); a.remove(); aviso("Foto salva"); }
    catch(e){ aviso("Toque e segure na imagem para salvar."); }
  };
}

const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Android Emoji",sans-serif';
function fundoCartao(x, W, H){
  const g = x.createLinearGradient(0, 0, W*0.45, H);
  g.addColorStop(0, "#524F9C"); g.addColorStop(.55, "#6889AE"); g.addColorStop(1, "#83C6BD");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.translate(790, 20); x.scale(1.7, 1.7);
  x.strokeStyle = "rgba(255,255,255,.45)"; x.lineWidth = 1.4; x.lineCap = "round"; x.lineJoin = "round";
  ["M152 6 C120 18 84 50 64 100 C56 120 52 140 50 160","M152 6 C146 40 126 78 98 102 C86 112 72 118 58 122","M152 6 C124 28 104 56 86 90","M118 34 C112 40 106 48 100 56 M132 52 C122 60 112 70 104 78","M50 160 C46 176 38 188 26 194 C14 200 8 192 16 186 C34 174 66 190 96 184 C118 180 136 196 150 214"]
    .forEach(d=> x.stroke(new Path2D(d)));
  x.restore();
}
function etiqueta(x, texto, extra){
  const BB = FONTES;
  x.fillStyle = "#fff"; x.strokeStyle = "#fff"; x.lineWidth = 4; x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.font = "48px " + BB;
  const tw = x.measureText(texto).width;
  x.strokeRect(72, 64, tw + 40, 64);
  x.fillText(texto, 92, 114);
  if(extra){ x.fillStyle = "rgba(255,255,255,.85)"; x.fillText(extra, 72 + tw + 64, 114); }
}
function quebrar(x, texto, max){
  const out = []; let linha = "";
  texto.split(" ").forEach(w => { const t = linha ? linha + " " + w : w; if(x.measureText(t).width > max && linha){ out.push(linha); linha = w; } else linha = t; });
  if(linha) out.push(linha); return out;
}
/* Todas as conquistas: grade 4×3, as ganhas acesas e as outras apagadas */
function desenharConquistas(x, lista){
  const W = 1080, H = 1350, BB = FONTES, BR = '"Barlow",system-ui,sans-serif';
  const ganhas = lista.filter(c=>c.on).length;
  x.save(); x.clearRect(0, 0, W, H); fundoCartao(x, W, H);
  etiqueta(x, "CONQUISTAS", ganhas + " DE " + lista.length);
  x.fillStyle = "#fff"; x.font = "110px " + BB; x.textAlign = "left";
  x.fillText("MINHAS", 72, 250);
  x.fillStyle = "#8FE6FF"; x.fillText("CONQUISTAS", 72 + x.measureText("MINHAS ").width, 250);
  // Grade
  const cols = 4, rows = 3, GX = 72, GY = 300, GW = W - 144, gap = 18, cw = (GW - gap*(cols-1))/cols, ch = 250;
  lista.forEach((c, k) => {
    const cx = GX + (k % cols) * (cw + gap), cy = GY + Math.floor(k / cols) * (ch + gap);
    x.save();
    if(c.on){ x.shadowColor = "rgba(143,230,255,.45)"; x.shadowBlur = 24; x.fillStyle = "rgba(255,255,255,.22)"; } else x.fillStyle = "rgba(0,0,0,.16)";
    rr(x, cx, cy, cw, ch, 26); x.fill();
    x.shadowColor = "transparent";
    x.strokeStyle = c.on ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.14)"; x.lineWidth = 3; rr(x, cx, cy, cw, ch, 26); x.stroke();
    if(!c.on) x.globalAlpha = .45;
    x.textAlign = "center"; x.textBaseline = "alphabetic";
    x.font = "88px " + EMOJI; x.fillStyle = "#fff"; x.fillText(c.ic, cx + cw/2, cy + 118);
    x.font = "800 24px " + BR; x.fillStyle = "#fff";
    const ls = quebrar(x, c.t, cw - 24);
    ls.forEach((l, i) => x.fillText(l, cx + cw/2, cy + 168 + i*28));
    x.font = "600 18px " + BR; x.fillStyle = "rgba(255,255,255,.8)";
    quebrar(x, c.d, cw - 24).slice(0, 2).forEach((l, i) => x.fillText(l, cx + cw/2, cy + 168 + ls.length*28 + i*22));
    if(!c.on){ x.globalAlpha = 1; x.font = "28px " + EMOJI; x.fillStyle = "rgba(255,255,255,.7)"; x.fillText("🔒", cx + cw - 30, cy + 40); }
    x.restore();
  });
  // Rodapé: profeta + nome
  const fy = GY + rows*ch + (rows-1)*gap + 30;
  if(PROFETA_IMG){ const ih = 150, iw = ih * 24/31; x.drawImage(PROFETA_IMG, 72, fy, iw, ih); }
  x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.font = "700 44px " + BR; x.fillStyle = "#fff"; x.fillText(quem(), 210, fy + 64);
  x.font = "italic 600 32px " + BR; x.fillStyle = "rgba(255,255,255,.88)";
  x.fillText(ganhas === lista.length ? "Todas as conquistas do trimestre!" : ganhas + (ganhas===1 ? " conquista" : " conquistas") + " · " + (nomeProfeta() ? "correndo com " + nomeProfeta() : "Quiz da Lição"), 210, fy + 112);
  x.textAlign = "right"; x.font = "36px " + BB; x.fillStyle = "rgba(255,255,255,.85)"; x.fillText("#EUESTUDOMINHALIÇÃO", W - 72, fy + 172);
  x.restore();
}
/* Uma conquista só, em destaque */
function desenharConquista(x, c){
  const W = 1080, H = 1350, BB = FONTES, BR = '"Barlow",system-ui,sans-serif';
  x.save(); x.clearRect(0, 0, W, H); fundoCartao(x, W, H);
  etiqueta(x, "CONQUISTA", "DESBLOQUEADA");
  // Medalhão
  const cx = W/2, cy = 560;
  x.save(); x.shadowColor = "rgba(143,230,255,.55)"; x.shadowBlur = 60;
  x.fillStyle = "rgba(255,255,255,.18)"; x.beginPath(); x.arc(cx, cy, 300, 0, Math.PI*2); x.fill();
  x.shadowColor = "transparent";
  x.fillStyle = "rgba(255,255,255,.22)"; x.beginPath(); x.arc(cx, cy, 250, 0, Math.PI*2); x.fill();
  x.strokeStyle = "rgba(255,255,255,.85)"; x.lineWidth = 6; x.beginPath(); x.arc(cx, cy, 250, 0, Math.PI*2); x.stroke();
  // Raios
  x.strokeStyle = "rgba(255,255,255,.35)"; x.lineWidth = 4;
  for(let i=0;i<16;i++){ const a = i*Math.PI/8; x.beginPath(); x.moveTo(cx + Math.cos(a)*320, cy + Math.sin(a)*320); x.lineTo(cx + Math.cos(a)*(i%2?360:400), cy + Math.sin(a)*(i%2?360:400)); x.stroke(); }
  x.restore();
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.font = "260px " + EMOJI; x.fillStyle = "#fff"; x.fillText(c.ic, cx, cy + 95);
  // Nome e descrição
  x.font = "120px " + BB; x.fillStyle = "#fff";
  let tam = 120; while(x.measureText(c.t.toUpperCase()).width > W - 144 && tam > 60){ tam -= 4; x.font = tam + "px " + BB; }
  x.fillText(c.t.toUpperCase(), cx, 980);
  x.font = "600 40px " + BR; x.fillStyle = "#8FE6FF"; x.fillText(c.d, cx, 1040);
  // Rodapé
  const fy = 1120;
  if(PROFETA_IMG){ const ih = 150, iw = ih * 24/31; x.drawImage(PROFETA_IMG, 72, fy, iw, ih); }
  x.textAlign = "left";
  x.font = "700 44px " + BR; x.fillStyle = "#fff"; x.fillText(quem(), 210, fy + 64);
  x.font = "italic 600 32px " + BR; x.fillStyle = "rgba(255,255,255,.88)"; x.fillText(nomeProfeta() ? "correndo com " + nomeProfeta() : "Quiz da Lição", 210, fy + 112);
  x.textAlign = "right"; x.font = "36px " + BB; x.fillStyle = "rgba(255,255,255,.85)"; x.fillText("#EUESTUDOMINHALIÇÃO", W - 72, fy + 172);
  x.restore();
}
function slug(t){ return t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
async function gerarCartao(desenho, nome, btn){
  if(btn) ocupado(btn, true);
  try{
    await carregarFontes(); await carregarProfetaImg();
    try{ await document.fonts.load('88px ' + EMOJI); }catch(e){}
    const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
    desenho(c.getContext("2d"));
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .92));
    await compartilharImagem(blob, nome);
  }catch(e){ aviso("Não deu para montar a imagem: " + erroMsg(e)); }
  finally{ if(btn) ocupado(btn, false); }
}
function compartilharConquistas(btn){ const lista = conquistas(); return gerarCartao(x => desenharConquistas(x, lista), "conquistas-" + slug(quem() || "quiz") + ".jpg", btn); }
function compartilharConquista(c, btn){ return gerarCartao(x => desenharConquista(x, c), "conquista-" + slug(c.t) + ".jpg", btn); }

function marcarPendentes(usuarios){
  admPend = usuarios.filter(u => !u.aprovado && !u.admin && !u.master).length;
  const b = document.querySelector('.adm-nav [data-t="aprovar"]'); if(!b) return;
  const n = b.querySelector(".adm-n"); if(n) n.remove();
  if(admPend) b.insertAdjacentHTML("beforeend", `<span class="adm-n" aria-label="${admPend} aguardando">${admPend}</span>`);

/* Painel sozinho na linha ocupa a largura toda (a grade do admin tem 2 colunas em telas largas) */
function ajustarGradeAdmin(c){
  if(!c || !c.classList.contains("adm-c")) return;
  let col = 0, ant = null;
  [...c.children].forEach(el => {
    if(el.classList.contains("larga")){ if(col === 1 && ant) ant.classList.add("larga"); col = 0; ant = null; return; }
    if(col === 0){ col = 1; ant = el; } else { col = 0; ant = null; }
  });
  if(col === 1 && ant) ant.classList.add("larga");
}

function carregarPdfJs(){

  return new Promise((res, rej)=>{ const s = document.createElement("script"); s.src = PDFJS_URL; s.onload = ()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(); }; s.onerror = ()=> rej(new Error("Não deu para carregar o leitor de PDF (sem internet?).")); document.head.appendChild(s); });

let PDF_ATUAL = null, PDF_PAGINAS = [];
async function lerPdf(file, log){
  await carregarPdfJs();

  PDF_ATUAL = pdf; PDF_PAGINAS = [];

    const pg = await pdf.getPage(p), tc = await pg.getTextContent();
    let linha = "", ultY = null, pagina = "";
    tc.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      if(ultY !== null && Math.abs(y - ultY) > 2){ pagina += linha.trimEnd() + "\n"; linha = ""; }
      linha += it.str + (it.hasEOL ? "\n" : "");
      ultY = y;
    });
    pagina += linha;
    PDF_PAGINAS.push({ num: p, texto: pagina });

function classificarPaginas(paginas){
  const marcaDia = { TEXTO:1, PREENDA:2, ENTE:3, PARE:4, PARTILHE:5, SENSO:6 };
  let n = 0, dia = -1; const out = [];
  paginas.forEach(pg => {
    const t = pg.texto, compacto = t.replace(/\s+/g, "");
    const mLic = /Li[çc][ãa]o\s*(\d{1,2})\b/i.exec(t);
    if(/LEIAOTEXTOB[ÍI]BLICO|TEXTO-CHAVE/i.test(compacto) && mLic){ n = +mLic[1]; dia = 0; }
    else { const mm = /(?:^|\n)[ \t]*(?:com[ \t]?(TEXTO|PREENDA|ENTE|PARE|PARTILHE|SENSO)|(TEXTO|PREENDA|ENTE|PARE|PARTILHE|SENSO)\2?[ \t]?com\b)/.exec(t); if(mm && n){ dia = marcaDia[mm[1] || mm[2]]; } }

function dividirLicoes(texto, qtd){
  const re = /(?:^|\n)[ \t]*Li[çc][ãa]o[ \t]+(\d{1,2})\b/gi;
  const todas = []; let m;
  while((m = re.exec(texto))) todas.push({ n:+m[1], index:m.index });
  // Pula o sumário: um bloco inicial com "Lição 1", "Lição 2", "Lição 3"… bem próximos uns dos outros
  let comeco = 0;
  if(todas.length >= 3 && todas[0].n === 1 && todas[1].n === 2 && todas[1].index - todas[0].index < 2500){
    let k = 1; while(k+1 < todas.length && todas[k+1].index - todas[k].index < 2500 && todas[k+1].n === todas[k].n + 1) k++;
    comeco = k + 1;
  }
  const marcas = []; let esperado = 1, ultimo = -1;
  for(let j = comeco; j < todas.length; j++){

    if(n === esperado && (esperado === 1 || m.index - ultimo > 2500)){

      let i = m.index;
      const janela = texto.slice(Math.max(0, i - 1500), i);
      const cap = janela.search(/A partir da tirinha|TEXTO-CHAVE|LEIA O TEXTO B/);

    }

    marcas.forEach((mk, k)=>{ partes.push({ n: mk.n, texto: texto.slice(mk.i, k+1 < marcas.length ? marcas[k+1].i : undefined).trim() }); });
  } else {
    const tam = Math.ceil(texto.length / qtd);
    for(let k=0;k<qtd;k++) partes.push({ n:k+1, texto: texto.slice(k*tam, (k+1)*tam) });
    partes.heuristica = true;
  }
  return partes;
}
const MESES_RE = /janeiro|fevereiro|mar[çc]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro/i;

/* Divide o texto de uma lição nos 7 dias. Usa os marcadores de página ("com TEXTO" = domingo … "com SENSO" = sexta) e, como reserva, os títulos com o nome do dia. */

        const junk = t => !t || /^Li[çc][ãa]o \d+$/.test(t) || /TEXTO|7DX|\//.test(t);

          const id = tri + "-l" + n; await DB.excluirPaginas(id);
          const seqPorDia = {};
          for(const c of porLicao[n]){

      log(`✅ Pronto: ${ok} lição(ões) salva(s)${pulou ? `, ${pulou} mantida(s)` : ""}${pub ? " e publicada(s): o texto já aparece em Estudar." : " como rascunho: para aparecerem em Estudar e no Quiz, publique em \"Cadastrar perguntas\"."} Agora importe as perguntas pela planilha em "Cadastrar perguntas".`);
      await recarregarLicoes();

/* ---------- Planilha de perguntas (modelo e importação) ---------- */
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function carregarXlsx(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res, rej)=>{ const s = document.createElement("script"); s.src = XLSX_URL; s.onload = res; s.onerror = ()=> rej(new Error("Não deu para carregar o leitor de planilhas (sem internet?).")); document.head.appendChild(s); });
}
const CAB_PERG = ["Lição","Dia","Tipo","Pergunta","Opção A","Opção B","Opção C","Opção D","Correta","Referência","Trecho que comprova"];
const CAB_LIC = ["Lição","Título","Datas","Tema Sábado","Tema Domingo","Tema Segunda","Tema Terça","Tema Quarta","Tema Quinta","Tema Sexta"];
async function baixarModelo(){
  await carregarXlsx();
  const wb = XLSX.utils.book_new();
  const instr = [["MODELO DE PERGUNTAS — Quiz da Lição"],[""],
    ["Aba \"Perguntas\": uma linha por pergunta. Até 10 perguntas por dia. Colunas:"],
    ["Lição","número da lição (1 a 13)"],["Dia","Sábado, Domingo, Segunda, Terça, Quarta, Quinta ou Sexta"],["Tipo","Objetiva (tem resposta certa) ou Reflexão (qualquer resposta vale ponto; deixe Correta em branco)"],
    ["Pergunta","o enunciado"],["Opção A a D","as alternativas (mínimo 2)"],["Correta","A, B, C ou D"],["Referência","texto bíblico ou \"Lição de domingo\" (aparece para o jogador)"],["Trecho que comprova","frase curta da lição que confirma a resposta (opcional)"],
    [""],["Aba \"Lições\": uma linha por lição, com título, datas e o tema de cada dia (opcional, mas recomendado)."],
    [""],["Depois de preencher, vá em Admin › Cadastrar perguntas › Importar planilha."],["As linhas de exemplo podem ser apagadas."]];
  const wsI = XLSX.utils.aoa_to_sheet(instr); wsI["!cols"] = [{wch:22},{wch:90}];
  const lics = [CAB_LIC].concat(LICOES_DADOS.map(L => [L.n, L.titulo, L.datas].concat(L.temas)));
  const wsL = XLSX.utils.aoa_to_sheet(lics); wsL["!cols"] = [{wch:7},{wch:30},{wch:30}].concat(Array(7).fill({wch:30}));
  const perg = [CAB_PERG];
  const L1 = LICOES_DADOS[0];
  L1.dias.forEach((qs, k)=> qs.forEach(q => perg.push([L1.n, NOMES_DIAS[k], q.reflexao ? "Reflexão" : "Objetiva", q.p, q.o[0]||"", q.o[1]||"", q.o[2]||"", q.o[3]||"", q.reflexao ? "" : LETRAS[q.c], q.ref||"", q.texto||""])));
  const wsP = XLSX.utils.aoa_to_sheet(perg); wsP["!cols"] = [{wch:7},{wch:10},{wch:10},{wch:60},{wch:28},{wch:28},{wch:28},{wch:28},{wch:8},{wch:26},{wch:60}];
  XLSX.utils.book_append_sheet(wb, wsI, "Instruções");
  XLSX.utils.book_append_sheet(wb, wsP, "Perguntas");
  XLSX.utils.book_append_sheet(wb, wsL, "Lições");
  XLSX.writeFile(wb, "modelo-perguntas-quiz-licao.xlsx");
}
function chave(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function lerLinhas(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", raw:false });
  if(!rows.length) return [];
  const cab = rows[0].map(chave);
  return rows.slice(1).filter(r => r.some(v => String(v).trim())).map(r => { const o = {}; cab.forEach((c,i)=> o[c] = String(r[i] == null ? "" : r[i]).trim()); return o; });
}
async function importarPlanilha(file, tri, ini, substituir, log){
  await carregarXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  const nome = n => wb.SheetNames.find(s => chave(s) === chave(n));
  const wsP = wb.Sheets[nome("Perguntas") || wb.SheetNames[0]], wsL = nome("Lições") ? wb.Sheets[nome("Lições")] : null;
  const linhas = lerLinhas(wsP);
  const porLicao = {}; let ign = 0;
  const ordem = ["sab","dom","seg","ter","qua","qui","sex"];
  linhas.forEach((r, i)=>{
    const n = parseInt(r.licao, 10), k = ordem.indexOf(chave(r.dia).slice(0,3));
    const p = r.pergunta;
    if(!n || k < 0 || !p){ ign++; if(ign <= 5) log(`Linha ${i+2} ignorada (lição, dia ou pergunta em branco).`); return; }
    const refl = /^ref/i.test(chave(r.tipo));
    const o = [r.opcaoa, r.opcaob, r.opcaoc, r.opcaod].map(x=>String(x||"").trim());
    const q = { p, o: o.filter(Boolean).concat(["","","",""]).slice(0,4), ref: r.referencia || "" };
    if(refl) q.reflexao = true;
    else {
      const letra = String(r.correta||"").trim().toUpperCase().charAt(0), c = letra ? "ABCD".indexOf(letra) : -1;
      if(c < 0 || !o[c]){ ign++; log(`Linha ${i+2} ignorada: coluna "Correta" precisa ser A, B, C ou D e apontar para uma opção preenchida.`); return; }
      q.c = c; if(r.trechoquecomprova) q.texto = r.trechoquecomprova.slice(0,400);
    }
    if(o.filter(Boolean).length < 2){ ign++; log(`Linha ${i+2} ignorada: precisa de pelo menos 2 opções.`); return; }
    (porLicao[n] = porLicao[n] || [[],[],[],[],[],[],[]])[k].push(q);
  });
  const infoLic = {};
  if(wsL) lerLinhas(wsL).forEach(r => { const n = parseInt(r.licao, 10); if(n) infoLic[n] = r; });
  const existentes = {}; (await DB.listarLicoes()).forEach(l => existentes[l.id] = l);
  const ns = Object.keys(porLicao).map(Number).sort((a,b)=>a-b);
  let salvas = 0;
  for(const n of ns){
    const id = tri + "-l" + n, antiga = existentes[id], info = infoLic[n] || {};
    const temas = NOMES_DIAS.map((d,k)=> info["tema" + chave(d)] || (antiga && antiga.temas && antiga.temas[k]) || d);
    const doc = Object.assign({ id, trimestre:tri, n, inicio: somarDias(ini, 7*(n-1)), titulo:"Lição " + n, datas:"", resumos:[], textos:[], qtd:[5,5,5,5,5,5,5], status:"rascunho", criadoEm:Date.now(), origem:"planilha" }, antiga || {});
    doc.temas = temas;
    if(info.titulo) doc.titulo = info.titulo; if(info.datas) doc.datas = info.datas;
    const dias = normalizarPerguntas(antiga ? antiga.dias : []);
    const limitar = qs => qs.filter(q=>!q.reflexao).slice(0, 10).concat(qs.filter(q=>q.reflexao).slice(0, 1));
    doc.dias = dias.map((qs, k)=> limitar((substituir || !qs.length) ? porLicao[n][k] : qs.concat(porLicao[n][k])));
    if(!Array.isArray(doc.qtd) || doc.qtd.length !== 7) doc.qtd = [5,5,5,5,5,5,5];
    doc.qtd = doc.qtd.map((v,k)=> Math.max(1, Math.min(+v||5, Math.max(1, doc.dias[k].filter(q=>!q.reflexao).length))));
    doc.atualizadoEm = Date.now();
    await DB.salvarLicao(id, doc); salvas++;
    const tot = doc.dias.reduce((s,d)=>s+d.length,0);
    log(`Lição ${n} "${doc.titulo}": ${tot} perguntas${antiga ? (substituir ? " (substituídas)" : " (acrescentadas)") : " (lição criada como rascunho)"}.`);
  }
  if(ign > 5) log(`… ${ign} linha(s) ignorada(s) no total.`);
  return salvas;
}

      <div class="field"><label for="vDatas">Datas (texto)</label><input type="text" id="vDatas" value="${esc(L.datas||"")}" placeholder="26 de setembro a 2 de outubro"></div><div class="field"><label for="vIni">Sábado inicial</label><input type="date" id="vIni" value="${esc(L.inicio)}"></div></div>
      <div class="tabs dias-adm" role="tablist">${NOMES_DIAS.map((d,k)=>`<button role="tab" aria-selected="${k===valDia}" data-d="${k}">${CURTOS[k]} (${L.dias[k].length})</button>`).join("")}</div>
      <div class="field"><label for="vTema">Tema de ${NOMES_DIAS[valDia]}</label><input type="text" id="vTema" value="${esc(L.temas[valDia])}"></div>
      <div class="field"><label for="vResumo">Resumo do dia (aparece em Estudar)</label><textarea id="vResumo">${esc(L.resumos[valDia]||"")}</textarea></div>
      <details style="margin-bottom:14px"><summary class="muted" style="cursor:pointer;font-weight:700">Texto do dia (${fmt((L.textos[valDia]||"").length)} caracteres)</summary><textarea id="vTexto" style="min-height:160px;margin-top:8px">${esc(L.textos[valDia]||"")}</textarea></details>
      <h3 class="h3">Perguntas de ${NOMES_DIAS[valDia]}</h3>
      <div class="linha-sw" style="border-top:0;padding-top:0"><div class="txt"><strong>Perguntas que aparecem para o jogador</strong><span>${qs.filter(q=>!q.reflexao).length} objetiva(s) cadastrada(s)${qs.some(q=>q.reflexao) ? " + reflexão (sempre no fim)" : ""}. Cada pessoa recebe um sorteio diferente.</span></div><input type="number" id="vQtd" min="1" max="10" value="${L.qtd[valDia]}" style="width:84px;text-align:center;padding:10px"></div>
      <div id="vQs" class="qgrade">${qs.map((q,i)=>cardPergunta(q,i)).join("")}</div>
      ${qs.length ? "" : `<p class="vazio">Nenhuma pergunta neste dia.</p>`}
      <div class="inline"><button class="btn btn-ghost btn-sm" id="vAddQ">+ Pergunta objetiva</button><button class="btn btn-ghost btn-sm" id="vAddR">+ Reflexão</button></div>
      <p class="erro" id="vErro"></p>
      <div class="adm-acoes">
        <button class="btn btn-main" id="vSalvar">Salvar alterações</button>
        <button class="btn ${L.status==="publicada"?"btn-warn":"btn-ok"}" id="vPub">${L.status==="publicada"?"Despublicar (voltar a rascunho)":"Publicar para todos"}</button>
        <button class="btn btn-danger" id="vExcluir">Excluir lição</button>
      </div></section>`;
    $("vVoltar").onclick = ()=>{ coletar(); valId = null; admPerguntas(); };
    c.querySelectorAll("[data-d]").forEach(b=> b.onclick = ()=>{ coletar(); valDia = +b.dataset.d; render(); });
    c.querySelectorAll("[data-rm]").forEach(b=> b.onclick = ()=>{ coletar(); L.dias[valDia].splice(+b.dataset.rm, 1); render(); });
    c.querySelectorAll("[data-up]").forEach(b=> b.onclick = ()=>{ coletar(); const i = +b.dataset.up; if(i>0){ const a = L.dias[valDia]; [a[i-1],a[i]] = [a[i],a[i-1]]; } render(); });
    $("vAddQ").onclick = ()=>{ coletar(); L.dias[valDia].push({p:"", o:["","","",""], c:0, ref:""}); render(); setTimeout(()=>{ const n = c.querySelectorAll(".qcard"); if(n.length) n[n.length-1].scrollIntoView({block:"center"}); }, 50); };
    $("vAddR").onclick = ()=>{ coletar(); L.dias[valDia].push({p:"", o:["","","",""], ref:"", reflexao:true}); render(); };
    $("vSalvar").onclick = ()=> salvar(false);
    $("vPub").onclick = ()=> salvar(true);
    $("vExcluir").onclick = async ()=>{ if(await confirmar("Excluir lição", `Excluir "${L.titulo}" (${L.id})? Os resultados dos jogadores nessa lição continuam salvos.`, "Excluir")){ try{ await DB.excluirLicao(L.id); aviso("Lição excluída"); valId = null; await recarregarLicoes(); admPerguntas(); }catch(e){ $("vErro").textContent = erroMsg(e); } } };
  };
  const coletar = ()=>{
    if(!$("vTitulo")) return;
    L.titulo = $("vTitulo").value.trim() || L.titulo; L.datas = $("vDatas").value.trim(); L.inicio = $("vIni").value || L.inicio;
    L.temas[valDia] = $("vTema").value.trim() || NOMES_DIAS[valDia]; L.resumos[valDia] = $("vResumo").value.trim(); L.textos[valDia] = $("vTexto").value;
    L.qtd[valDia] = Math.max(1, Math.min(10, +$("vQtd").value || 5));
    L.dias[valDia] = Array.from(c.querySelectorAll(".qcard")).map(card=>{
      const refl = card.dataset.r === "1";
      const q = { p: card.querySelector(".qp").value.trim(), o: Array.from(card.querySelectorAll(".qo")).map(x=>x.value.trim()), ref: card.querySelector(".qref").value.trim() };
      if(refl) q.reflexao = true; else { const r = card.querySelector("input[type=radio]:checked"); q.c = r ? +r.value : 0; const t = card.querySelector(".qtx").value.trim(); if(t) q.texto = t; }
      return q;
    });
  };
  const validar = ()=>{
    const probs = [];
    L.dias.forEach((qs,k)=> qs.forEach((q,i)=>{ if(!q.p) probs.push(`${CURTOS[k]} #${i+1}: sem enunciado`); if(q.o.filter(Boolean).length < 2) probs.push(`${CURTOS[k]} #${i+1}: precisa de pelo menos 2 opções`); if(!q.reflexao && !q.o[q.c]) probs.push(`${CURTOS[k]} #${i+1}: a opção marcada como certa está vazia`); }));
    return probs;
  };
  const salvar = async (alternarPub)=>{
    coletar();
    const er = $("vErro"); er.textContent = "";
    L.dias = L.dias.map(qs => qs.map(q => { q.o = q.o.filter(Boolean).concat(["","","",""]).slice(0,4); return q; }));
    const probs = validar();
    const novoStatus = alternarPub ? (L.status==="publicada" ? "rascunho" : "publicada") : L.status;
    if(novoStatus === "publicada" && probs.length){ er.textContent = "Corrija antes de publicar: " + probs.slice(0,4).join("; ") + (probs.length>4 ? ` (+${probs.length-4})` : ""); return; }
    if(novoStatus === "publicada" && L.dias.every(d=>!d.length) && !(await confirmar("Publicar sem perguntas?", "Esta lição não tem nenhuma pergunta. Publicar mesmo assim (só o texto para Estudar)?", "Publicar", "btn-ok"))) return;
    const doc = Object.assign({}, L, { status: novoStatus, atualizadoEm: Date.now(), dias: L.dias.map(qs => qs.map(q => { const o = {p:q.p, o:q.o, ref:q.ref}; if(q.reflexao) o.reflexao = true; else { o.c = q.c; if(q.texto) o.texto = q.texto; } return o; })) });
    try{ await DB.salvarLicao(L.id, doc); L.status = novoStatus; aviso(alternarPub ? (novoStatus==="publicada" ? "Lição publicada!" : "Lição voltou para rascunho") : "Alterações salvas"); await recarregarLicoes(); render(); }
    catch(e){ er.textContent = erroMsg(e); }
  };
  render();
}
function cardPergunta(q, i){
  const refl = !!q.reflexao;
  return `<div class="qcard" data-r="${refl?1:0}"><div class="num"><span>${i+1}. ${refl ? "Reflexão" : "Objetiva"}</span><span class="inline"><button class="btn btn-ghost btn-sm" data-up="${i}" title="Subir">↑</button><button class="btn btn-ghost btn-sm" data-rm="${i}" title="Remover">🗑️</button></span></div>
    <div class="campo"><label>Pergunta</label><textarea class="qp">${esc(q.p)}</textarea></div>
    ${q.o.map((o,k)=>`<div class="opt">${refl ? `<span class="muted">${LETRAS[k]}</span>` : `<input type="radio" name="c${i}" value="${k}" ${q.c===k?"checked":""} title="Marcar como certa">`}<input type="text" class="qo" value="${esc(o)}" placeholder="Opção ${LETRAS[k]}"></div>`).join("")}
    <div class="campo" style="margin-top:8px"><label>Referência${refl?" (opcional)":""}</label><input type="text" class="qref" value="${esc(q.ref||"")}" placeholder="Gênesis 3:9 ou Lição de domingo" style="padding:9px 12px;font-size:15px"></div>
    ${refl ? "" : `<div class="campo"><label>Trecho que comprova a resposta (opcional)</label><textarea class="qtx">${esc(q.texto||"")}</textarea></div>`}
  </div>`;
}
async function recarregarLicoes(){
  try{ LICOES_DB = await DB.listarLicoes(); }catch(e){}
  const idAtual = LICAO && LICAO.id;
  montarLicoes();
  LICAO = LICOES.find(l=>l.id===idAtual) || LICOES[indiceLicaoAtual()];
  estudoLicao = null;
}

  $("admC").innerHTML = `<section class="panel larga"><h3 class="h3">Ícone do site</h3>
    <div class="adm-duo"><div class="adm-a"><p class="muted small" style="margin-top:0">Escolha uma imagem quadrada (PNG, JPG ou SVG, de preferência 512×512). Ela vira o ícone da aba do navegador, dos favoritos e do atalho na tela inicial do celular, para todo mundo que abrir o site.</p>
    <div id="icPrev">${prev(atual)}</div></div><div class="adm-b">
    <div class="field"><label for="icArq">Nova imagem</label><input type="file" id="icArq" accept="image/png,image/jpeg,image/webp,image/svg+xml,.png,.jpg,.jpeg,.webp,.svg"></div>
    <p class="erro" id="icErro"></p>
    <div class="adm-acoes"><button class="btn btn-main" id="icSalvar" disabled>Salvar ícone</button><button class="btn btn-ghost" id="icPadrao" ${atual?"":"disabled"}>Voltar ao ícone padrão</button></div>
    </div></div></section>`;
  let novo = "";
  $("icArq").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    $("icErro").textContent = "";
    try{ novo = await redimensionarIcone(f, 320); $("icPrev").innerHTML = prev(novo); $("icSalvar").disabled = false; }
    catch(err){ $("icErro").textContent = err.message; novo = ""; $("icSalvar").disabled = true; }
  };
  $("icSalvar").onclick = async ()=>{
    if(!novo) return; ocupado($("icSalvar"), true);
    try{ await DB.salvarConfig({icone:novo}); CONFIG.icone = novo; aplicarIcone(novo); aviso("Ícone salvo! Pode levar alguns minutos para o navegador atualizar a aba."); admIcone(); }
    catch(e){ $("icErro").textContent = erroMsg(e); ocupado($("icSalvar"), false); }
